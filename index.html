    if(Math.random() < .055 + Math.max(0,edge)*.05) y += R(12, 45);
    if(Math.random() < .012*fx.fum){ res.type='fumble'; res.yards=Math.round(clamp(y,-3,6)); return res; }
    res.type='run'; res.yards=Math.round(y);
    res.oob = oc==='or' && Math.random() < .3;
    return res;
  }
  const p = PASS_PARAMS[oc];
  const edge = (offPass(off) - defPass(def))/100 + envE;
  let sack = p.sack + (dc==='bl' ? .05 : 0) - edge*.03;
  if(oc==='sc') sack *= .4;
  if(Math.random() < Math.max(.01, sack)){
    res.type='sack'; res.yards = -RI(4,9);
    if(Math.random() < .07*fx.fum){ res.type='fumble'; }
    return res;
  }
  let intc = p.int + (dc==='bl' ? .008 : 0) + (dc==='ni' && (oc==='mp'||oc==='sp') ? .012 : 0) - edge*.025 + fx.int;
  if(Math.random() < Math.max(.004, intc)){
    res.type='int'; res.yards = Math.round(p.mean*.7); return res;
  }
  let comp = p.comp + edge*.32 + mod*.02 + (dc==='pr' && oc!=='dp' ? .06 : 0) + (dc==='pr' && oc==='dp' ? -.14 : 0) + fx.comp + (oc==='dp' ? fx.deep : (oc==='pa'||oc==='mp') ? fx.deep*.5 : 0);
  if(Math.random() > clamp(comp,.12,.95)){ res.type='inc'; res.yards=0; return res; }
  let y = p.mean + mod + edge*9 + gauss()*p.sd;
  if(oc!=='dp' && Math.random() < .05 + Math.max(0,edge)*.05) y += R(10,35);
  res.type='pass'; res.yards=Math.round(Math.max(oc==='sc'? -4 : 0, y));
  res.oob = Math.random() < .28;
  return res;
}

function runoff(res){
  if(GM.pending) return;
  let t;
  if(res.type==='inc') t = 7;
  else if(res.oob) t = GM.hurry ? 9 : 14;
  else t = GM.hurry ? 17 : 37;
  GM.clock -= t;
  if(GM.clock <= 0) endQuarter();
}
function endQuarter(){
  GM.clock = Q_LEN;
  GM.q++;
  if(GM.q === 3){
    logQ('Halftime. ' + tName(GM.openRecv===GM.home?GM.away:GM.home) + ' receive the second-half kickoff.');
    startPossession(GM.openRecv === GM.home ? GM.away : GM.home, 25);
    return;
  }
  if(GM.q === 5){
    if(GM.hs !== GM.as){ finishGame(); return; }
    if(GM.preseason){ if(Math.random()<.5) GM.hs+=3; else GM.as+=3; finishGame(); return; }
    GM.ot = true; GM.clock = Q_LEN;
    logQ('OVERTIME — next score wins.');
    startPossession(Math.random()<.5 ? GM.home : GM.away, 25);
    return;
  }
  if(GM.q > 5){
    if(GM.hs === GM.as){ if(Math.random()<.5) GM.hs+=3; else GM.as+=3; }
    finishGame(); return;
  }
  logQ(['','','2nd Quarter','3rd Quarter','4th Quarter'][GM.q] || 'Quarter ' + GM.q);
}
function startPossession(teamIdx, spot){
  GM.poss = teamIdx; GM.spot = spot; GM.down = 1; GM.dist = 10;
}
function pickWeighted(players){
  if(!players || !players.length) return null;
  const w = players.map(p => Math.pow(p.rating, 1.6));
  const sum = w.reduce((a,b)=>a+b, 0);
  let r = Math.random()*sum;
  for(let i=0;i<players.length;i++){ r -= w[i]; if(r<=0) return players[i]; }
  return players[players.length-1];
}
function creditLive(teamIdx, p, delta){
  if(!p || !GM || !GM.liveBox) return;
  if(!GM.liveBox[teamIdx]) GM.liveBox[teamIdx] = {};
  if(!GM.liveBox[teamIdx][p.id]) GM.liveBox[teamIdx][p.id] = { id:p.id, name:p.name, pos:p.pos, gp:1, py:0,ptd:0,ry:0,rtd:0,cy:0,ctd:0,tk:0,sk:0,int:0,ff:0,fgm:0 };
  const line = GM.liveBox[teamIdx][p.id];
  Object.keys(delta).forEach(k => { line[k] = (line[k]||0) + delta[k]; });
}
function attributePlay(res, offIdx, dIdx, isTD){
  if(!GM || !GM.liveBox) return;
  const off = G.teams[offIdx], def = G.teams[dIdx];
  const oLu = lineupFor(off, offFormOf(off), offFormKeyOf(off));
  const dLu = lineupFor(def, defFormOf(def), defFormKeyOf(def));
  const qbSlot = oLu.find(s => s.spot==='QB' && s.p);
  const qb = qbSlot ? qbSlot.p : null;
  const rbs = oLu.filter(s => s.spot==='RB' && s.p).map(s => s.p);
  const recvs = oLu.filter(s => (s.spot==='WR'||s.spot==='TE') && s.p).map(s => s.p);
  const lbs = dLu.filter(s => s.p && s.p.pos==='LB').map(s => s.p);
  const dls = dLu.filter(s => s.p && s.p.pos==='DL').map(s => s.p);
  const cbs = dLu.filter(s => s.p && s.p.pos==='CB').map(s => s.p);
  const ss = dLu.filter(s => s.p && s.p.pos==='S').map(s => s.p);
  const defenders = lbs.concat(dls, cbs, ss);

  if(res.type === 'run'){
    const carrier = res.carrier || pickWeighted(rbs) || qb;
    if(carrier) creditLive(offIdx, carrier, { ry: res.yards, rtd: isTD?1:0 });
    const tackler = pickWeighted(defenders);
    if(tackler && res.yards <= 8) creditLive(dIdx, tackler, { tk: 1 });
  } else if(res.type === 'pass'){
    if(qb) creditLive(offIdx, qb, { py: res.yards, ptd: isTD?1:0 });
    const target = res.target || pickWeighted(recvs);
    if(target) creditLive(offIdx, target, { cy: res.yards, ctd: isTD?1:0 });
    if(!isTD){
      const tackler = pickWeighted(defenders);
      if(tackler) creditLive(dIdx, tackler, { tk: 1 });
    }
  } else if(res.type === 'int'){
    const picker = pickWeighted(cbs.concat(ss));
    if(picker) creditLive(dIdx, picker, { int: 1 });
  } else if(res.type === 'sack'){
    const sacker = pickWeighted(dls.concat(lbs));
    if(sacker) creditLive(dIdx, sacker, { sk: 1 });
  } else if(res.type === 'fumble'){
    const forcer = pickWeighted(defenders);
    if(forcer) creditLive(dIdx, forcer, { ff: 1 });
  }
}
function applyPlay(res){
  const offName = G.teams[GM.poss].abbr;
  const offIdxAtSnap = GM.poss, dIdxAtSnap = defIdx();
  if(userOnO()){ if(OFF_PLAYS[res.oc].fam==='run') GM.runTend++; else GM.passTend++; }
  if(res.type==='int' || res.type==='fumble'){
    const spotAfter = clamp(GM.spot + res.yards, 1, 99);
    logMsg(offName + ' — ' + (res.type==='int' ? 'INTERCEPTED! ' : 'FUMBLE! ') + tName(defIdx()) + ' take over.', 'bad');
    if(userOnO()) fieldFlash(res.type==='int' ? 'Intercepted!' : 'Fumble!', 'opp');
    else fieldFlash(res.type==='int' ? 'Interception!' : 'Fumble!', 'td');
    attributePlay(res, offIdxAtSnap, dIdxAtSnap, false);
    startPossession(defIdx(), 100 - spotAfter);
    runoff({type:'to'});
    return;
  }
  if(res.type==='inc'){
    logMsg(offName + ' — ' + OFF_PLAYS[res.oc].label + ': incomplete.');
    GM.down++;
  } else {
    const newSpot = GM.spot + res.yards;
    const isTD = newSpot >= 100;
    if(newSpot <= 0){
      addPts(defIdx(), 2);
      logMsg('SAFETY! ' + tName(defIdx()) + ' get 2.', 'bad');
      attributePlay(res, offIdxAtSnap, dIdxAtSnap, false);
      runoff(res);
      startPossession(defIdx(), 35);
      updateGameUI(); return;
    }
    if(isTD){ GM.spot = 99; attributePlay(res, offIdxAtSnap, dIdxAtSnap, true); touchdown(res); return; }
    attributePlay(res, offIdxAtSnap, dIdxAtSnap, false);
    GM.spot = newSpot;
    GM.dist -= res.yards;
    if(res.type==='sack'){ if(userOnO()) fieldFlash('Sacked!','opp'); else fieldFlash('Sack!','fd'); }
    const verb = res.type==='run' ? OFF_PLAYS[res.oc].label : (res.type==='sack' ? 'SACKED' : OFF_PLAYS[res.oc].label);
    logMsg(offName + ' — ' + verb + ': ' + (res.yards>=0?'+':'') + res.yards + ' yds' + (res.oob?' (out of bounds)':'') + '.', res.yards>=15?'big':null);
    if(GM.dist <= 0){ GM.down=1; GM.dist=Math.min(10,100-GM.spot); logMsg('First down, '+offName+'.'); if(userOnO()) fieldFlash('First Down','fd'); }
    else GM.down++;
  }
  if(GM.down > 4){
    logMsg('Turnover on downs! ' + tName(defIdx()) + ' ball.', 'bad');
    startPossession(defIdx(), 100 - GM.spot);
  }
  runoff(res);
}
function touchdown(res){
  addPts(GM.poss, 6);
  logMsg('TOUCHDOWN ' + tName(GM.poss).toUpperCase() + '!', 'big');
  if(GM.poss === G.userTeam) fieldFlash('Touchdown!','td');
  else fieldFlash('Touchdown ' + G.teams[GM.poss].abbr, 'opp');
  GM.pending = 'try';
  if(!userOnO()){
    const diff = GM.poss===GM.home ? GM.hs-GM.as : GM.as-GM.hs;
    const goTwo = (diff === -2 || diff === -8 || diff === 5 || diff === -5) && GM.q >= 4;
    doTry(goTwo ? '2pt' : 'xp');
  } else if(coachSimActive){
    coachSimStep();
  } else {
    updateGameUI();
  }
}
function doTry(kind){
  GM.pending = null;
  const t = offT();
  if(kind==='xp'){
    const make = Math.random() < .90 + (kRating(t)-75)*.003;
    if(make){ addPts(GM.poss,1); logMsg('Extra point is good.'); fieldFlash('Kick is Good','fd'); }
    else { logMsg('Extra point MISSED!', 'bad'); fieldFlash('No Good','opp'); }
  } else {
    const edge = (offPass(t)-defPass(defT()))/100;
    if(Math.random() < .46 + edge*.35){ addPts(GM.poss,2); logMsg('Two-point conversion is GOOD!', 'big'); fieldFlash('Two-Point Good!','fd'); }
    else { logMsg('Two-point try fails.', 'bad'); fieldFlash('No Good','opp'); }
  }
  startPossession(GM.poss===GM.home?GM.away:GM.home, 25);
  GM.clock -= 4; if(GM.clock<=0) endQuarter();
  checkAITurn(); updateGameUI();
}
function doFG(){
  const dist = (100 - GM.spot) + 17;
  const k = kRating(offT());
  const kfx = wxFx(GM.wx);
  const p = clamp(.99 - Math.max(0, dist-kfx.kickDist-20)*.0135 + (k-75)*.004 + kfx.kickAcc, .05, .99);
  GM.clock -= 6;
  if(Math.random() < p){
    addPts(GM.poss, 3);
    const kLu = lineupFor(offT(), offFormOf(offT()), offFormKeyOf(offT()));
    const kSlot = kLu.find(s => s.spot==='K' && s.p);
    if(kSlot) creditLive(GM.poss, kSlot.p, { fgm: 1 });
    logMsg(dist + '-yd field goal is GOOD. ' + G.teams[GM.poss].abbr + ' +3.', 'big');
    fieldFlash('Kick is Good','fd');
    startPossession(GM.poss===GM.home?GM.away:GM.home, 25);
  } else {
    logMsg(dist + '-yd field goal is NO GOOD.', 'bad');
    fieldFlash('No Good','opp');
    startPossession(defIdx(), clamp(100-GM.spot+7, 20, 80));
  }
  if(GM.clock<=0) endQuarter();
  checkAITurn(); updateGameUI();
  if(coachSimPausedFor4th || coachSimPausedForPlayer){ coachSimPausedFor4th = false; coachSimPausedForPlayer = false; coachSimStep(); }
}
function doPunt(){
  const pfx = wxFx(GM.wx);
  const net = Math.max(18, Math.round(RI(35,48) + pfx.punt + gauss()*pfx.puntVar));
  const land = clamp(GM.spot + net, 0, 99);
  const oppSpot = land >= 99 ? 20 : 100 - land;
  logMsg(G.teams[GM.poss].abbr + ' punt ' + net + ' yds' + (land>=99?' — touchback':'') + '.');
  GM.clock -= 12;
  startPossession(defIdx(), oppSpot);
  if(GM.clock<=0) endQuarter();
  checkAITurn(); updateGameUI();
  if(coachSimPausedFor4th || coachSimPausedForPlayer){ coachSimPausedFor4th = false; coachSimPausedForPlayer = false; coachSimStep(); }
}
function doKneel(){
  GM.clock -= 40; GM.down++;
  logMsg(G.teams[GM.poss].abbr + ' kneel it.');
  if(GM.clock<=0) endQuarter();
  else if(GM.down>4){ startPossession(defIdx(), 100-GM.spot); }
  checkAITurn(); updateGameUI();
}
let busy = false;
let simFast = false; // true only inside Sim Quarter / Sim to Final loops — suppresses field flashes
function userCall(code){
  if(busy || !GM || GM.over) return;
  busy = true;
  let oc, dc;
  if(userOnO()){ oc = code; dc = aiDefCall(); }
  else { dc = code; oc = GM.down===4 ? null : aiOffCall(); }
  if(!userOnO() && GM.down === 4){
    const choice = aiFourthDown();
    if(choice==='punt'){ busy=false; doPunt(); return; }
    if(choice==='fg'){ busy=false; doFG(); return; }
    oc = aiOffCall();
  }
  const res = resolvePlay(oc, dc);
  animatePlay(res, () => {
    applyPlay(res);
    busy = false;
    if(GM.q >= 5 && GM.ot && GM.hs !== GM.as){ finishGame(); return; }
    checkAITurn();
    updateGameUI();
    if(coachSimPausedFor4th || coachSimPausedForPlayer){ coachSimPausedFor4th = false; coachSimPausedForPlayer = false; coachSimStep(); }
  });
}
function checkAITurn(){
  if(!GM || GM.over || GM.pending) return;
  if(GM.ot && GM.hs !== GM.as){ finishGame(); return; }
}
function finishGame(){
  if(GM.over) return;
  GM.over = true;
  logQ('FINAL — ' + tName(GM.home) + ' ' + GM.hs + ', ' + tName(GM.away) + ' ' + GM.as + '.');
  updateGameUI();
  setTimeout(showFinal, 600);
}
function gameResult(){ return {a:GM.home, b:GM.away, as:GM.hs, bs:GM.as}; }
/* ---------- coach sim mode: auto-play with pauses at real decision points ---------- */
let coachSimActive = false, coachSimLastQ = 0, coachSimAwaitingBreak = false, coachSimPausedFor4th = false, coachSimPausedForPlayer = false;
function toggleCoachSim(){
  coachSimActive = !coachSimActive;
  coachSimAwaitingBreak = false; coachSimPausedFor4th = false; coachSimPausedForPlayer = false;
  if(coachSimActive){ coachSimLastQ = GM.q; coachSimStep(); }
  else updateGameUI();
}
function coachSimResume(){ coachSimAwaitingBreak = false; coachSimStep(); }
function coachSimStep(){
  if(!coachSimActive || !GM || GM.over || busy) return;
  if(GM.q !== coachSimLastQ){
    coachSimLastQ = GM.q;
    coachSimAwaitingBreak = true;
    logQ('⏸ '+(G.mode==='player'?'Sim to Player':'Coach Sim')+' — quarter break. Review your lineup, then continue.');
    updateGameUI();
    return;
  }
  if(userOnO() && GM.down === 4 && !GM.pending){
    coachSimPausedFor4th = true;
    logMsg('⏸ '+(G.mode==='player'?'Sim to Player':'Coach Sim')+' paused — your call on 4th down.', 'q');
    updateGameUI(); // buildCallsheet shows the normal Go/Punt/FG choice; resolving it resumes coach sim
    return;
  }
  if(G.mode === 'player' && userOnO() && !GM.pending && playerLiveMechanic() !== 'auto'){
    coachSimPausedForPlayer = true;
    logMsg('⏸ Sim to Player — you\'re on the field. Take the snap.', 'q');
    updateGameUI(); // buildCallsheet falls through to renderPlayerOffenseCallsheet()'s live QB minigame
    return;
  }
  if(GM.pending){
    if(G.mode === 'player' && userOnO()){
      const myP = mePlayer();
      if(myP && myP.pos === 'K'){
        coachSimPausedForPlayer = true;
        logMsg('⏸ Sim to Player — extra point. Take your kick.', 'q');
        updateGameUI();
        return;
      }
    }
    busy = true; doTry(Math.random() < .88 ? 'xp' : '2pt'); busy = false; coachSimStep(); return;
  }
  if(GM.down === 4 && !userOnO()){
    const choice = aiFourthDown();
    if(choice==='punt'){ doPunt(); coachSimStep(); return; }
    if(choice==='fg'){ doFG(); coachSimStep(); return; }
  }
  busy = true;
  const res = resolvePlay(aiOffCall(), aiDefCall());
  animatePlay(res, () => {
    applyPlay(res);
    busy = false;
    if(GM.q >= 5 && GM.ot && GM.hs !== GM.as){ finishGame(); return; }
    updateGameUI();
    coachSimStep();
  });
}
function simQuarter(){
  if(!GM || GM.over) return;
  simFast = true;
  const startQ = GM.q;
  let guard = 200;
  while(!GM.over && GM.q === startQ && guard-- > 0){
    if(GM.pending){ doTry('xp'); continue; }
    if(GM.down === 4){
      const c = aiFourthDown();
      if(c==='punt'){ doPunt(); continue; }
      if(c==='fg'){ doFG(); continue; }
    }
    const res = resolvePlay(aiOffCall(), aiDefCall());
    applyPlay(res);
    if(GM.q >= 5 && GM.ot && GM.hs !== GM.as){ finishGame(); break; }
  }
  if(!GM.over && guard <= 0) finishGame();
  simFast = false;
  updateGameUI();
}
function simRest(){
  if(!GM || GM.over) return;
  simFast = true;
  let guard = 500;
  while(!GM.over && guard-- > 0){
    if(GM.pending){ doTry('xp'); continue; }
    if(GM.down === 4){
      const c = aiFourthDown();
      if(c==='punt'){ doPunt(); continue; }
      if(c==='fg'){ doFG(); continue; }
    }
    const res = resolvePlay(aiOffCall(), aiDefCall());
    applyPlay(res);
    if(GM.q >= 5 && GM.ot && GM.hs !== GM.as){ finishGame(); break; }
  }
  if(!GM.over && guard <= 0) finishGame();
  simFast = false;
  updateGameUI();
}

const FW = 1060, FH = 500, ISO_W = 1000, ISO_H = 680;
const xAt = y => 105 + y * 8.5;
const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let ISO_ANGLE = Math.PI/6, ISO_TILE = 2.5, ISO_CX = 500, ISO_CY = 340, ISO_ZOOM = 1, ISO_VZ = 1, ISO_CAM = 'TV';
function isoResetCamera(){ ISO_ANGLE=Math.PI/6; ISO_TILE=2.5; ISO_ZOOM=1; ISO_VZ=1; ISO_CAM='TV'; ISO_CX=500; ISO_CY=340; }
function proj(wx, wy, wz){
  wz = wz || 0;
  const x=wx*ISO_TILE*ISO_ZOOM, y=wy*ISO_TILE*ISO_ZOOM;
  return {x:ISO_CX+(x-y)*Math.cos(ISO_ANGLE), y:ISO_CY+(x+y)*Math.sin(ISO_ANGLE)-wz*ISO_TILE*ISO_ZOOM};
}
function legacyToIso(x,y,z){ return proj((x-105)/8.5 + 10, (y-250)/8.63, z==null?.3:z); }
function isoPoly(points, fill, attrs){

}
function isoLine(a,b,stroke,width,opacity){
  const p=proj(a[0],a[1],a[2]||0), q=proj(b[0],b[1],b[2]||0);
  return '<line x1="'+p.x.toFixed(1)+'" y1="'+p.y.toFixed(1)+'" x2="'+q.x.toFixed(1)+'" y2="'+q.y.toFixed(1)+'" stroke="'+stroke+'" stroke-width="'+(width||1.5)+'" opacity="'+(opacity==null?1:opacity)+'"/>';
}
function isoText(wx,wy,text,fill,size,rotate){

}
function ringBand(inset0,inset1,color,zlift,attrs){
  const inner=[[-inset0,-26.65-inset0],[120+inset0,-26.65-inset0],[120+inset0,26.65+inset0],[-inset0,26.65+inset0]];
  const outer=[[-inset1,-26.65-inset1],[120+inset1,-26.65-inset1],[120+inset1,26.65+inset1],[-inset1,26.65+inset1]];
  let out=''; for(let i=0;i<4;i++){const j=(i+1)%4;out+=isoPoly([[inner[i][0],inner[i][1],zlift||0],[inner[j][0],inner[j][1],zlift||0],[outer[j][0],outer[j][1],zlift||0],[outer[i][0],outer[i][1],zlift||0]],color,attrs);} return out;
}

  } else { to(RB,.4, x0-52, mid+32); to(RB,1, x0-54, mid+34+R(-5,5)); }

  /* ---- receivers: routes by play call; target's route bends through the catch point ---- */
  [WRT,WRB,SLOT,TEr].forEach(r=>{
    const dir = r.y0i < mid ? 1 : -1;
    if(playIsRun || res.oc==='sc'){ to(r,.5, r.x0i+18, r.y0i+dir*10); to(r,1, r.x0i+24+R(-4,4), r.y0i+dir*12+R(-5,5)); return; }
    if(r===target) return;
    if(res.oc==='sp'){ to(r,.25, r.x0i+3*PXY, r.y0i); to(r,.95, r.x0i+11*PXY, r.y0i+dir*80); }
    else if(res.oc==='mp'){ to(r,.45, r.x0i+dpx, r.y0i+dir*6); to(r,.65, r.x0i+dpx-10, r.y0i+dir*26); to(r,1, r.x0i+dpx-8, r.y0i+dir*28); }
    else { to(r,1, r.x0i+dpx+34, r.y0i+dir*14); }
  });
  if(target && target!==RB){
    const dir = target.y0i < mid ? 1 : -1;
    target.wp = [{t:0, x:target.x0i, y:target.y0i}];
    to(target, tCatch*.55, target.x0i + dpx*.6, target.y0i + dir*Math.min(30, Math.abs(yAir-target.y0i)*.4));
    to(target, tCatch, xAir, yAir);
    if(res.type==='pass') to(target,1, xEnd, yEnd);
    else if(res.type==='int') to(target,.85, xAir-12, yAir+dir*6);
    else to(target,.9, xAir+18, yAir+dir*12);
  }

  /* ---- linebackers: blitz, plug the run, or drop into zones by the D call ---- */
  LBs.forEach((l,i)=>{
    if(!playIsRun && res.dc==='bl' && i!==1){ to(l,.55, x0-34+R(-6,6), CYf(mid+(i-1)*42)); }
    else if(playIsRun || res.dc==='st'){ to(l,.5, l.x0i-18, CYf(l.y0i+(yEnd-l.y0i)*.35)); }
    else { to(l,.55, l.x0i+(res.dc==='pr'?55:34), l.y0i+R(-12,12)); }
  });

  /* ---- corners trail their receiver; safeties deepen or come downhill ---- */
  [[CBT,WRT],[CBB,WRB]].forEach(pr=>{
    const c=pr[0], w=pr[1];
    if(playIsRun){ to(c,.65, x0+10, c.y0i+(mid-c.y0i)*.25); }
    else { const we=w.wp[w.wp.length-1]; to(c,.9, we.x+15, we.y+(c.y0i<mid?-11:11)); }
  });
  [S1,S2].forEach(sf=>{
    if(playIsRun) to(sf,.6, x0+30, CYf(sf.y0i+(yEnd-sf.y0i)*.5));
    else to(sf,.45, sf.x0i+42, sf.y0i+R(-8,8));
  });

  /* ---- sack: one rusher breaks through and rides the QB down ---- */
  if(sackLike){
    const rusher = res.dc==='bl' ? LBs[0]
      : DLs.reduce((b,d)=>Math.abs(d.y0i-mid)<Math.abs(b.y0i-mid)?d:b, DLs[0]);
    rusher.wp = [{t:0,x:rusher.x0i,y:rusher.y0i}];
    to(rusher,.5, x0-30-drop*.5, mid+R(-10,10));
    to(rusher,.72, xEnd+8, CYf(mid+gauss()*22));
    to(rusher,1, xEnd+6, CYf(mid+gauss()*22));
  }

  /* ---- interception: nearest DB jumps the route and heads the other way ---- */
  let picker = null;
  if(res.type==='int'){
    const dbs=[CBT,CBB,S1,S2,LBs[1]];
    picker = dbs.reduce((b,d)=>Math.hypot(d.x0i-xAir,d.y0i-yAir)<Math.hypot(b.x0i-xAir,b.y0i-yAir)?d:b, dbs[0]);
    picker.wp = [{t:0,x:picker.x0i,y:picker.y0i}];
    to(picker,tCatch, xAir, yAir);
    to(picker,1, xAir-46, CYf(yAir+gauss()*24));
  }

  /* ---- pursuit: the three nearest defenders converge on the tackle point (trail on a TD) ---- */
  if(res.type==='run' || res.type==='pass' || (res.type==='fumble' && playIsRun)){
    const ring=[[15,0],[-7,17],[-7,-17]];
    [...DLs,...LBs,CBT,CBB,S1,S2].filter(d=>d!==picker)
      .map(d=>({d, dist:Math.hypot(d.x0i-xEnd, d.y0i-yEnd)}))
      .sort((a,b)=>a.dist-b.dist).slice(0,3)
      .forEach((x,i)=>{
        const o=ring[i];
        to(x.d, 1, xEnd+o[0]+(td?-26:0), yEnd+o[1]);
      });
  }

  /* ---- render: 22 split-color dots + ball + trail ---- */
  const NS='http://www.w3.org/2000/svg';
  actors.forEach(a=>{
    const g=document.createElementNS(NS,'g');
    {const p=legacyToIso(a.x0i,a.y0i,.35);g.setAttribute('transform','translate('+p.x+','+p.y+')');}
    const half1=document.createElementNS(NS,'path');
    half1.setAttribute('d','M 0 -9 A 9 9 0 0 1 0 9 Z'); half1.setAttribute('fill',a.c1);
    const half2=document.createElementNS(NS,'path');
    half2.setAttribute('d','M 0 -9 A 9 9 0 0 0 0 9 Z'); half2.setAttribute('fill',a.c2);
    const ring=document.createElementNS(NS,'circle');
    ring.setAttribute('r','9'); ring.setAttribute('fill','none');
    ring.setAttribute('stroke','rgba(255,255,255,.85)'); ring.setAttribute('stroke-width','1.6');
    g.appendChild(half1); g.appendChild(half2); g.appendChild(ring);
    animG.appendChild(g); a.el=g;
  });
  const bad = res.type==='int'||res.type==='fumble'||res.type==='sack';
  const trail=document.createElementNS(NS,'path');
  trail.setAttribute('fill','none');
  trail.setAttribute('stroke', bad?'#E25555':'#FFD447');
  trail.setAttribute('stroke-width','3'); trail.setAttribute('opacity','.7');
  trail.setAttribute('stroke-linecap','round');
  animG.appendChild(trail);
  let throwLine=null;
  const ball=document.createElementNS(NS,'ellipse');
  ball.setAttribute('rx','8'); ball.setAttribute('ry','5.5');
  ball.setAttribute('fill','#8B4A2B'); ball.setAttribute('stroke','#F2EFE7'); ball.setAttribute('stroke-width','1.5');
  animG.appendChild(ball);

  let carrier=null, tCarry=2;
  if(playIsRun){ carrier=RB; tCarry=tHand; }
  else if(res.type==='pass'){ carrier=target; tCarry=tCatch; }
  else if(res.type==='int'){ carrier=picker; tCarry=tCatch; }

  function ballPos(t){
    if(!isPassBall) return carrier && t>=tCarry ? posAt(carrier,t) : posAt(QB,t);
    if(t<tThrow) return posAt(QB,t);
    const rel=posAt(QB,tThrow);
    if(t<tCatch){ const u=(t-tThrow)/(tCatch-tThrow); return {x:rel.x+(xAir-rel.x)*u, y:rel.y+(yAir-rel.y)*u}; }
    return carrier ? posAt(carrier,t) : {x:xAir,y:yAir};
  }

  const dur = clamp(1250 + Math.abs(res.yards||0)*14, 1250, 2100);
  let start=null, trailD='';
  function step(ts){
    if(!start) start=ts;
    const t=Math.min(1,(ts-start)/dur);
    actors.forEach(a=>{ const p=legacyToIso(posAt(a,t).x,posAt(a,t).y,.35); a.el.setAttribute('transform','translate('+p.x+','+p.y+')'); });
    const bp0=ballPos(t), bp=legacyToIso(bp0.x,bp0.y,.55);
    ball.setAttribute('cx',bp.x); ball.setAttribute('cy',bp.y);
    trailD += (trailD?' L':'M')+Math.round(bp.x)+' '+Math.round(bp.y);
    trail.setAttribute('d',trailD);
    if(isPassBall && t>=tThrow && !throwLine){
      throwLine=document.createElementNS(NS,'line');
      const rel=posAt(QB,tThrow);
      const relIso=legacyToIso(rel.x,rel.y,.4), airIso=legacyToIso(xAir,yAir,.55);
      throwLine.setAttribute('x1',relIso.x); throwLine.setAttribute('y1',relIso.y);
      throwLine.setAttribute('x2',airIso.x); throwLine.setAttribute('y2',airIso.y);
      throwLine.setAttribute('stroke','#FFD447'); throwLine.setAttribute('stroke-width','2.5');
      throwLine.setAttribute('stroke-dasharray','10 8'); throwLine.setAttribute('opacity','.7');
      animG.insertBefore(throwLine, ball);
    }
    if(t<1) requestAnimationFrame(step);
    else{
      banner(resText(res));
      if(res.type==='inc'||res.type==='int'||res.type==='fumble'){
        const m=document.createElementNS(NS,'text');
        m.setAttribute('x',bp.x); m.setAttribute('y',bp.y+6);
        m.setAttribute('fill', res.type==='inc' ? '#F2EFE7' : '#E25555');
        m.setAttribute('font-size','26'); m.setAttribute('font-weight','700'); m.setAttribute('text-anchor','middle');
        m.textContent='✕';
        animG.appendChild(m);
      }
      setTimeout(()=>{ animG.innerHTML=''; if(plG) plG.style.display=''; cb(); }, 420);
    }
  }
  requestAnimationFrame(step);
}

function timelineHTML(){
  const steps = [['tag','Tag','TAG'],['fa','Free Agency','FA'],['draft','Draft','DRAFT'],['ota','OTAs','OTA'],['camp','Camp','CAMP'],['preseason','Preseason','PRE'],['cutdown','Cutdown','CUT'],['hub','Season','SZN'],['playoffs','Playoffs','PO']];
  const orderOf = {tag:0, fa:1, draft:2, ota:3, camp:4, preseason:5, cutdown:6, hub:7, game:7, playoffs:8, offseason:9};
  const last = steps.length - 1;
  const curRaw = orderOf[G.phase] != null ? orderOf[G.phase] : 4;
  const cur = clamp(curRaw, 0, last);
  const fillPct = (cur / last) * 100;
  let dots = '', labels = '';
  steps.forEach((st,i) => {
    const pct = (i/last)*100;
    const state = curRaw > last ? 'done' : (i===curRaw ? 'on' : (i<curRaw ? 'done' : ''));
    const xform = i===0 ? 'translate(0,-50%)' : (i===last ? 'translate(-100%,-50%)' : 'translate(-50%,-50%)');
    const xformL = i===0 ? 'translateX(0)' : (i===last ? 'translateX(-100%)' : 'translateX(-50%)');
    dots += '<div class="tl-dot '+state+'" style="left:'+pct+'%;transform:'+xform+'"></div>';
    labels += '<div class="tl-lbl '+state+'" style="left:'+pct+'%;transform:'+xformL+'">'+st[2]+'</div>';
  });
  return '<div class="timeline">' +
    '<div class="tl-head"><span class="tl-now">'+(G.phase==='offseason'?'Offseason':steps[cur][1])+'</span><span class="tl-date">'+fmtDate(currentDate())+'</span></div>' +
    '<div class="tl-track"><div class="tl-fill" style="width:'+fillPct+'%"></div>'+dots+'</div>' +
    '<div class="tl-labels">'+labels+'</div>' +
    '</div>';
}

function statsHTML(){
  const all = [];

  if(!all.length) return '<div class="panel"><p class="sub">No stats yet — they start counting with Week 1. Check back once the season kicks off.</p></div>';
  const mine = x => x.t.idx === G.userTeam;
  function board(title, rows, fmt){
    let s = '<div class="panel" style="margin-bottom:12px"><div class="hd disp" style="font-size:14px">'+title+'</div><table class="tbl"><tr><th>#</th><th>Player</th><th>Team</th><th>Pos</th><th style="text-align:right">Line</th></tr>';
    rows.slice(0,8).forEach((x,i) => {
      s += '<tr'+(mine(x)?' style="background:rgba(255,212,71,.07)"':'')+'><td>'+(i+1)+'</td><td>'+pn(x.p)+(mine(x)?' <span class="tag w">YOU</span>':'')+'</td><td>'+esc(x.t.city)+'</td><td><b>'+x.p.spot+'</b></td><td style="text-align:right;color:var(--gold);font-weight:700">'+fmt(x.p.st)+'</td></tr>';
    });
    return s + '</table></div>';
  }
  const by = f => all.filter(x=>f(x.p.st)>0).sort((a,b)=>f(b.p.st)-f(a.p.st));
  let s = '<div class="panel" style="margin-bottom:12px"><p class="sub">Season leaders through '+(G.phase==='hub'?('Week '+(G.week-1)):'the season')+'. Big statlines drive development — hot players gain OVR, and production moves contract prices at re-sign, extension, tag, and free agency.</p></div>';
  s += board('Passing', by(s=>s.py), s=>s.py+' yds · '+s.ptd+' TD');
  s += board('Rushing', by(s=>s.ry), s=>s.ry+' yds · '+s.rtd+' TD');
  s += board('Receiving', by(s=>s.cy), s=>s.cy+' yds · '+s.ctd+' TD');
  s += board('Tackles', by(s=>s.tk), s=>s.tk+' tkl');
  s += board('Sacks', by(s=>s.sk), s=>s.sk+' sacks');
  s += board('Interceptions', by(s=>s.int), s=>s.int+' INT');
  s += board('Kicking', by(s=>s.fgm), s=>s.fgm+' FGM');
  return s;
}

    }
    if((!r.devs || !r.devs.length) && (!r.injuries || !r.injuries.length)){
      s += '<div class="panel"><p class="sub">Preseason box scores aren\'t tracked in full detail — just development and injury notes.</p></div>';

function sparkHTML(p){
  const evs = (p.history||[]).filter(e => e.d);
  let start = p.rating - evs.reduce((s,e)=>s+e.d,0);
  const pts = [start];
  evs.forEach(e => pts.push(pts[pts.length-1] + e.d));
  if(pts.length < 2) return '<p class="sub">No rating movement recorded yet.</p>';
  const min = Math.min(...pts)-1, max = Math.max(...pts)+1, W=420, H=64;
  const xy = pts.map((v,i) => (i/(pts.length-1)*W).toFixed(1)+','+(H-((v-min)/(max-min))*H).toFixed(1));
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">' +
    '<polyline points="'+xy.join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="2"/>' +
    '<circle cx="'+xy[xy.length-1].split(',')[0]+'" cy="'+xy[xy.length-1].split(',')[1]+'" r="3.5" fill="var(--gold)"/></svg>' +
    '<p class="sub">'+start+' OVR at debut → <b style="color:var(--gold)">'+p.rating+'</b> today</p>';
}

function coachRep(){

function lastStandings(){

  const live = G.teams.some(t => t.w + t.l > 0);
  if(live) return G.teams.map(t => ({idx:t.idx, w:t.w, l:t.l}));

function genJobOffers(reason){
  const rep = coachRep();
  const st = lastStandings();
  const rec = i => st.find(s => s.idx===i) || {w:0,l:0};
  const ovrs = G.teams.map(t => ({ idx:t.idx, o:ovr(t) })).sort((a,b) => a.o-b.o);
  const pctl = i => ovrs.findIndex(x => x.idx===i) / Math.max(1, ovrs.length-1); // 0 worst, 1 best
  // which clubs have an opening: mostly losing teams, occasionally a good one that underachieved
  const others = G.teams.filter(t => t.idx !== G.userTeam);
  const openings = others.filter(t => {
    const r = rec(t.idx), gp = r.w+r.l, pct = gp ? r.w/gp : .5;
    return Math.random() < (pct < .35 ? .7 : pct < .5 ? .35 : .08);
  });
  let offers = openings.filter(t => {
    const need = 25 + pctl(t.idx)*55;            // better rosters are pickier
    return rep + RI(-12,12) >= need;
  });
  if(!offers.length && reason !== 'explore'){
    // someone always takes a flyer on a fired coach: the worst club with an opening (or the worst club, period)
    const pool = (openings.length ? openings : others).slice().sort((a,b) => pctl(a.idx)-pctl(b.idx));
    offers = [pool[0]];
  }
  offers = offers.sort(() => Math.random()-.5).slice(0, rep>=70 ? 4 : rep>=50 ? 3 : 2);
  return offers.map(t => {
    const p = pctl(t.idx), r = rec(t.idx);
    const expect = p < .34 ? 'Rebuild' : p < .67 ? 'Contend' : 'Win Now';
    return {
      team:t.idx, w:r.w, l:r.l, ovr: ovr(t), market: t.market||3, expect,
      years: clamp(RI(3,4) + (rep>=70?1:0), 3, 5),
      patience: Math.round(clamp(40 + (rep-50)*.35 + (expect==='Rebuild'?12:expect==='Win Now'?-8:0) + RI(-4,4), 25, 75)),
      staffBonus: Math.round(((t.market||3)-3) * 1.5 + (rep>=70?2:0)),
      owner: pick(FN)+' '+pick(LN)
    };
  }).sort((a,b) => b.ovr-a.ovr);
}

        const c = G.fa.filter(p => p.pos===n).sort((a,b)=>b.rating-a.rating).find(p => userPrice(p,1) <= capRoom(me));

function prWeekKey(){ return G.year+':'+G.week; }
function prCondMult(p){ return p && p.condWk === prWeekKey() ? 0.7 : 1; }
function prFilmBonus(p){ return p && p.filmWk === prWeekKey() ? 1 : 0; }
const PR_FOCUS = {
  Technique:   'Small chance at +1 OVR for each player. Normal energy cost.',
  Conditioning:'Extra energy today, but the group tires 30% slower in practice and weather the rest of this week.',
  Film:        'No energy cost. +1 effective rating for this group on game day.'
};
function prScene(){
  const sc = G.practiceScene;
  if(!sc.rest) sc.rest = [];
  if(!sc.focus) sc.focus = {};
  if(!sc.queue) sc.queue = {wrdb:[], oldl:[], rblb:[]};
  if(sc.stationsDone == null) sc.stationsDone = false;
  return sc;
}
function prResting(id){ return G.practiceScene && (G.practiceScene.rest||[]).includes(id); }
/* group work at every station, applied once when the individual period ends */
function prApplyStations(){
  const sc = prScene();
  if(sc.stationsDone) return null;
  sc.stationsDone = true;
  const me = meT(), wk = prWeekKey(), out = {dev:[], rested:0, cond:0, film:0};
  me.roster.forEach(p => {
    if(p.ir || (p.injWeeks||0) > 0) return;
    if(sc.rest.includes(p.id)){ p.fatigue = clamp((p.fatigue||0) - 6, 0, 100); out.rested++; return; }
    const f = sc.focus[p.pos] || 'Technique';
    if(f === 'Technique'){
      p.fatigue = clamp((p.fatigue||0) + Math.round(RI(3,5)*prCondMult(p)), 0, 100);
      const cap = p.ceiling || 99;
      if(Math.random() < 0.06 && p.rating < cap){ p.rating++; logEv(p,'dev','Sharp in individual drills',1); out.dev.push(p); }
    } else if(f === 'Conditioning'){
      p.fatigue = clamp((p.fatigue||0) + RI(6,9), 0, 100); p.condWk = wk; out.cond++;
    } else { p.filmWk = wk; out.film++; }
  });
  return out;
}

  function pit(p,t,sc){
    px(p.x,p.y,p.w,p.h,'rgba(0,0,0,.18)');
    ctx.strokeStyle=team.c2; ctx.lineWidth=1; ctx.strokeRect(p.x+.5,p.y+.5,p.w-1,p.h-1);
    for(let x=p.x;x<p.x+p.w;x+=6){ px(x,p.y,3,1,'#FFF2C2'); px(x,p.y+p.h-1,3,1,'#FFF2C2'); }
    px(p.x+p.w/2,p.y+3,1,p.h-6,'rgba(255,255,255,.6)');
    const f=Math.floor(t/220), a=pitAnim[p.k], q=sc.queue[p.k]||[];
    if(a){
      const k=Math.min(1,(t-a.start)/1400), win=a.win;
      drawPlayer(p.x+p.w/2-10+(win?k*26:k*6),p.y+p.h/2-4,jersey(false),trim(false),f,1);
      drawPlayer(p.x+p.w/2+5+(win?k*16:-k*4),p.y+p.h/2-4,jersey(true),trim(true),f+1,-1);
      if(k>=1) px(p.x+p.w-14,p.y+4,10,6,win?'#4FBF77':'#E25555');
      if(t-a.start>2600) delete pitAnim[p.k];
    } else q.slice(0,3).forEach((m,i)=>{
      drawPlayer(p.x+p.w/2-10,p.y+5+i*10,jersey(false),trim(false),f,1);
      drawPlayer(p.x+p.w/2+5,p.y+5+i*10,jersey(true),trim(true),f+1,-1);
    });
  }
  function teamField(t){
    const losX=190+(script==='rz'?90:0), cy=FIELD.y+FIELD.h/2-2, f=Math.floor(t/200);
    px(losX,FIELD.y-4,1,FIELD.h+8,'#4FA3FF'); px(losX+(script==='rz'?20:24),FIELD.y-4,1,FIELD.h+8,'#F6D743');
    if(script==='rz') px(FIELD.x+FIELD.w-12,FIELD.y-4,10,FIELD.h+8,'rgba(255,255,255,.12)');
    const a=teamAnim, k=a?Math.min(1,(t-a.start)/1800):0;
    const sc=G.practiceScene, oT=sc._oTier||1, dT=sc._dTier||1;
    OFF_SET.forEach(([dx,dy],i)=>{
      let x=losX+dx*3, y=cy+dy*1.7; const r=OFF_ROLE[i];
      if(a){ if(r==='QB') x-=Math.min(k,.4)*20; else if(r==='WR'){ x+=k*a.depth*(i===8?1:.8); y+=(i===8?k*14:i===10?-k*12:k*6); }
        else if(r==='RB'){ if(a.type==='run'){ x+=k*a.gain*2.2; y+=Math.sin(k*3)*4; } else x+=k*6; }
        else if(r==='TE') x+=k*(a.type==='pass'?30:6); else x+=k*(a.type==='run'?6:-2); }
      drawPlayer(x,y,oT===1?'#F2F2F2':'#BFC7D2',trim(false),a?f+i:0,1);
    });
    DEF_SET.forEach(([dx,dy],i)=>{
      let x=losX+dx*3, y=cy+dy*1.7; const r=DEF_ROLE[i];
      if(a){ if(r==='DL') x-=k*(a.type==='pass'?12:4); else if(r==='LB') x+=a.type==='run'?-k*4:k*10; else x+=k*a.depth*.7; }
      drawPlayer(x,y,dT===1?jersey(true):'#3B5B7E','#F2F2F2',a?f+i+1:0,-1);
    });
    if(a && a.type==='pass' && k>.35){ const kk=Math.min(1,(k-.35)/.45); const sx=losX-24, sy=cy, tx=losX-6+a.depth, ty=cy-37;
      px(sx+(tx-sx)*kk, sy+(ty-sy)*kk-Math.sin(kk*Math.PI)*14,2,1,'#7A4A21'); }
    if(a && t-a.start>2200) teamAnim=null;
    drawPlayer(losX-30,FIELD.y+FIELD.h+1,'#2B2B2B',team.c2,f,1);
    for(let i=0;i<16;i++){ const d=i%2; drawPlayer(70+i*8+(i>7?120:0),FIELD.y-12,jersey(!!d),trim(!!d),Math.floor(t/600)+i,i%3?1:-1); }
  }
  function loop(now){

  function pitSheet(k,sc,me){

    if(a&&b){ const e=edge(a,b); s+='<div class="pr-q" style="border-color:var(--gold)"><b>'+esc(a.name)+'</b><span class="vs">vs</span><b>'+esc(b.name)+'</b><span class="edge" style="color:'+(e>=50?'var(--green)':'var(--red)')+'">'+e+'%</span></div>'; }

    const q=sc.queue[k];

    q.forEach((m,i)=>{ const x=me.roster.find(r=>r.id===m[0]), y=me.roster.find(r=>r.id===m[1]); if(!x||!y) return; const e=edge(x,y);
      s+='<div class="pr-q"><span>'+esc(x.name)+' <span class="sub">'+x.rating+'</span></span><span class="vs">vs</span><span>'+esc(y.name)+' <span class="sub">'+y.rating+'</span></span><span class="edge" style="color:'+(e>=50?'var(--green)':'var(--red)')+'">'+e+'%</span><span class="x" onclick="PRACTICE.rm(\''+k+'\','+i+')">✕</span></div>'; });
    s+='</div><div class="pr-cols"><div><h4>OFFENSE</h4>'+offs.map(r=>row(r,'a')).join('')+'</div><div><h4>DEFENSE</h4>'+defs.map(r=>row(r,'b')).join('')+'</div></div>';
    return s;
  }
  function stationSheet(k,sc,me){
    const st=STATIONS.find(s=>s.k===k), grp=avail(me).filter(p=>p.pos===k).sort((a,b)=>b.rating-a.rating);
    const coach=posCoachOf(k==='K'?null:k), foc=sc.focus[k]||'Technique';
    let s='<div class="hd"><h3>'+st.label+'</h3><button class="pr-btn" onclick="PRACTICE.close()">✕</button></div>'+
      '<p class="sub">Position coach: <b style="color:var(--chalk)">'+(k==='K'?(currentCoach('STC')?esc(currentCoach('STC').name)+' (STC)':'Vacant'):(coach?esc(coach.name):'Vacant'))+'</b>. Station work happens when you finish individuals. Rest tired players to sit them out today.</p>'+
      '<div class="sub" style="margin-top:8px;font-weight:700;letter-spacing:.08em">TODAY\'S FOCUS</div><div class="pr-foc">'+
      Object.keys(PR_FOCUS).map(f=>'<button class="'+(foc===f?'on':'')+'" onclick="PRACTICE.focus(\''+k+'\',\''+f+'\')">'+f+'</button>').join('')+'</div>'+
      '<p class="sub">'+PR_FOCUS[foc]+'</p>'+
      '<table class="tbl" style="margin-top:8px"><tr><th>Player</th><th>OVR</th><th>Fatigue</th><th>Form</th><th></th></tr>'+
      grp.map(r=>{ const rs=sc.rest.includes(r.id); return '<tr><td>'+pn(r)+'</td><td style="color:var(--gold);font-weight:800">'+r.rating+'</td><td>'+fatBar(r.fatigue||0)+'</td><td style="color:'+((r.form==null?100:r.form)>=90?'var(--green)':'var(--gold)')+'">'+(r.form==null?100:r.form)+'</td><td><button class="pr-tog'+(rs?' on':'')+'" onclick="PRACTICE.rest('+r.id+')">'+(rs?'Resting':'Rest')+'</button></td></tr>'; }).join('')+'</table>';

  }
  function condSheet(sc,me){
    const list=avail(me).slice().sort((a,b)=>(b.fatigue||0)-(a.fatigue||0));

      '<table class="tbl" style="margin-top:6px"><tr><th>Player</th><th>Pos</th><th>Fatigue</th><th>Form</th></tr>'+
      list.map(r=>'<tr><td>'+pn(r)+(sc.rest.includes(r.id)?' <span style="color:#FF9B9B">(rest)</span>':'')+'</td><td>'+r.spot+'</td><td>'+fatBar(r.fatigue||0)+' <span class="sub">'+(r.fatigue||0)+'</span></td><td>'+(r.form==null?100:r.form)+'</td></tr>').join('')+'</table>';
  }
  function resultsSheet(sc,me){
    let s='<div class="hd"><h3>Practice Results</h3><button class="pr-btn" onclick="PRACTICE.close()">✕</button></div><p class="sub">Give feedback to build relationships. Players respond to praise or tough love differently.</p>';
    if(sc.stationReport){ const r=sc.stationReport; s+='<div class="panel" style="margin-top:8px"><b>Station work</b><div class="sub" style="margin-top:4px">'+
      (r.dev.length?'+1 OVR: '+r.dev.map(p=>pn(p)).join(', ')+'. ':'No jumps from technique work. ')+(r.cond?r.cond+' on conditioning. ':'')+(r.film?r.film+' in the film room. ':'')+(r.rested?r.rested+' rested.':'')+'</div></div>'; }

  function html(){

        '<button class="pr-btn p" '+(sc.teamReps.length>=8?'disabled':'')+' onclick="PRACTICE.teamRep()">▶ Run Rep</button></div>';

  function fit(){

  function toast(h,sub){ const t=document.getElementById('prToast'); if(!t) return; t.innerHTML=esc(h)+(sub?'<small>'+esc(sub)+'</small>':''); t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2800); }

  return {
    html, mount, fit,
    open(k){ sheet = sheet===k ? null : k; pick={a:null,b:null}; render(); },
    close(){ sheet=null; pick={a:null,b:null}; render(); },
    pick(side,id){ pick[side] = pick[side]===id?null:id; render(); },
    add(){ const sc=prScene(); if(!pick.a||!pick.b) return; if(5-sc.drillReps.length-queued(sc)<=0) return; sc.queue[sheet.slice(4)].push([pick.a,pick.b]); pick={a:null,b:null}; rr(); },
    rm(k,i){ prScene().queue[k].splice(i,1); rr(); },
    auto(){
      const sc=prScene(), k=sheet.slice(4), p=PITS.find(x=>x.k===k), A=avail(meT());
      const offs=A.filter(r=>p.off.includes(r.pos)&&!sc.rest.includes(r.id)&&!inQueue(sc,r.id)).sort((a,b)=>b.rating-a.rating);
      const defs=A.filter(r=>p.def.includes(r.pos)&&!sc.rest.includes(r.id)&&!inQueue(sc,r.id)).sort((a,b)=>b.rating-a.rating);
      let i=0; while(5-sc.drillReps.length-queued(sc)>0 && offs[i] && defs[i] && i<2){ sc.queue[k].push([offs[i].id,defs[i].id]); i++; }
      rr();
    },
    focus(k,f){ prScene().focus[k]=f; rr(); },
    rest(id){ const sc=prScene(); const i=sc.rest.indexOf(id); if(i>=0) sc.rest.splice(i,1); else { sc.rest.push(id); Object.keys(sc.queue).forEach(q=>sc.queue[q]=sc.queue[q].filter(m=>m[0]!==id&&m[1]!==id)); } rr(); },
    runPits(){
      const sc=prScene(), now=performance.now()-t0, msgs=[];
      sheet=null;
      Object.keys(sc.queue).forEach(k=>{
        const list=sc.queue[k]; sc.queue[k]=[];
        list.forEach(m=>{ const r=runDrill(m[0],m[1]); if(r){ const w=meT().roster.find(p=>p.id===r.winnerId); pitAnim[k]={start:now, win:r.winnerId===m[0]}; msgs.push(w.name+(r.winnerDev?' +1 OVR':'')); } });
      });

    finishInd(){
      const sc=prScene();

      sc.queue={wrdb:[],oldl:[],rblb:[]};
      sc.stationReport = prApplyStations();
      sc.phase='11v11'; sheet=null;
      const r=sc.stationReport;

      rr();
    },
    tier(side,v){ setPracticeTier(side,v); },
    script(v){ script=v; render(); },
    teamRep(){
      const sc=prScene(); if(teamAnim) return;
      const pl=PLAYS[script][RI(0,PLAYS[script].length-1)];
      sc._oTier=practiceOffTier; sc._dTier=practiceDefTier;
      const r=runPracticeSession(practiceOffTier, practiceDefTier); if(!r) return;
      r.playName=pl.name;
      teamAnim=Object.assign({start:performance.now()-t0}, pl, pl.type==='run'?{gain:r.offWins?pl.gain:1}:{depth:r.offWins?pl.depth:pl.depth*.5});
      const so=r.standoutId?meT().roster.find(p=>p.id===r.standoutId):null;
      toastMsg=[r.offWins?'Offense wins the rep':'Defense wins the rep', pl.name+(so?' · standout '+so.name+(r.standoutDev?' +1 OVR':''):'')];
      rr();
    },
    done(){
      const sc=prScene();
      if(sc.phase==='drills'){ sc.stationReport = prApplyStations(); }
      sheet=null; pitAnim={}; teamAnim=null;
      exitPracticeScene();
    }
  };
})();

let OFFICE_FRESH = false;
function officeGoBoard(tab){ document.querySelectorAll('.of-pop').forEach(e=>e.remove()); boardTab = tab; openPage('prospects'); }
function officePop(k){
  document.querySelectorAll('.of-pop').forEach(e=>e.remove());
  const st = document.getElementById('officeStage'); if(!st) return;
  const fr = freshReports();
  const d = document.createElement('div'); d.className = 'of-pop';
  const item = (t,sub,fn,extra) => '<button onclick="'+fn+'"><span>'+t+'<small>'+sub+'</small></span>'+(extra||'')+'</button>';
  const close = '<span class="of-pop-x" onclick="this.closest(\'.of-pop\').remove()">✕</span>';
  if(k === 'mon1'){ d.style.left = '22%'; d.style.top = '20%';
    d.innerHTML = '<h4>Computer '+close+'</h4>' +
      item('📋 Roster','Your roster and contracts',"document.querySelectorAll('.of-pop').forEach(e=>e.remove());openPage('roster')") +
      item('📨 Scout Reports','Scout map and weekly reports',"officeGoBoard('map')", fr?'<span class="bd">'+fr+' new</span>':'') +
      item('🎯 Draft Forecast','Who lasts to your pick',"officeGoBoard('forecast')") +
      item('🎓 Prospects','Full class and My Board',"officeGoBoard('list')");
  }
  if(k === 'exit'){ d.style.left = '56%'; d.style.top = '18%';
    const live = G.phase === 'draft';
    const dd = fmtDate(draftDate(G.phase==='hub'||G.phase==='playoffs'||G.phase==='offseason'?G.year+1:G.year));
    d.innerHTML = '<h4>Exit Door '+close+'</h4>' +
      item('🏛️ Front Office','Career, cap, owner, facilities',"document.querySelectorAll('.of-pop').forEach(e=>e.remove());openPage('front')") +
      item('🎯 Draft War Room', live ? 'The draft is live' : 'Forecast and your board. Live on draft day', "officeGoBoard('forecast')", live ? '<span class="bd">LIVE</span>' : '<span class="lock">'+esc(dd)+'</span>');
  }
  st.appendChild(d);
}

function render(){
  applyTeamTheme();
  const app = $('#app');
  if(!G){
    modalView = null; modalArg = null;
    try {
      app.innerHTML = titleHTML();
    } catch(err) {
      console.error('Title screen render failed, recovering:', err);
      titleFlow = 'list';
      pendingMode = null;
      try { app.innerHTML = careerListHTML(); }
      catch(err2) {
        console.error('Career list also failed to render:', err2);
        app.innerHTML = '<div class="panel" style="border-color:var(--red);margin:16px"><div class="hd disp" style="color:var(--red)">Something went wrong</div><p class="sub">Try reloading the page. Your saves are stored separately and should not be affected.</p></div>';
      }
    }
    return;
  }
  if(!G.staff) G.staff = { OC:null, DC:null, STC:null, PS:null, CS:null, SNC:null, pos:{} };
  if(!G.coachPool) G.coachPool = makeCoachPool();
  if(G.tagUsed === undefined) G.tagUsed = false;
  if(G.otaWeek === undefined) G.otaWeek = 0;
  if(G.fanApproval == null) G.fanApproval = 50;
  if(G.stadiumLevel == null) G.stadiumLevel = 0;
  ensureStadiums(); ensureScheduleConditions();
  if(G.stadiumPending === undefined) G.stadiumPending = null;
  if(G.mode === 'owner' && !G.owner) G.owner = { name: pick(FN)+' '+pick(LN), age: RI(38,60), tookOverYear: G.year };
  if(!G.franchiseHistory) G.franchiseHistory = { banners: [], ringOfHonor: [], ownershipLog: [] };
  if(G.recentRetirees === undefined) G.recentRetirees = [];
  if(G.cash == null && G.userTeam != null) G.cash = (meT().market||3) * 8;
  if(!G.financeLog) G.financeLog = [];
  if(!G.draftPicks){
    G.draftPicks = [];
    for(let y = G.year; y <= G.year + 2; y++){
      G.teams.forEach(t => { for(let r=1; r<=DRAFT_ROUNDS; r++) G.draftPicks.push({ id: G.nextId++, year:y, round:r, team:t.idx, orig:t.idx }); });
    }
  }
  if(!G.seasonHistory) G.seasonHistory = [];
  ensureDraftRounds();
  if(G.activePage === undefined) G.activePage = null;
  document.documentElement.style.setProperty('--team', (G.userTeam != null ? meT().c1 : '#FFD447'));
  if(!modalView && G.jobNote && G.mode==='coachgm'){ modalView = 'jobnote'; modalArg = null; modalBack = null; }
  if(!modalView && !G.activePage && staffPromptNeeded()){ modalView = 'staffprompt'; modalArg = null; modalBack = null; }
  if(G && G.mode==='coachgm' && G.userTeam!=null && G.practiceScene && G.phase==='hub' && !G.activePage && !G.unemployed){
    try { app.innerHTML = PRACTICE.html() + modalHTML() + posPopupHTML(); PRACTICE.mount(); return; }
    catch(err){ console.error('Practice field render failed, falling back to classic practice:', err); }
  }
  if(officeActive()){
    try { app.innerHTML = OFFICE.html() + modalHTML() + posPopupHTML(); OFFICE.mount(); return; }
    catch(err){ console.error('Office render failed, falling back to classic hub:', err); }
  }
  let body = '';
  const canBrowsePages = G.phase !== 'game' && G.phase !== 'pregame' && G.phase !== 'fired' && G.phase !== 'jobs' && G.phase !== 'retired';
  try {
    if(G.unemployed && G.phase!=='game' && G.phase!=='pregame' && G.activePage!=='league'){ if(modalView && !['team','jobnote','bringstaff'].includes(modalView)){ modalView=null; modalArg=null; } G.activePage=null; body = unemployedHTML(); }
    else if(canBrowsePages && G.activePage){
      body = pageChromeHTML(G.activePage);
    }
    else if(G.mode === 'owner' && G.phase !== 'fired' && G.phase !== 'game' && G.phase !== 'pregame'){
      body = timelineHTML() + '<div class="phase-body">' + ownerDashboardHTML() + '</div>';
    }
    else if(G.mode === 'player' && G.phase !== 'fired' && G.phase !== 'game' && G.phase !== 'pregame'){
      body = timelineHTML() + '<div class="phase-body">' + playerDashboardHTML() + '</div>';
    }
    else if(G.phase==='hub') body = G.practiceScene ? practiceSceneHTML() : (timelineHTML() + hubHTML());
    else if(G.phase==='pregame'){ if(GM) body = pregameHTML(); else { G.phase='hub'; body = timelineHTML() + hubHTML(); } }
    else if(G.phase==='game') body = gameHTML();
    else if(G.phase==='tag') body = timelineHTML() + '<div class="phase-body">' + tagHTML() + '</div>';
    else if(G.phase==='fa') body = timelineHTML() + '<div class="phase-body">' + faHTML() + '</div>';
    else if(G.phase==='draft') body = timelineHTML() + '<div class="phase-body">' + draftHTML() + '</div>';
    else if(G.phase==='ota') body = timelineHTML() + '<div class="phase-body">' + otaHTML() + '</div>';
    else if(G.phase==='camp') body = timelineHTML() + '<div class="phase-body">' + campHTML() + '</div>';
    else if(G.phase==='preseason') body = timelineHTML() + '<div class="phase-body">' + preseasonHTML() + '</div>';
    else if(G.phase==='cutdown') body = timelineHTML() + '<div class="phase-body">' + cutdownHTML() + '</div>';
    else if(G.phase==='playoffs') body = timelineHTML() + '<div class="phase-body">' + playoffsHTML() + '</div>';
    else if(G.phase==='offseason') body = timelineHTML() + '<div class="phase-body">' + offseasonHTML() + '</div>';
    else if(G.phase==='fired'){ if(G.mode==='coachgm'){ G.jobReason='fired'; G.jobOffers = genJobOffers('fired'); G.phase='jobs'; save(); return render(); } modalView = null; modalArg = null; app.innerHTML = firedHTML(); return; }
    else if(G.phase==='jobs'){ if(modalView && !['team','bringstaff','jobnote'].includes(modalView)){ modalView=null; modalArg=null; } if(!G.jobOffers) G.jobOffers = genJobOffers(G.jobReason||'fired'); body = jobsHTML(); }
    else if(G.phase==='retired'){ modalView = null; modalArg = null; app.innerHTML = headerHTML() + retiredHTML(); return; }
  } catch(err) {
    // a single page's content threw — don't leave the whole app stuck on a blank/stale screen.
    // Drop back to the hub/dashboard and surface a plain message, with navigation still working.
    console.error('Page render failed, recovering:', err);
    G.activePage = null;
    body = '<div class="panel" style="border-color:var(--red)"><div class="hd disp" style="color:var(--red)">Something went wrong loading that page</div>' +
      '<p class="sub">No progress was lost — your last save is intact. Try a different page from the nav above, or use Quit to Menu in Front Office.</p></div>';
  }
  const nav = (G.phase === 'game' || G.phase === 'pregame' || G.phase === 'jobs' || G.unemployed || G.practiceScene || G.userTeam == null) ? '' : navHTML();
  app.innerHTML = headerHTML() + nav + body + modalHTML() + posPopupHTML();
  if(G.phase==='game'){ drawFormation(); renderLog(); updateGameUI(); }
}

function deleteCareer(id){

/* ---------- shared roster table (flat, sortable, filterable) ---------- */
let rSort = {key:'rating', dir:-1}, rFilter = 'ALL';
let posPopup = null; // position string, or null — drives the small roster-minimums popover
let posPopupSort = {key:'rating', dir:-1};
function setPosPopupSort(key){
  const s = posPopupSort;
  if(s.key === key) s.dir = -s.dir; else { s.key = key; s.dir = key==='name'||key==='spot' ? 1 : -1; }
  render();
}
function setRSort(k){
  if(rSort.key === k) rSort.dir *= -1;
  else rSort = {key:k, dir:(k==='name'||k==='spot'||k==='scheme') ? 1 : -1};
  render();
}
function setRFilter(f){ rFilter = f; render(); }
function spotSortVal(p){ return POS_ORDER.indexOf(p.pos)*10 + SPOTS[p.pos].indexOf(p.spot); }
function schemeCell(p){
  if(p.pos!=='DL' && p.pos!=='LB') return '<span class="sub">—</span>';
  return '<span class="tag '+(p.scheme==='any'?'up':'w')+'">'+SCHEME_TAG[p.scheme]+'</span>';
}
function playerRow(p, actions, isOpponent){
  const status = p.ir ? '<span class="tag inj">IR</span>' : p.injWeeks > 0 ? '<span class="tag inj">OUT '+p.injWeeks+'wk</span>'
    : (G.phase==='hub' ? (p.dressed !== false ? '<span class="tag w">ACTIVE</span>' : '<span class="tag l">SCRATCH</span>') : '<span class="sub">OK</span>');
  const ratingCell = isOpponent ? scoutRangeHTML(p, 10) + (p.proScoutLo===p.proScoutHi ? '' : ' <button class="btn tiny" onclick="scoutPlayer('+p.id+')" title="Costs '+proScoutCost(p)+' scouting pts">🔍</button>') : '<span style="color:var(--gold);font-weight:700">'+p.rating+'</span>';
  return '<tr'+(p.dressed===false && G.phase==='hub' ? ' class="dim"':'')+'><td>'+pn(p)+(p.trained?' <span class="tag up">+'+p.trained+'</span>':'')+'</td>' +
    '<td><b>'+p.spot+'</b></td>' +
    '<td>'+schemeCell(p)+'</td>' +
    '<td>'+p.age+'</td><td>'+ratingCell+'</td>' +
    '<td>'+money(p.salary)+'</td><td>'+p.years+'yr</td><td>'+status+'</td><td>'+actions+'</td></tr>';
}
function rosterTable(t, actionFn){
  const isOpponent = t.idx !== G.userTeam;
  const cols = [['name','Player'],['spot','Pos'],['scheme','Scheme'],['age','Age'],['rating','OVR'],['salary','Salary'],['years','Years']];
  let s = '<div class="filterbar">' + posFilterPillsHTML(t, rFilter, 'setRFilter');
  s += '</div><table class="tbl"><tr>';
  cols.forEach(c => {
    const on = rSort.key === c[0];
    s += '<th class="sorth'+(on?' on':'')+'" onclick="setRSort(\''+c[0]+'\')">'+c[1]+(on ? (rSort.dir>0?' ▲':' ▼') : '')+'</th>';
  });
  s += '<th>Status</th><th></th></tr>';
  const list = t.roster
    .filter(p => rFilter==='ALL' || p.pos === rFilter)
    .sort((a,b) => {
      let va, vb;
      if(rSort.key==='spot'){ va = spotSortVal(a); vb = spotSortVal(b); }
      else { va = a[rSort.key]; vb = b[rSort.key]; }
      if(typeof va === 'string') return va.localeCompare(vb) * rSort.dir;
      return ((va - vb) || (b.rating - a.rating)) * rSort.dir;
    });
  list.forEach(p => s += playerRow(p, actionFn(p), isOpponent));
  if(!list.length) s += '<tr><td colspan="9" class="sub" style="text-align:center;padding:14px">No players at this position.</td></tr>';
  return s + '</table>';
}
function capBarHTML(t){
  const pr = payroll(t);
  const pct = clamp(pr/capNow()*100, 0, 100);
  const dead = deadCapFor(t);
  return '<div class="sub" style="margin-bottom:4px">Payroll <b style="color:var(--chalk)">'+money(pr)+'</b> of '+money(capNow())+' cap · room <b style="color:'+(capRoom(t)>10?'var(--green)':'var(--red)')+'">'+money(capRoom(t))+'</b>'+(dead>0?' · dead cap <b style="color:var(--red)">'+money(dead)+'</b>':'')+'</div>' +
    '<div class="capbar"><i style="width:'+pct+'%;background:'+(pct>92?'var(--red)':'var(--gold)')+'"></i></div>';
}

/* ---------- free agency ---------- */
function posNeedsHTML(t){
  return '<div class="panel" style="margin-bottom:12px">'+minimumsHTML(t)+'</div>';
}
function setFATeamFilter(v){ faTeamFilter = v; render(); }
function faOfferHTML(pid){
  if(faSigned && faSigned.pid === pid){
    return '<div class="ct-wrap"><div class="panel ct-card"><div class="ct-nm">'+esc(faSigned.name)+'</div>' +
      '<p style="color:var(--green);font-weight:700;margin-top:6px">'+esc(faSigned.msg)+'</p></div>' +
      '<div class="ct-foot"><button class="btn primary ct-go" onclick="closeModal()">Done</button></div></div>';
  }
  const p = G.fa.find(x => x.id === pid);
  if(!p) return '<p class="sub">He\'s no longer on the market.</p>';
  if(!faDraft || faDraft.pid !== pid) initFADraft(p);
  const me = meT(), d = faDraft;
  const q = teamQualityMult(me), r = relationshipMult(p), h = hometownDisc(me, p);
  const winRate = (me.lastRecord && (me.lastRecord.w+me.lastRecord.l)>0) ? Math.round(me.lastRecord.w/(me.lastRecord.w+me.lastRecord.l)*100) : null;
  const rel = (p.rel && p.rel.coach != null) ? p.rel.coach : 50;
  const base = marketFor(p);
  const pctOf = Math.round(d.sal/base*100);
  const fx = (m) => Math.abs(1-m) < .005 ? '<span>even</span>' : '<b style="color:'+(m<1?'var(--green)':'var(--red)')+'">'+(m<1?'−':'+')+Math.abs(Math.round((1-m)*100))+'%</b>';
  const room = capRoom(me);
  let s = '<div class="ct-wrap"><div class="panel ct-card">' +
    '<div class="ct-who"><span class="ct-nm">'+esc(p.name)+'</span><span class="sub">'+(p.spot||p.pos)+' · '+p.age+' · '+(p.proScoutLo!=null && p.proScoutLo!==p.proScoutHi ? scoutRangeHTML(p,5) : '<b style="color:var(--gold)">'+p.rating+'</b>')+'</span></div>' +
    '<div class="ct-facts"><span>Market <b>'+money(base)+'</b>/yr · asks '+(p.askYears||2)+' yrs</span><span>Cap room <b style="color:'+(room>d.sal?'var(--green)':'var(--red)')+'">'+money(room)+'</b></span></div></div>';
  s += '<div class="ct-chips"><span>Team '+(winRate!=null?winRate+'%':'new')+' '+fx(q)+'</span><span>Relationship '+Math.round(rel)+' '+fx(r)+'</span><span>Hometown '+(h<1?fx(h):'<span>none</span>')+'</span></div>';
  const st = (label, val, color, dec, inc, canDec, canInc, sub) =>
    '<div class="ct-st"><div class="ct-k">'+label+'</div><div class="ct-c">' +
    '<button class="ct-sb" '+(canDec?'':'disabled')+' onclick="'+dec+'" aria-label="Decrease '+label+'">−</button>' +
    '<b style="color:'+color+'">'+val+'</b>' +
    '<button class="ct-sb" '+(canInc?'':'disabled')+' onclick="'+inc+'" aria-label="Increase '+label+'">+</button></div>' +
    '<div class="ct-sub">'+sub+'</div></div>';
  s += '<div class="ct-grid">' +
    st('Salary / yr', money(d.sal), pctOf<95?'var(--red)':pctOf>105?'var(--green)':'var(--gold)', 'stepFASalary(-1)', 'stepFASalary(1)', d.sal>d.lo, d.sal<d.hi, pctOf+'% of market') +
    st('Years', d.yrs, 'var(--chalk)', 'stepFAYears(-1)', 'stepFAYears(1)', d.yrs>1, d.yrs<4, 'longer = more security') +
    '</div>';
  s += '<div class="panel ct-card"><div class="ct-years">';
  for(let i=0;i<d.yrs;i++) s += '<div class="ct-yr"><span class="sub">Yr '+(i+1)+'</span><b>'+money(d.sal)+'</b><span class="ct-split">base only</span></div>';
  s += '</div><div class="ct-sum">Total <b>'+money(Math.round(d.sal*d.yrs*10)/10)+'</b> · '+d.yrs+' yr'+(d.yrs!==1?'s':'')+' · no dead cap</div></div>';
  let msg = '';
  if(lastFAOfferResult && lastFAOfferResult.pid === p.id){
    const c = lastFAOfferResult.kind === 'soft' ? 'var(--gold)' : 'var(--red)';
    msg = '<div class="ct-verdict" style="color:'+c+'">'+esc(lastFAOfferResult.msg)+'</div>';
  }
  s += '<div class="ct-foot">'+msg+'<button class="btn primary ct-go" onclick="makeFAOffer('+p.id+')">Submit Offer</button></div></div>';
  return s;
}
function faPoolRowsHTML(pool, me, limit){
  if(!pool.length) return '<tr><td colspan="9" class="sub">Nobody matches this filter.</td></tr>';
  let s = '';
  pool.forEach(x => {

  G.playerRaiseRequestUsed = true;
  const me = meT();
  const fair = marketFor(myP, 0);
  const current = myP.salary;
  if(fair <= current * 1.05){
    alert('Management points out you\'re already paid fairly at '+money(current)+'/yr. No deal.');
    save(); render();

  }
  const ask = Math.round(Math.min(fair, current * 1.35) * 10) / 10; // camp doesn't push all the way to full market in one ask
  const room = capRoom(me) + current; // room available once his current cap hit is backed out
  if(ask > room){
    bumpRel(myP, 'coach', -4);
    logEv(myP, 'ct', 'Asked for a raise to '+money(ask)+'/yr — turned down, the cap won\'t allow it', 0);
    alert(esc(me.city)+' would love to, but there\'s only '+money(Math.max(room,0))+' in cap room right now — not enough to get you to '+money(ask)+'/yr.');
  } else {
    myP.salary = ask;
    const c = contractOf(myP);
    c.base = Array(Math.max(myP.years,1)).fill(ask);
    bumpRel(myP, 'coach', 6);
    logEv(myP, 'ct', 'Renegotiated — new salary '+money(ask)+'/yr', 0);

  }

const PROSPECT_TRAITS = {
  QB:['Big arm','Pocket presence','Quick release','Field general','Scrambler','Gunslinger'],
  RB:['Home-run speed','Pass catcher','Short-yardage','Ball security','Elusive','Pass pro'],

  CB:['Ball hawk','Press-man fit','Zone instincts','Recovery speed','Slot corner'],

};
const CS_ACTIONS = {

  live:    {cost:3, icon:'🏟', name:'Live game',      when:'season',  desc:'Big range cut plus one trait. Once a week per prospect.'},

};
const TOP_VISITS = 10;
function draftClassYear(){ return ['tag','fa','draft'].includes(G.phase) ? G.year : G.year+1; }
function scoutWindow(){
  if(G.phase === 'hub') return 'season';

}

function prSetUserView(pr){
  if(pr.uSpread == null) return;
  pr.scoutLo = clamp(Math.round(pr.trueRating + pr.uErr - pr.uSpread), 50, 99);
  pr.scoutHi = clamp(Math.round(pr.trueRating + pr.uErr + pr.uSpread), pr.scoutLo, 99);
}
function enrichProspect(pr){
  if(pr.pot != null) return pr;
  const w = Math.random(); pr.work = w < .3 ? 'High' : w < .8 ? 'Average' : 'Low';
  pr.pot = clamp(pr.trueRating + RI(2,12) + (pr.work==='High'?3:pr.work==='Low'?-3:0), pr.trueRating, 99);
  pr.style = Math.random() < .5 ? 'praise' : 'tough';
  const m = Math.random(); pr.med = m < .7 ? 'Clean' : m < .92 ? 'Minor' : 'Major';
  const pool = (PROSPECT_TRAITS[pr.pos] || ['Competitor']).slice().sort(() => Math.random()-.5);
  pr.traits = pool.slice(0, 2); pr.traitsSeen = 0;
  pr.mediaMid = clamp(pr.trueRating + RI(-6,6), 50, 99);
  if(Math.random() < .18) pr.mediaMid = clamp(pr.trueRating - RI(7,12), 50, 99);   // true sleeper: media has him way too low
  pr.uErr = (pr.mediaMid - pr.trueRating) + RI(-2,2);
  pr.uSpread = clamp(pr.spread || 6, 3, 9);
  pr.ai = G.teams.map(() => (pr.mediaMid - pr.trueRating) + RI(-4,4));
  pr.cs = {g:0, a:0, b:0, c:0};
  pr.rev = {};
  pr.log = [];
  pr.rankHist = [];
  prSetUserView(pr);
  return pr;
}
function ensureDraftClass(){
  if(!G || (G.mode === 'player' && G.preDraftPhase)) return null;
  if(!G.scoutPoints) G.scoutPoints = { pro: 0, college: 8 };
  const y = draftClassYear();
  if(!G.nextClass || G.nextClass.year !== y){
    if(G.nextClass && G.nextClass.year > y) return G.nextClass;
    G.nextClass = { year:y, pool: generateDraftPool(), visits: [], created: G.year+':'+G.phase };
    G.nextClass.pool.forEach(enrichProspect);
    if(['tag','fa','draft'].includes(G.phase)){ G.nextClass.bowlDone = true; combineEvent(true); if(G.phase !== 'tag') proDayEvent(true); }
  }
  G.nextClass.pool.forEach(enrichProspect);
  return G.nextClass;
}
const PROSPECT_POS_VALUE = {QB:3, K:-14};
function mediaScore(pr){ return pr.mediaMid + (pr.pot - pr.trueRating) * .25 + (PROSPECT_POS_VALUE[pr.pos]||0); }
function mediaRanks(pool){
  const order = pool.slice().sort((a,b) => mediaScore(b) - mediaScore(a));
  const m = {}; order.forEach((p,i) => m[p.id] = i+1); return m;
}
function csLine(pr){
  const c = pr.cs || {}, g = c.g || 0;
  if(!g) return '';
  switch(pr.pos){
    case 'QB': return c.a+' yds · '+c.b+' TD · '+c.c+' INT';
    case 'RB': return c.a+' rush yds · '+c.b+' TD';
    case 'WR': case 'TE': return c.c+' rec · '+c.a+' yds · '+c.b+' TD';
    case 'OL': return g+' starts · '+c.b+' sacks allowed';
    case 'DL': case 'LB': return c.a+' tkl · '+c.b+' sacks';
    case 'CB': case 'S': return c.a+' tkl · '+c.b+' INT · '+c.c+' PBU';
    default: return c.a+'/'+c.b+' FG';
  }
}
/* one college Saturday for the whole class: stats, stock, and AI scouting */
function collegeWeek(){
  if(G.mode === 'player' || G.phase !== 'hub') return;
  const cls = ensureDraftClass(); if(!cls) return;
  const before = mediaRanks(cls.pool);
  cls.pool.forEach(pr => {
    const perf = pr.trueRating + RI(-9,9);
    const q = (perf - 60) / 30; // ~0 to 1
    const c = pr.cs; c.g++;
    const r = (lo,hi) => Math.max(0, Math.round(lo + (hi-lo)*clamp(q + R(-.2,.2),0,1)));
    switch(pr.pos){
      case 'QB': c.a += r(120,340); c.b += r(0,4); c.c += Math.random() < .55-q*.4 ? RI(1,2) : 0; break;
      case 'RB': c.a += r(30,170); c.b += r(0,2); break;
      case 'WR': case 'TE': { const rec = r(1,9); c.c += rec; c.a += rec*RI(9,16); c.b += Math.random() < q*.6 ? 1 : 0; break; }
      case 'OL': c.b += Math.random() < .5-q*.4 ? 1 : 0; break;
      case 'DL': case 'LB': c.a += r(1,9); c.b += Math.random() < q*.7 ? (Math.random()<.3?2:1) : 0; break;
      case 'CB': case 'S': c.a += r(1,7); c.b += Math.random() < q*.35 ? 1 : 0; c.c += r(0,3); break;
      default: c.a += r(0,3); c.b += 3;
    }
    pr.mediaMid = clamp(pr.mediaMid + (perf - pr.mediaMid) * .04 + R(-.6,.6), 45, 99);
  });
  const after = mediaRanks(cls.pool);
  cls.pool.forEach(pr => { pr.rankHist = (pr.rankHist||[]).concat([after[pr.id]]).slice(-6); pr.stock = before[pr.id] - after[pr.id]; });
  aiScoutWeek(6);
  try { areaScoutWeek(); } catch(e){ console.error('area scouts', e); }
}
function aiScoutWeek(n){
  const cls = G.nextClass; if(!cls) return;
  G.teams.forEach(t => {
    if(t.idx === G.userTeam && !G.unemployed) return;
    for(let i=0;i<n;i++){
      // AI scouts lean toward the top of the media board, with some digging deeper
      const pool = cls.pool;
      const pr = Math.random() < .7 ? pool.slice().sort((a,b)=>mediaScore(b)-mediaScore(a))[RI(0, Math.min(40,pool.length-1))] : pick(pool);
      if(pr && pr.ai) pr.ai[t.idx] = Math.round(pr.ai[t.idx] * .55);

}

function canScout(act, pr){
  const a = CS_ACTIONS[act], w = scoutWindow(), pts = (G.scoutPoints && G.scoutPoints.college) || 0;
  if(G.mode !== 'coachgm' && G.mode !== 'owner') return 'Not available in this mode';
  if(a.when === 'season' && w !== 'season') return 'Only during the college season';
  if(a.when === 'predraft' && w !== 'predraft') return 'Pre-draft only (after the regular season)';
  if(pts < a.cost) return 'Need '+a.cost+' college pts';
  if(act === 'film' && pr.uSpread <= 2 && Math.abs(pr.uErr) < 1) return 'Film has told you all it can';
  if(act === 'live' && pr.liveWk === G.year+':'+G.week) return 'Already watched him this week';
  if(act === 'interview' && pr.rev.character) return 'Already interviewed';
  if(act === 'medical' && pr.rev.medical) return 'Medical already done';
  if(act === 'workout' && pr.rev.exact) return 'Already worked out';

/* ---------- procedural pixel portraits (64x72, shaded) ---------- */
const FACE_W = 64, FACE_H = 72;
const SKIN = [['#F4CFAE','#E2AE88','#C08A66','#93623F'],['#E6B58E','#CF9670','#AE7550','#7E4F31'],['#CC9166','#B0744B','#8E5835','#633A20'],
  ['#A8714A','#8C5A37','#6C4226','#4A2B17'],['#80522F','#683F23','#4E2D17','#33190B'],['#5E3C22','#4B2F1A','#382111','#22130A']];
const HAIR = ['#17110D','#2E1E14','#4A2F1B','#6B4425','#B98F45','#7E3418'];
const FACE_FONT = {0:['111','101','101','101','111'],1:['010','110','010','010','111'],2:['111','001','111','100','111'],3:['111','001','111','001','111'],4:['101','101','111','001','001'],
  5:['111','100','111','001','111'],6:['111','100','111','101','111'],7:['111','001','010','010','010'],8:['111','101','111','101','111'],9:['111','101','111','001','111']};
function faceRng(seed){ let s = (seed * 2654435761) >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

function drawFace(ctx, seed, c1, c2, num){
  const rnd = faceRng(seed), ri = (a,b) => a + Math.floor(rnd()*(b-a+1)), pk = a => a[Math.floor(rnd()*a.length)];
  const W = FACE_W, H = FACE_H;

  const skin = pk(SKIN), hair = rnd() < .85 ? HAIR[ri(0,2)] : pk(HAIR);

  for(let i=0;i<10;i++){ const x = ri(2,61), y = ri(2,26); P(x,y,'rgba(255,240,200,.35)'); }
  const grid = []; for(let y=0;y<H;y++){ grid.push(new Array(W).fill(0)); }
  // --- shoulders + jersey
  const shTop = top + headH + 1;
  for(let y=shTop; y<H; y++){
    const t = (y-shTop);
    const half = Math.min(32, 16 + t*3.2);
    for(let x=Math.round(cx-half); x<=Math.round(cx+half); x++){
      const nx = (x-cx)/half;
      const lit = nx < -.2 ? 1.08 : nx > .45 ? .72 : .9;
      const padEdge = Math.abs(nx) > .82;
      P(x,y, shadeHex(c1, padEdge ? lit*.78 : lit)); grid[y][x]=1;
    }
  }
  // collar (V neck) in secondary
  for(let i=0;i<7;i++){ P(cx-7+i, shTop+i, c2); P(cx+7-i, shTop+i, c2); P(cx-6+i, shTop+i, shadeHex(c2,.8)); P(cx+6-i, shTop+i, shadeHex(c2,.8)); }
  // shoulder pad seam highlights
  for(let i=0;i<10;i++){ P(cx-20-i, shTop+5+Math.floor(i*.5), shadeHex(c1,1.25)); P(cx+20+i, shTop+5+Math.floor(i*.5), shadeHex(c1,.6)); }
  // jersey number
  const ns = String(num).padStart(2,'0').slice(-2);
  [ns[0], ns[1]].forEach((d,k) => { const g = FACE_FONT[d]; const ox = cx - 7 + k*8, oy = shTop + 9;
    g.forEach((row,yy) => row.split('').forEach((b,xx) => { if(b==='1'){ R(ox+xx*2, oy+yy*2, 2, 2, c2); } })); });
  // --- neck
  const neckW = Math.round(headW*.6);
  for(let y = top+headH-6; y < shTop+5; y++){
    for(let x=cx-Math.floor(neckW/2); x<=cx+Math.floor(neckW/2); x++){
      const nx = (x-cx)/(neckW/2); const sh = y < top+headH+1 ? 3 : (nx > .3 ? 2 : 1);
      P(x,y, skin[Math.min(3,sh)]); grid[y][x]=2;
    }
  }
  // --- head (shaded ellipse with tapering jaw)
  const hy = top + headH/2;
  for(let y=top; y<top+headH; y++){
    const ny = (y-hy)/(headH/2);
    const pw = ny < 0 ? 2.6 : 2.2;
    const w = (headW/2) * Math.pow(Math.max(0,1-Math.pow(Math.abs(ny),pw)), 1/pw) * (ny > .3 ? (1 - (ny-.3)*(1-jaw)/.7) : 1);
    for(let x=Math.round(cx-w); x<=Math.round(cx+w); x++){
      const nx = (x-cx)/(headW/2);
      const l = nx*.75 + ny*.35;               // light from upper-left
      const tone = l < -.35 ? 0 : l < .2 ? 1 : l < .6 ? 2 : 3;
      P(x,y, skin[tone]); grid[y][x]=3;
    }
  }
  for(let i=0;i<5;i++) P(cx-6+i, top+4+(i>2?1:0), shadeHex(skin[0],1.08));
  // ears
  [[-1],[1]].forEach(([s]) => { const ex = cx + s*(Math.round(headW/2)+1), ey = top + Math.round(headH*.42);
    for(let y=0;y<6;y++) for(let x=0;x<2;x++){ P(ex + s*x - (s>0?1:0), ey+y, skin[s<0?1:2]); grid[ey+y][ex+s*x-(s>0?1:0)]=3; }
    P(ex - (s>0?0:-0), ey+2, skin[3]); });
  // --- facial features
  const eyeY = top + Math.round(headH*.46), eyeDX = ri(5,6);

function ensureProspectCard(pr){

/* =================== DRAFT SCOUTING (phase 3: forecast wall, tiers, media mock) =================== */
function staffForecastQ(){
  const ps = currentCoach('PS'), cs = currentCoach('CS');
  const a = ps ? ps.rating : 35, b = cs ? cs.rating : 35;
  return clamp((a*0.6 + b*0.4 - 40) / 52, 0.05, 0.92);
}
function forecastOrder(){
  if(G.phase === 'draft' && G.draftOrderList) return G.draftOrderList;
  if(['tag','fa'].includes(G.phase)) return G.projOrder || (G.projOrder = computeDraftOrder());
  // during the season: current standings, worst first
  return G.teams.slice().sort((a,b) => (a.w/Math.max(1,a.w+a.l)) - (b.w/Math.max(1,b.w+b.l)) || ((a.pf-a.pa)-(b.pf-b.pa)) || a.idx-b.idx).map(t => t.idx);
}
function forecastSlots(cls){
  const order = forecastOrder(), out = [];
  for(let r=1; r<=DRAFT_ROUNDS; r++) order.forEach((orig,k) => {
    const pk = G.draftPicks.find(p => p.year===cls.year && p.round===r && p.orig===orig);
    const idx = (r-1)*16 + k;
    const made = (G.draftLog||[]).find(d => d.pickNum === idx+1 && G.phase === 'draft');
    out.push({ idx, round:r, orig, team: made ? made.team : (pk ? pk.team : null), made: made || null, pickObj: pk || null });
  });
  return out;
}
function myBoardOrder(cls, pool){
  const mid = p => (p.scoutLo + p.scoutHi)/2 + (PROSPECT_POS_VALUE[p.pos]||0);
  const custom = (cls && cls.myOrder) || [];
  const ranked = pool.slice().sort((a,b) => {
    const ia = custom.indexOf(a.id), ib = custom.indexOf(b.id);
    const ta = (cls && cls.tiers && cls.tiers[a.id]) || 9, tb = (cls && cls.tiers && cls.tiers[b.id]) || 9;
    if(ta !== tb) return ta - tb;
    if(ia >= 0 && ib >= 0) return ia - ib;
    if(ia >= 0) return -1; if(ib >= 0) return 1;

}
let FC_CACHE = null;
function runForecast(cls){
  const pool = cls.pool.filter(p => !(G.draftLog||[]).some(d => d.pid === p.id && G.phase==='draft'));
  const slots = forecastSlots(cls);
  const key = cls.year+'|'+G.phase+'|'+(G.draftPickIdx||0)+'|'+pool.length+'|'+pool.reduce((s,p)=>s+p.scoutLo+p.scoutHi+(p.liveWk?1:0),0)+'|'+JSON.stringify(cls.tiers||{}).length+'|'+(cls.myOrder||[]).join(',')+'|'+staffForecastQ().toFixed(2)+'|'+slots.map(s=>s.team).join('');
  if(FC_CACHE && FC_CACHE.key === key) return FC_CACHE;
  const q = staffForecastQ();
  const cand = pool.slice().sort((a,b) => mediaScore(b) - mediaScore(a)).slice(0, 130);
  myBoardOrder(cls, cand).forEach((p,i) => p._myRank = i);
  const needs = {}; G.teams.forEach(t => needs[t.idx] = teamNeed(t));
  const est = {}; // our estimate of each club's board
  cand.forEach(p => {
    const mine = (p.scoutLo + p.scoutHi)/2;
    est[p.id] = G.teams.map(t => {
      const theirs = p.ai ? p.trueRating + p.ai[t.idx] + (p.pot - p.trueRating)*.2 : mine;
      return mine*(1-q) + theirs*q + (PROSPECT_POS_VALUE[p.pos]||0);
    });

  const N = G.phase === 'draft' ? 90 : 160, noise = 1.5 + (1-q)*6;
  const slotCount = {}, availCount = {};
  for(let n=0;n<N;n++){
    const taken = new Set();
    for(const s of open){
      if(s.team === G.userTeam && !G.unemployed){
        cand.forEach(p => { if(!taken.has(p.id)){ const k = s.idx+':'+p.id; availCount[k] = (availCount[k]||0)+1; } });
        let best = null; for(const p of cand){ if(!taken.has(p.id) && (!best || p._myRank < best._myRank)) best = p; }
        if(best){ taken.add(best.id); }
        continue;

      let best = null, bs = -1e9;
      for(const p of cand){ if(taken.has(p.id)) continue;

        if(sc > bs){ bs = sc; best = p; } }
      if(best){ taken.add(best.id); const sk = slotCount[s.idx] || (slotCount[s.idx] = {}); sk[best.id] = (sk[best.id]||0)+1; }
    }
  }
  const proj = {};
  Object.keys(slotCount).forEach(i => { const arr = Object.keys(slotCount[i]).map(id => ({pid:+id, p:slotCount[i][id]/N})).sort((a,b)=>b.p-a.p); proj[i] = arr.slice(0,2); });

}

  top.forEach(pr => { const perf = pr.trueRating + RI(-12,12); pr.mediaMid = clamp(pr.mediaMid + (perf - pr.mediaMid)*.15, 45, 99); pr.bowl = perf - pr.trueRating; });
  const after = mediaRanks(cls.pool);

  for(const t of others){

    const first = theirs.find(pk => pk.year === G.year && pk.round === round) || theirs.find(pk => pk.year === G.year);
    if(!first) continue;

function myProspect(){ return (G.draftPool||[]).find(p => p.id === G.myProspectId) || null; }
function doPreDraftWorkout(){
  if(!G.preDraftPhase || (G.preDraftWorkoutsLeft||0) <= 0) return;
  const pr = myProspect();
  if(!pr) return;
  const roll = Math.random();
  let delta, note;
  if(roll < .15){ delta = -RI(0,2); note = 'Had an off day — a little rusty out there.'; }
  else if(roll < .75){ delta = RI(1,3); note = 'Solid session — tightened up the range a bit.'; }
  else { delta = RI(4,6); note = 'Excellent workout — teams took real notice.'; }
  pr.scoutLo = clamp(pr.scoutLo + delta, 50, 99);
  pr.scoutHi = clamp(pr.scoutHi + Math.max(0, Math.round(delta*.6)), pr.scoutLo, 99);
  G.preDraftWorkoutsLeft--;
  G.preDraftLog.unshift(note+' Now projecting '+pr.scoutLo+'–'+pr.scoutHi+' OVR.');
  save(); render();
}
function doProDay(){
  if(!G.preDraftPhase || G.preDraftProDayUsed) return;
  const pr = myProspect();
  if(!pr) return;
  G.preDraftProDayUsed = true;
  const roll = Math.random();
  let note;
  if(roll < .25){
    const hit = RI(6,12);
    pr.scoutLo = clamp(pr.scoutLo-hit,50,99); pr.scoutHi = clamp(pr.scoutHi-Math.round(hit*.6),50,99);
    note = 'Pro Day disaster — teams saw enough to get worried.';
  } else if(roll < .65){
    const bump = RI(2,5);
    pr.scoutLo = clamp(pr.scoutLo+bump,50,99); pr.scoutHi = clamp(pr.scoutHi+bump,50,99);
    note = 'Solid Pro Day — a real, if modest, bump across the board.';
  } else {
    const bump = RI(8,14);
    pr.scoutHi = clamp(pr.scoutHi+bump,50,99); pr.scoutLo = clamp(pr.scoutLo+Math.round(bump*.5),50,99);
    note = 'Electric Pro Day — you\'re the talk of the league today.';
  }
  if(pr.scoutLo > pr.scoutHi) pr.scoutHi = pr.scoutLo;

function beginDraftForReal(){
  G.preDraftPhase = false;
  advanceDraftPointerPlayerMode();
  save(); render();
}
function advanceDraftPointerPlayerMode(){
  while(G.draftPickIdx < DRAFT_ROUNDS*16){
    const round = Math.floor(G.draftPickIdx / 16) + 1;
    const slotInRound = G.draftPickIdx % 16;
    const origTeam = G.draftOrderList[slotInRound];
    const pickObj = G.draftPicks.find(pk => pk.year===G.year && pk.round===round && pk.orig===origTeam);
    if(!pickObj){ G.draftPickIdx++; continue; }
    const owner = pickObj.team;
    const t = G.teams[owner];
    if(t.roster.length < LIMIT_OFF && G.draftPool.length){
      const pr = aiSelectProspect(t);
      if(pr){
        const wasMe = pr.id === G.myProspectId;
        const rook = draftProspect(pr.id, owner, pickObj);
        G.draftPickIdx++;
        if(wasMe && rook){
          G.userTeam = owner;
          G.cash = (t.market||3) * 8;
          G.playerId = rook.id;
          G.playerDraftReveal = { team: owner, round, pickNum: G.draftPickIdx, undrafted:false };
          save(); render();
          return;
        }
        continue;
      }
    } else {
      G.draftPicks = G.draftPicks.filter(pk => pk.id !== pickObj.id);
    }
    G.draftPickIdx++;
  }
  // draft's over — if "You" never got picked, this is a real UDFA (undrafted free agent), same as real football
  const stillMine = G.draftPool.find(pr => pr.id === G.myProspectId);
  if(stillMine){
    const idx = G.draftPool.indexOf(stillMine);
    G.draftPool.splice(idx,1);
    const room = G.teams.filter(t => t.roster.length < LIMIT_OFF).sort((a,b) => capRoom(b)-capRoom(a));
    const t = room[0] || G.teams[RI(0,15)];
    const rook = makePlayer(stillMine.pos, stillMine.trueRating, stillMine.age, 1, stillMine.spot);
    rook.name = stillMine.name; rook.home = stillMine.home; rook.college = stillMine.college; rook.hgt = stillMine.hgt;
    rook.salary = ROOKIE_SALARY[3].min; // UDFA money — bottom of the rookie scale
    rook.history = [{y:G.year, k:'move', t:'Signed as an undrafted free agent by '+t.city, d:0}];
    t.roster.push(rook);
    G.userTeam = t.idx;
    G.cash = (t.market||3) * 8;
    G.playerId = rook.id;
    G.playerDraftReveal = { team: t.idx, round: 0, pickNum: 0, undrafted: true };
    save(); render();
  }
}

function mePlayer(){

function playerHandleTag(){
  const me = meT();
  const myP = mePlayer();
  const pending = pendingUFAs(me);
  const worthTagging = pending.filter(p => (!myP || p.id !== myP.id) && (isPremiumFA(p) || interestedTeams(p).length > 0)).sort((a,b)=>b.rating-a.rating);
  if(!G.tagUsed && worthTagging.length){
    const target = worthTagging[0];
    const sal = tagSalaryFor(target);
    if(sal <= capRoom(me) + target.salary) tagPlayer(target.id);
  }
  pending.forEach(p => {
    if(myP && p.id === myP.id) return;
    if(p.tagged || p.years > 0 || p.rating < 60) return;
    const cost = userPrice(p, 1);
    if(cost <= capRoom(me) + p.salary) resignPlayer(p.id);
  });
  if(myP && myP.years <= 0 && !myP.tagged){
    G.playerPendingContract = { offer: userPrice(myP, 1), years: RI(2,3) };
    save(); render();
    return;
  }

}
function resolvePlayerRestructure(accept){
  const myP = mePlayer();

  if(accept){

    logEv(myP, 'ct', 'Agreed to restructure — freed up '+money(saved)+' in cap room for the club', 0);
  } else {
    logEv(myP, 'ct', 'Turned down a restructure request — kept the current deal as written', 0);
    G.playerRestructureDeclined = true;

  save(); render();
}
function resolvePlayerContract(accept){
  const myP = mePlayer();
  const pc = G.playerPendingContract;
  if(!myP || !pc) return;
  if(accept){
    myP.years = pc.years; myP.salary = pc.offer; myP.resigned = true;
    myP.contract = { base: Array(pc.years).fill(pc.offer), bonusProration:0, bonusYearsLeft:0, totalBonus:0 };
    logEv(myP, 'ct', 'Re-signed with '+meT().city+' — '+money(pc.offer)+'/yr × '+pc.years, 0);
    G.playerPendingContract = null;
    openFreeAgency();

    const me = meT();
    me.roster = me.roster.filter(p => p.id !== myP.id);

function retryCutdown(){
  enforceCapCompliance(meT());
  if(capRoom(meT()) < 0){
    logOwnerMove('Still over the cap by '+money(-capRoom(meT()))+' — keep restructuring or releasing players from Front Office.');
    save(); render();

function playerAdvance(){
  if(G.playerFAShopping && G.playerFreeAgent){ advanceFAShoppingDay(); return; }
  if(G.playerRetired || G.playerDraftReveal || G.playerPendingContract || G.playerFAOffers || G.playerRetireDecision || G.playerRestructureOffer) return;
  switch(G.phase){
    case 'tag': playerHandleTag(); break;
    case 'fa': ownerHandleFA(); break;
    case 'draft': simulateRestOfDraft(); finishDraft(); simOTAs(); runCamp(); break;
    case 'preseason': ownerHandlePreseason(); break;
    case 'cutdown': retryCutdown(); break;
    case 'hub': ownerHandleWeek(); break;
    case 'playoffs': ownerHandlePlayoffs(); break;
    case 'offseason': playerHandleOffseason(); break;
    default: break;
  }
  if(G.phase !== 'game'){ save(); render(); }
}

function ensureProScout(p, baseSpread){
