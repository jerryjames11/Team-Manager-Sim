<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="mobile-web-app-capable" content="yes">
<title>Team Manager Sim — Head Coach Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0E1420; --panel:#161E2D; --panel2:#1C2536; --line:#2A3548;
  --modalbg:#080B11;
  --chalk:#F2EFE7; --muted:#8B97A8; --gold:#FFD447; --red:#E25555;
  --green:#4CAF6E; --turf:#2E7D46; --turf2:#2A7340; --team:#3E6DB5;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--night);color:var(--chalk);font-family:'Inter',system-ui,sans-serif;min-height:100%}
button{font-family:inherit;cursor:pointer}
.disp{font-family:'Oswald','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.04em}
.mono{font-family:'Courier New',monospace;font-weight:700}

#app{max-width:1080px;margin:0 auto;padding:10px 12px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
header.top .brand{font-size:16px;font-weight:700;color:var(--gold)}
header.top .brand small{color:var(--muted);font-size:9.5px;display:block;letter-spacing:.16em;font-weight:600}
header.top .meta{text-align:right;font-size:11px;color:var(--muted);line-height:1.35}
header.top .meta b{color:var(--chalk)}

/* league calendar strip — progress bar */
.timeline{margin-bottom:10px}
.tl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:8px}
.tl-now{font-size:11.5px;font-weight:700;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.tl-date{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.tl-track{position:relative;height:5px;background:var(--line);border-radius:3px;margin:0 2px}
.tl-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,#B98F1F,var(--gold));border-radius:3px;transition:width .35s ease}
.tl-dot{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:var(--panel);border:2px solid var(--line);transform:translate(-50%,-50%)}
.tl-dot.done{background:var(--gold);border-color:var(--gold)}
.tl-dot.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,212,71,.25)}
.tl-labels{position:relative;height:12px;margin-top:4px}
.tl-lbl{position:absolute;top:0;font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tl-lbl.done{color:var(--green)}
.tl-lbl.on{color:var(--gold)}

.panel{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--team-tint, var(--line));border-radius:10px;padding:11px;margin-bottom:9px !important;overflow-x:auto}
.hd{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:7px;letter-spacing:.08em}
.sub{color:var(--muted);font-size:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.grow{flex:1 1 300px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--chalk);border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;letter-spacing:.05em;transition:.15s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--gold);color:#14100A;border-color:var(--gold)}
.btn.big{padding:14px 22px;font-size:14px}
.btn.primary:hover{filter:brightness(1.08);color:#14100A}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.tiny{padding:3px 7px;font-size:10px;border-radius:5px}
.btn:disabled{opacity:.4;cursor:default;pointer-events:none}
.btn:focus-visible,.play:focus-visible,.teamcard:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* title */
.title-hero{text-align:center;padding:38px 10px 26px}
.career-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #202A3C}
.career-row:last-child{border-bottom:none}
.modecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.modecard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;transition:.12s}
.modecard:hover{border-color:var(--gold)}
.modecard.disabled{opacity:.55;cursor:default}
.modecard.disabled:hover{border-color:var(--line)}
.modecard-title{font-size:16px;color:var(--gold);margin-bottom:6px}
.title-hero h1{font-size:clamp(38px,7vw,64px);color:var(--chalk);line-height:.95}
.title-hero h1 span{color:var(--gold)}
.title-hero p{color:var(--muted);margin-top:10px;font-size:14px}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:8px}
.divgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:12px;margin-top:12px}
.divcol{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.divcol .dvh{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--gold);margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;color:var(--chalk);text-align:left;transition:.12s;cursor:pointer}
.trow:hover{background:var(--panel);border-color:var(--gold);transform:translateX(2px)}
.trow .chip{width:10px;height:28px;border-radius:3px;flex:0 0 auto}
.trow .tn{flex:1;min-width:0}
.trow .tn b{display:block;font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.04em;line-height:1.15}
.trow .tn small{display:block;font-size:10px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.trow .ab{font-size:11px;font-weight:700;color:var(--muted)}
.trow .tmeta{flex:0 0 auto;text-align:right}
.trow .tmeta > b{display:block;font-family:'Oswald',sans-serif;font-size:15px;color:var(--gold);line-height:1.1}
.trow .tmeta > b small{font-size:9px;letter-spacing:.08em;color:var(--muted)}
.trow .tmeta > small{display:block;font-size:9.5px;color:var(--muted)}
.trow .tmeta .grn{color:var(--green)}
.teamcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;color:var(--chalk);transition:.15s;position:relative;overflow:hidden}
.teamcard:hover{transform:translateY(-2px);border-color:var(--gold)}
.teamcard .stripe{position:absolute;left:0;top:0;bottom:0;width:6px}
.teamcard .city{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.teamcard .nm{font-size:19px;font-weight:700}
.teamcard .units{display:flex;gap:8px;margin-top:8px;font-size:10px;color:var(--muted)}
.teamcard .units b{color:var(--chalk);display:block;font-size:13px}

/* hub */
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;letter-spacing:.06em}
.tab.on{background:var(--gold);color:#14100A;border-color:var(--gold)}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th, table.tbl td{white-space:nowrap}
table.tbl th{text-align:left;color:var(--muted);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:5px 6px;border-bottom:1px solid var(--line)}
table.tbl td{padding:5px 6px;border-bottom:1px solid #202A3C}
table.tbl tr.me td{background:rgba(255,212,71,.07)}
table.tbl tr.dim td{opacity:.45}
table.tbl tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.08em}
.tag.w{background:rgba(76,175,110,.18);color:var(--green)}
@media (max-width:520px){.bring-tbl th:nth-child(6),.bring-tbl td:nth-child(6){display:none}.bring-tbl td,.bring-tbl th{padding:5px 4px;font-size:11px}}
.clause-row{display:flex;gap:6px;align-items:flex-start;font-size:11px;line-height:1.35;margin:-2px 0 8px 4px;padding:6px 8px;border:1px dashed var(--line);border-radius:6px;cursor:pointer}
.clause-row input{margin-top:2px;flex:none}
.job-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.job-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.job-stats>div{display:flex;flex-direction:column;font-size:12px}
.job-stats b{font-size:14px}
.tag.l{background:rgba(226,85,85,.15);color:var(--red)}
.tag.inj{background:rgba(226,85,85,.15);color:var(--red)}
.tag.up{background:rgba(255,212,71,.15);color:var(--gold)}
.tag.fa{background:rgba(76,141,255,.18);color:#8FB6FF}
.conf-meter,.capbar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.conf-meter i,.capbar i{display:block;height:100%;border-radius:6px;transition:.4s}
.nextgame{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* trade rework */
.trade-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){ .trade-grid{grid-template-columns:280px 1fr 280px} }
.offerbar{cursor:pointer}
.offerbar-head{display:flex;justify-content:space-between;align-items:center}
.offerbar-body{display:none;margin-top:10px;cursor:default}
.offerbar-body.open{display:block}
.offercard{background:var(--panel2);border:1px solid var(--gold);border-radius:8px;padding:10px;margin-bottom:8px}
.offercard:last-child{margin-bottom:0}
.offercard .who{font-weight:700;font-size:12.5px;margin-bottom:3px}
.offercard .terms{font-size:11px;color:var(--muted);margin-bottom:8px}
.trade-toggle{width:34px;height:19px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);position:relative;cursor:pointer;flex-shrink:0}
.trade-toggle.on{background:var(--gold);border-color:var(--gold)}
.trade-toggle i{position:absolute;top:1px;left:1px;width:15px;height:15px;border-radius:50%;background:var(--chalk);transition:.15s}
.trade-toggle.on i{left:17px;background:#14100A}
.blockrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #202A3C;font-size:12px}
.blockstate{display:inline-block;padding:3px 8px;border-radius:12px;font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap;user-select:none}
.blockrow:last-child{border-bottom:none}
.valuetrack{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden;display:flex;border:1px solid var(--line)}
.valuetrack .give{background:var(--gold);transition:.3s}
.valuetrack .get{background:#3E6DB5;transition:.3s}
.valuelabels{display:flex;justify-content:space-between;font-size:11px;margin-top:4px}
.counterbox{margin-top:10px;background:rgba(255,212,71,.08);border:1px solid var(--gold);border-radius:8px;padding:10px}
.counterbox .t{font-weight:700;font-size:12.5px;color:var(--gold);margin-bottom:4px}
.rosterpanel{display:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px}
.rosterpanel.open{display:block}
.picksub{font-weight:700;font-size:11px;color:var(--gold);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.05em;border-top:1px solid var(--line);padding-top:8px}
.pickrow{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;padding:5px 0}
.assetrow2{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;padding:6px 0;border-bottom:1px solid #202A3C}
.assetrow2:last-child{border-bottom:none}
.assetrow2 .rm{color:var(--red);font-weight:700;cursor:pointer;font-size:14px}

/* dashboard hub */
.dash-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){ .dash-grid{grid-template-columns:280px 1fr 280px} }
.dash-feed, .dash-side{display:flex;flex-direction:column;gap:12px}
.dash-center{display:flex;flex-direction:column;gap:12px}
.player-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){ .player-grid{grid-template-columns:1fr 1fr} }
.player-grid .full{grid-column:1/-1}
.feeditem{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid #202A3C}
.feeditem:last-child{border-bottom:none}
.feeditem .ic{font-size:15px;flex-shrink:0}
.feeditem .t{font-size:12.5px;font-weight:700}
.feeditem .s{color:var(--muted);font-size:11px}
.dash-hero{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;padding:16px;position:relative;overflow:hidden}
.dash-hero .kicker{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.dash-hero .title{font-size:18px;font-weight:700;margin-bottom:6px}
.dash-hero .body{color:var(--muted);font-size:12.5px;line-height:1.5;max-width:80%}
.dash-hero .icon{position:absolute;right:14px;top:14px;font-size:44px;opacity:.15}
.dash-calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.dash-calday .lbl{color:var(--muted);font-size:10px;margin-bottom:4px;text-align:center}
.dash-calday .box{background:var(--panel2);border-radius:6px;height:34px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted)}
.dash-calday .box.game{background:var(--gold);color:#14100A}
.dash-calday .box.practice{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.dash-calday .box.rest{background:rgba(76,175,110,.18);color:var(--green);border:1px solid var(--green)}
.dash-calday .box.today{border:2px solid var(--gold);color:var(--gold)}
.dash-fixrow{display:flex;justify-content:space-between;font-size:11.5px;padding:6px 0;border-bottom:1px solid #202A3C}
.dash-fixrow:last-child{border-bottom:none}
.dash-standrow{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:6px 0;border-bottom:1px solid #202A3C}
.dash-standrow:last-child{border-bottom:none}
.dash-standrow.me{background:rgba(255,212,71,.07)}
.dash-standrow .pos{color:var(--muted);width:14px}
.dash-standrow .nm{flex:1}
.dash-standrow.me .nm{color:var(--gold);font-weight:700}
.nextgame .vs{font-size:22px;font-weight:700}
.nextgame .vs small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;font-weight:600}
.posgroup{background:var(--panel2);color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.16em;padding:5px 8px}
.filterbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.fbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700}
.fbtn .mb-pos{color:var(--chalk)}
.fbtn .mb-n{color:var(--chalk)}
.fbtn .mb-ovr{color:var(--gold)}
.fbtn.short{border-color:var(--red)}
.fbtn.short .mb-n{color:var(--red)}
.fselect{background:var(--panel2);border:1px solid var(--line);color:var(--chalk);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;font-family:inherit}
.fbtn.on{background:var(--gold);color:#14100A;border-color:var(--gold)}
.countpill{font-size:13px;font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:6px 14px}
.countpill b{color:var(--gold)}
.countpill.over b{color:var(--red)}
.pname{cursor:pointer;text-decoration:underline dotted rgba(242,239,231,.4);text-underline-offset:3px}
.pname:hover{color:var(--gold)}
.pf-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.pf-ovr{font-size:34px;font-weight:700;color:var(--gold);line-height:1}
.spark{width:100%;max-width:420px;height:64px;display:block;margin:8px 0}
.finchart{width:100%;height:90px;display:block;margin:8px 0}
th.sorth{cursor:pointer;user-select:none;white-space:nowrap}
th.sorth:hover{color:var(--chalk)}
th.sorth.on{color:var(--gold)}
.dchart{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line);background:#0A0F18;margin:10px 0}
.minsgrid{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.depthrow td{font-size:12px}
.oop{color:var(--red);font-weight:700}

/* game day */
.scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:#0A0F18;border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin-bottom:10px}
.scorebar .tm{display:flex;align-items:center;gap:10px;min-width:0}
.scorebar .tm.right{justify-content:flex-end;text-align:right}
.scorebar .dotc{width:14px;height:14px;border-radius:50%;flex:0 0 auto}
.scorebar .nm2{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scorebar .sc{font-size:30px;color:var(--gold)}
.scorebar .mid{text-align:center;line-height:1.2}
.scorebar .clock{font-size:20px;color:var(--chalk)}
.scorebar .qtr{font-size:11px;color:var(--muted);letter-spacing:.2em}
.situation{display:flex;justify-content:center;gap:18px;font-size:13px;color:var(--muted);margin:8px 0;flex-wrap:wrap}
.situation b{color:var(--gold)}
.possdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:5px;vertical-align:1px}
#fieldwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;position:relative}
#field{width:100%;height:auto;display:block;border-radius:6px}
#playbanner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(10,15,24,.92);border:1px solid var(--gold);color:var(--chalk);padding:8px 18px;border-radius:8px;font-size:14px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92%;text-align:center}
#playbanner.show{opacity:1}
.fflash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;pointer-events:none;z-index:5;animation:fflash 1.15s ease-out forwards}
.fflash.fd{font-size:30px;color:#FFD447;text-shadow:0 2px 10px rgba(0,0,0,.75)}
.fflash.td{font-size:46px;color:#FFD447;text-shadow:0 0 20px rgba(255,212,71,.85),0 2px 10px rgba(0,0,0,.85)}
.fflash.opp{font-size:32px;color:#E25555;text-shadow:0 0 14px rgba(226,85,85,.6),0 2px 10px rgba(0,0,0,.85)}
@keyframes fflash{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}26%{transform:translate(-50%,-50%) scale(1)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.06)}}
.confetti{position:absolute;width:8px;height:13px;border-radius:2px;pointer-events:none;z-index:4;opacity:0;animation:confettipop 1.4s ease-out forwards}
@keyframes confettipop{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 170px)) rotate(var(--rot))}}
.confetti.rain{top:-4%;animation-name:confettirain;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes confettirain{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),108vh) rotate(var(--rot))}}
.overlay{overflow:hidden}
.overlay .card.win{border-color:var(--gold);box-shadow:0 0 44px rgba(255,212,71,.35),0 0 0 1px rgba(255,212,71,.45);animation:cardpop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes cardpop{0%{transform:scale(.65);opacity:0}100%{transform:scale(1);opacity:1}}
.overlay .card .trophy{font-size:48px;line-height:1;margin-bottom:6px;display:inline-block;animation:trophybob 1.7s ease-in-out infinite}
@keyframes trophybob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-7px) rotate(5deg)}}
.overlay .card h2.winh{color:var(--gold);text-shadow:0 0 16px rgba(255,212,71,.45)}
.callsheet{margin-top:10px;background:linear-gradient(160deg,#F6F3E8,#E9E4D2);border-radius:10px;padding:12px;color:#1A1A14;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15), inset 0 14px 30px rgba(255,255,255,.5)}
.callsheet:before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:10px;background:linear-gradient(115deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 30%);pointer-events:none}
.callsheet .cs-hd{display:flex;justify-content:space-between;align-items:center;font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:12px;letter-spacing:.16em;color:#4A4636;margin-bottom:8px}
.playgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.play{border:none;border-radius:6px;padding:10px 8px 8px;font-weight:700;font-size:13px;color:#17150E;text-align:left;position:relative;border-left:6px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.12s}
.play small{display:block;font-weight:600;font-size:10px;opacity:.65;margin-top:2px;letter-spacing:.03em}
.play:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.3)}
.play.run{background:#CDE8C8;border-left-color:#2F7D3B}
.play.quick{background:#F7E9A8;border-left-color:#C9A227}
.play.shot{background:#F3C6BC;border-left-color:#C0392B}
.play.st{background:#D8DEE9;border-left-color:#41506B}
.play.def{background:#C9D8EE;border-left-color:#2C4E86}
.play:disabled{opacity:.35;transform:none;box-shadow:none;cursor:default}
.qblive{display:flex;flex-direction:column;gap:8px}
.qbclock{text-align:center;font-size:26px;font-weight:800;color:#7A2E20}
.qbclockbar{height:8px;border-radius:5px;background:#00000022;overflow:hidden;margin:-4px 0 2px}
.qbclockbar i{display:block;height:100%;background:linear-gradient(90deg,#2F7D3B,#C9A227,#C0392B);transition:width .1s linear}
.qbtarget{background:#F0EBDA;border:1px solid #00000022;border-radius:8px;padding:8px 10px;cursor:pointer;transition:.12s}
.qbtarget:hover{border-color:#41506B;transform:translateY(-1px)}
.qbtarget-name{font-weight:700;font-size:13px;color:#17150E;margin-bottom:5px}
.qbtarget-name small{font-weight:600;opacity:.6;margin-left:4px}
.qbopenbar{height:15px;border-radius:8px;background:#00000022;position:relative;overflow:hidden}
.qbopenbar i{display:block;height:100%;transition:width .12s linear,background .12s linear}
.qbopenpct{position:absolute;right:6px;top:0;font-size:10px;font-weight:800;line-height:15px;color:#14100A}
.kickbar{position:relative;height:22px;background:#00000022;border-radius:11px;overflow:visible;margin:6px 0}
.kickzone{position:absolute;top:0;bottom:0;background:rgba(47,125,59,.35);border-left:2px solid #2F7D3B;border-right:2px solid #2F7D3B;border-radius:4px}
.kickmarker{position:absolute;top:-4px;width:6px;height:30px;background:#C0392B;border-radius:3px;transform:translateX(-50%);transition:left .03s linear}
.statbox-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.statbox-team-name{font-weight:800;color:var(--gold);font-size:12px;margin-bottom:4px}
.statbox-line{display:flex;flex-direction:column;gap:1px;margin-bottom:6px;font-size:12px}
.statbox-line .sub{font-size:11px}
#gamelog{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-height:170px;overflow-y:auto;font-size:12.5px;line-height:1.75}
#gamelog .q{color:var(--gold);font-weight:700;letter-spacing:.1em}
#gamelog .big{color:var(--gold);font-weight:700}
#gamelog .bad{color:var(--red);font-weight:700}
#gamelog div{border-bottom:1px dashed #232D3F;padding:2px 0}
.gamectl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:rgba(6,9,15,.88);display:flex;align-items:center;justify-content:center;z-index:9998;padding:16px}
.overlay .card{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:28px;max-width:520px;width:100%;text-align:center}
.overlay .card h2{font-size:30px;margin-bottom:6px}
.overlay .card p{color:var(--muted);font-size:14px;margin-bottom:16px;line-height:1.6}
.page-chrome{margin-bottom:9px}
.page-hd{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.page-title{font-size:17px;color:var(--gold)}
.modal-wrap{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:rgba(6,9,15,.88);display:flex;align-items:flex-start;justify-content:center;z-index:9999;padding:16px;overflow-y:auto}
.modal-panel{background:var(--modalbg);border:1px solid var(--gold);border-radius:14px;max-width:900px;width:100%;margin:24px auto;padding:0 0 18px}
.modal-hd{position:sticky;top:0;background:var(--modalbg);border-bottom:1px solid var(--line);border-radius:14px 14px 0 0;padding:11px 15px;display:flex;align-items:center;justify-content:space-between;z-index:2}
.modal-hd .disp{font-size:16px}
.modal-body{padding:11px 15px 0}
.modal-panel.wide{max-width:min(1040px,96vw)!important;width:96vw}
.pc-wrap{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:10px}
@media (max-width:640px){.pc-wrap{grid-template-columns:1fr}}
.pc-card{position:relative;border-radius:14px;padding:10px;background:linear-gradient(160deg,color-mix(in srgb,var(--cc) 55%,#0E1726),#0E1726 65%);border:2px solid var(--gold);overflow:hidden}
.pc-face{display:block;width:100%;aspect-ratio:64/72;image-rendering:pixelated;border-radius:10px;border:1px solid rgba(255,255,255,.15);margin-bottom:8px}
.pc-grade{position:absolute;top:16px;right:16px;width:52px;height:52px;border-radius:12px;color:#14100A;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:22px;line-height:1;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.pc-grade small{font-size:9px;letter-spacing:.08em;margin-top:2px}
.pc-nm{font-size:22px;font-weight:900;line-height:1.05}
.pc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.pc-tg{padding:2px 7px;border-radius:6px;font-size:11px;font-weight:800;background:#22314B;color:#B8CCE8}
.pc-tg.g{background:#173B26;color:#7FE0A1}.pc-tg.r{background:#3A1E1E;color:#FF9B9B}.pc-tg.q{background:#2A3548;color:#8B97A8}
.pc-right{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
@media (max-width:820px){.pc-right{grid-template-columns:1fr}}
.pc-kv{display:grid;grid-template-columns:1fr auto 44px;gap:4px 8px;font-size:13px;margin-top:6px}
.pc-kv b{text-align:right}
.pf-face{width:64px;height:72px;image-rendering:pixelated;border-radius:8px;border:1px solid var(--line);flex:none}

.fc-wrap{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(240px,1fr);gap:10px}
@media (max-width:820px){.fc-wrap{grid-template-columns:1fr}}
.fc-side{display:flex;flex-direction:column;gap:10px}
.fc-tabs{display:flex;gap:4px;margin-bottom:6px}
.fc-tabs button{flex:1;background:var(--panel2,#1C2536);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:5px 0;font-weight:800;font-size:12px;cursor:pointer}
.fc-tabs button.on{border-color:var(--gold);color:var(--gold)}
.fc-wall{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;background:#E9E6DC;border-radius:10px;padding:6px;border:3px solid #8C8C8C}
@media (max-width:700px){.fc-wall{grid-template-columns:repeat(4,minmax(0,1fr))}}
.fc-slot{border-radius:6px;padding:5px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;color:#1B1B1B;background:#F7F4EA;border:1px solid #CFC9B8;min-height:96px;font-size:11px}
.fc-pk{display:flex;justify-content:space-between;align-items:center;font-weight:900;color:#555}
.fc-tm{font-weight:900;border-radius:4px;padding:0 4px;font-size:10px}
.fc-via{font-size:9px;color:#8C6A1E;font-weight:800}
.fc-nm{font-weight:800;font-size:13px;line-height:1.1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fc-nm small{display:block;font-weight:600;font-size:10px;color:#666}
.fc-ps{display:flex;justify-content:space-between;gap:4px;color:#555;font-size:10.5px}
.fc-ps b.hit{color:#2F8F57;font-size:9px} .fc-ps b.miss{color:#C0392B;font-size:9px}
.fc-alt{font-size:9.5px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-bar{height:4px;border-radius:2px;background:#DDD6C4;overflow:hidden;margin-top:auto}
.fc-bar i{display:block;height:100%}
.fc-slot.proj{background:repeating-linear-gradient(135deg,#F7F4EA 0 6px,#F1ECDD 6px 12px)}
.fc-slot.proj .fc-nm{color:#555;font-style:italic}
.fc-slot.fog .fc-nm{filter:blur(3px)}
.fc-slot.done{background:#fff;border-color:#9A9488}
.fc-slot.void{opacity:.5}
.fc-slot.mine{outline:3px solid var(--gold);background:#FFF6D8}
.fc-you{font-size:10px;font-weight:900;color:#14100A;background:var(--gold);border-radius:4px;padding:0 4px}
.fc-slot.clock{animation:fcPulse 1s infinite}
@keyframes fcPulse{50%{box-shadow:0 0 14px 2px var(--gold)}}
.fc-av{display:grid;grid-template-columns:1.6fr 52px 1fr 48px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed #232D3F;font-size:12px}
.fc-b{height:7px;background:#202A3C;border-radius:4px;overflow:hidden}.fc-b i{display:block;height:100%;border-radius:4px}
.fc-trk{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:4px;align-items:center;font-size:12px;padding:3px 0;border-bottom:1px dashed #232D3F}
.fc-trk span.c{text-align:center;border-radius:5px;padding:2px 0;font-weight:800}
.fc-mock{display:grid;grid-template-columns:20px 1fr auto;gap:6px;font-size:12px;padding:3px 0;border-bottom:1px dashed #232D3F}
.fc-mock b{color:var(--muted)} .fc-mock.me{color:var(--gold)}
.tb-tier{border:1px solid var(--line);border-left:4px solid;border-radius:10px;padding:5px;margin-bottom:8px;background:var(--panel)}
.tb-th{font-weight:900;font-size:12px;padding:0 4px 5px}
.tb-row{display:grid;grid-template-columns:26px minmax(0,1.6fr) 40px 64px 70px auto;gap:6px;align-items:center;padding:4px 6px;border-radius:7px;background:rgba(255,255,255,.03);margin-bottom:3px;font-size:12px}
.tb-row.need{box-shadow:inset 3px 0 0 var(--red)}
.tb-row .rk{color:var(--gold);text-align:center}
.tb-row .up{color:var(--green);font-weight:800} .tb-row .dn{color:var(--red);font-weight:800}
.tb-ctl{display:flex;gap:3px;align-items:center}
.tb-sel{padding:2px 4px!important;font-size:11px!important;height:auto!important}
@media (max-width:640px){.tb-row{grid-template-columns:22px minmax(0,1fr) 34px 56px;}.tb-row>span:nth-child(5){display:none}.tb-ctl{grid-column:1/-1;justify-content:flex-end}}

.sm-map{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0B1A2C}
.sm-map img{display:block;width:100%;image-rendering:pixelated;cursor:crosshair}
.sm-col{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:#F2EFE7;border:2px solid #111;pointer-events:auto}
.sm-col.hot{background:var(--gold);box-shadow:0 0 8px var(--gold);animation:smPulse 1.6s infinite}
@keyframes smPulse{50%{box-shadow:0 0 2px var(--gold)}}
.sm-reg{position:absolute;transform:translate(-50%,-50%);background:rgba(8,10,14,.86);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}
.sm-reg small{display:block;font-weight:600;color:var(--muted);font-size:10px}
.sm-reg.sel{border-color:var(--gold);color:var(--gold)}
.sm-pins{position:absolute;top:-10px;right:-8px;display:flex;gap:2px}
.sm-pins i{font-style:normal;background:var(--gold);color:#14100A;border-radius:9px;font-size:9px;font-weight:900;padding:1px 4px;box-shadow:0 0 0 2px #000}
.sm-sc{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;cursor:pointer;font-size:12px}
.sm-sc.sel{border-color:var(--gold);background:#2A2414}
.sm-av{width:28px;height:28px;border-radius:7px;background:#2B3A55;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;flex:none}
.sm-rep{font-size:12px;margin:5px 0;padding-bottom:5px;border-bottom:1px dashed #232D3F}

.of-pop{position:absolute;z-index:20;background:rgba(10,13,20,.97);border:1px solid var(--of-accent,#E8B84A);border-radius:10px;padding:8px;min-width:210px;max-width:46%;font-size:12px;color:#F2EFE7;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.of-pop h4{font-family:Oswald,'Arial Narrow',sans-serif;font-size:13px;letter-spacing:.06em;color:var(--of-accent,#E8B84A);margin:0 0 6px;text-transform:uppercase;display:flex;justify-content:space-between}
.of-pop-x{cursor:pointer;padding:0 4px}
.of-pop button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:#1C2536;border:1px solid #2A3548;color:#F2EFE7;border-radius:7px;padding:6px 8px;margin-bottom:4px;font-weight:700;font-size:12px;cursor:pointer}
.of-pop button:hover{border-color:var(--of-accent,#E8B84A)}
.of-pop button small{display:block;font-weight:500;color:#8B97A8;font-size:10.5px}
.of-pop .bd{background:#E25555;color:#fff;border-radius:9px;padding:0 6px;font-size:10px;font-weight:900;white-space:nowrap}
.of-pop .lock{color:#8B97A8;font-size:10px;font-weight:800;white-space:nowrap}
.dc-cal{display:flex;gap:4px;margin:0 0 10px;flex-wrap:wrap}
.dc-cal div{flex:1;min-width:110px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted)}
.dc-cal div b{display:block;color:var(--chalk)} .dc-cal div small{font-size:10.5px}
.dc-cal div.on{border-color:var(--gold);background:#2A2414} .dc-cal div.on b{color:var(--gold)}
.dc-cal div.done b{color:var(--green)}
.dc-call{border-color:var(--gold)!important;box-shadow:0 0 18px rgba(232,184,74,.25);margin-bottom:12px}
.wr-wrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
#warCv{display:block;width:100%}
.wr-hs{position:absolute;border-radius:6px;outline:2px solid transparent;cursor:pointer}
.wr-hs:hover{outline-color:var(--gold);box-shadow:0 0 12px var(--gold)}
.wr-hs span{position:absolute;left:50%;bottom:-2px;transform:translate(-50%,100%);background:rgba(8,10,14,.9);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-weight:800;font-size:11px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
.wr-hs:hover span{opacity:1}
.wr-clock{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:rgba(8,10,14,.9);border:1px solid var(--line);border-radius:9px;padding:3px 12px;text-align:center}
.wr-clock small{display:block;color:var(--muted);font-size:10px}
.wr-clock b{font-family:'Courier New',monospace;font-size:14px;color:var(--chalk)}
.wr-clock.me{border-color:var(--gold);animation:fcPulse 1s infinite} .wr-clock.me b{color:var(--gold)}
.wr-toast{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(8,10,14,.94);border:1px solid var(--gold);border-radius:9px;padding:5px 12px;font-weight:800;font-size:12px;animation:wrFade 3.5s forwards}
@keyframes wrFade{0%,80%{opacity:1}100%{opacity:0}}

.tu-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:5px;margin-top:8px}
.tu-slot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel2,#1C2536);color:var(--chalk);cursor:pointer;text-align:left;font-size:12px}
.tu-slot.on{border-color:var(--gold);background:#2A2414}
.tu-slot i{font-style:normal;font-size:9px;font-weight:900;color:var(--red)}
.tu-slot small{color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tu-meter{height:9px;background:#202A3C;border-radius:5px;overflow:hidden}.tu-meter i{display:block;height:100%}
.tu-picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:5px}
.tu-pk{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;cursor:pointer;font-size:12px}
.tu-pk.on{border-color:var(--gold);background:#2A2414}
.tu-pk span{flex:1}

/* ===== practice field (pixel) ===== */
.practice{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:50;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--chalk);font-family:Inter,system-ui,sans-serif}
@media (orientation:portrait){ .practice{width:100vh;height:100vw;transform:rotate(90deg) translateY(-100%);transform-origin:top left} }
.pr-stage{position:relative;overflow:hidden}
#prCv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.pr-hs{position:absolute;cursor:pointer;border-radius:.6em;outline:.25em solid transparent;transition:outline-color .12s,box-shadow .12s;-webkit-tap-highlight-color:transparent;z-index:3}
.pr-hs:hover,.pr-hs.sel{outline-color:var(--gold);box-shadow:0 0 1.4em var(--gold)}
.pr-hs .lbl{position:absolute;left:50%;top:-.2em;transform:translate(-50%,-100%);white-space:nowrap;background:rgba(8,10,14,.9);border:1px solid var(--line);border-radius:.6em;padding:.25em .7em;font-size:max(9px,.75em);font-weight:800;letter-spacing:.06em;pointer-events:none}
.pr-hs.pit .lbl{top:.4em;left:.6em;transform:none;border-color:var(--gold);color:var(--gold)}
.pr-hs .fc{position:absolute;left:.3em;bottom:.3em;background:rgba(8,10,14,.85);border-radius:.5em;padding:.1em .5em;font-size:max(8px,.68em);font-weight:700;color:var(--gold);pointer-events:none}
.pr-hs .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8);font-weight:700;font-size:max(9px,.85em);pointer-events:none}
.pr-hs .rest{position:absolute;top:.3em;right:.3em;background:#3A1E1E;color:#FF9B9B;border-radius:.5em;padding:.1em .5em;font-size:max(8px,.7em);font-weight:800;pointer-events:none}
.pr-hs .cnt{position:absolute;top:-.6em;right:-.6em;min-width:1.7em;height:1.7em;border-radius:1em;background:var(--red);color:#fff;font-size:max(9px,.8em);font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 .35em;box-shadow:0 0 0 2px #000}
.pr-hud{position:absolute;display:flex;gap:6px;align-items:center;z-index:6;font-size:clamp(9px,1.25vw,12px)}
.pr-tl{top:1.5%;left:1%} .pr-tr{top:1.5%;right:1%}
.pr-b{bottom:1.8%;left:1%;right:1%;justify-content:space-between}
.pr-chip{background:rgba(8,10,14,.82);border:1px solid var(--line);border-radius:8px;padding:4px 9px;color:var(--muted);white-space:nowrap}
.pr-chip b{color:var(--chalk)} .pr-chip.g b{color:var(--gold)}
.pr-steps{display:flex;align-items:center;gap:4px}
.pr-steps span{padding:4px 9px;border-radius:8px;background:rgba(8,10,14,.82);border:1px solid var(--line);color:var(--muted);font-weight:800;white-space:nowrap}
.pr-steps span.on{border-color:var(--gold);color:var(--gold)} .pr-steps span.done{color:var(--green);border-color:#2E6B45}
.pr-seg{display:flex;background:rgba(8,10,14,.85);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.pr-seg button{background:none;border:0;color:var(--muted);font-weight:800;padding:6px 10px;font-size:inherit;cursor:pointer}
.pr-seg button.on{background:var(--gold);color:#14100A}
.pr-btn{background:#0B0F16;border:1px solid var(--line);color:var(--chalk);border-radius:8px;padding:6px 11px;font-size:inherit;font-weight:800;cursor:pointer;white-space:nowrap;position:relative}
.pr-btn.p{background:var(--gold);border-color:var(--gold);color:#14100A}
.pr-btn.gr{background:var(--green);border-color:var(--green);color:#08130C}
.pr-btn:disabled{cursor:default;background:#141A24;border-color:var(--line);color:#5C6676}
.pr-btn .cnt{position:absolute;top:-7px;right:-7px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.pr-grp{display:flex;gap:6px;align-items:center}
.pr-sheet{position:absolute;top:0;bottom:0;right:0;width:min(460px,58%);background:rgba(14,20,32,.98);border-left:1px solid var(--line);padding:12px 14px;overflow-y:auto;z-index:9;font-size:clamp(10px,1.2vw,12px)}

<script>
'use strict';
/* =====================================================
   TEAM MANAGER SIM — franchise mode
   75-man offseason rosters · 53-man season · 46 dressed
   Free agency · contracts · preseason · cutdown day
   ===================================================== */

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const R  = (a,b) => a + Math.random()*(b-a);
const RI = (a,b) => Math.floor(R(a, b+1));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[RI(0, arr.length-1)];
function gauss(){ let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const fmtClock = s => { s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '$' + (Math.round(n*10)/10) + 'M';

const store = {
  KEY:'gridironGeneralV3',
  get(){ try{ return JSON.parse(localStorage.getItem(this.KEY)); }catch(e){ return null; } },
  set(v){ try{ localStorage.setItem(this.KEY, JSON.stringify(v)); }catch(e){} },
  clear(){ try{ localStorage.removeItem(this.KEY); }catch(e){} }
};

/* ---------- multi-career save slots ---------- */
const CAREER_LIST_KEY = 'tms_careers_v1';
function getCareerList(){ try{ return JSON.parse(localStorage.getItem(CAREER_LIST_KEY)) || []; }catch(e){ return []; } }
function setCareerList(list){ try{ localStorage.setItem(CAREER_LIST_KEY, JSON.stringify(list)); }catch(e){} }
function careerStorageKey(id){ return 'tms_career_'+id; }
function loadCareerState(id){ try{ return JSON.parse(localStorage.getItem(careerStorageKey(id))); }catch(e){ return null; } }
function saveCareerState(id, state){ try{ localStorage.setItem(careerStorageKey(id), JSON.stringify(state)); return true; }catch(e){ return false; } }
function deleteCareerState(id){
  try{ localStorage.removeItem(careerStorageKey(id)); }catch(e){}

function tagStart(y){ const d = new Date(y,1,1); d.setDate(1 + ((8-d.getDay())%7) + 7); return d; } // 2nd Monday of Feb

function faOpenDate(y){ return leagueYearDate(y); }
function draftDate(y){ const d = new Date(y,3,1); d.setDate(1 + ((11-d.getDay())%7) + 7); return d; } // 2nd Thursday of April
function otaDate(y,wk){ const d = new Date(y,4,1); d.setDate(1 + ((8-d.getDay())%7) + (wk-1)*7); return d; } // Mondays in May
function campDate(y){ const d = new Date(y,6,31); d.setDate(31 - ((d.getDay()+6)%7)); return d; } // last Monday of July
function nthSaturdayOfAugust(y,n){ const d = new Date(y,7,1); d.setDate(1 + ((6-d.getDay()+7)%7) + (n-1)*7); return d; }
function seasonStartDate(y){ const d = new Date(y,8,1); d.setDate(1 + ((7-d.getDay())%7)); return d; } // first Sunday of Sept
function cutdownDate(y){ const d = seasonStartDate(y); d.setDate(d.getDate()-1); return d; }
function weekDate(y,w){ const d = seasonStartDate(y); d.setDate(d.getDate() + (w-1)*7); return d; }
function tradeDeadline(y){ const d = weekDate(y,9); d.setDate(d.getDate()+2); return d; } // Tuesday after Week 9
function fmtDate(d){ return d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric', year:'numeric'}); }
function currentDate(){

  if(G.phase==='tag') return tagStart(y);
  if(G.phase==='fa') return faOpenDate(y);
  if(G.phase==='draft') return draftDate(y);
  if(G.phase==='ota') return otaDate(y, G.otaWeek || 1);
  if(G.phase==='camp') return campDate(y);
  if(G.phase==='preseason') return nthSaturdayOfAugust(y, G.preWeek);
  if(G.phase==='cutdown') return cutdownDate(y);
  if(G.phase==='playoffs') return weekDate(y, 15 + G.playoffs.round);
  if(G.phase==='offseason') return new Date(y+1, 1, tagStart(y+1).getDate());
  return weekDate(y, Math.min(G.week,15));
}

function staffFingerprint(){
  if(!G.staff) return '';
  return [G.staff.OC, G.staff.DC, G.staff.STC].map(c => c ? c.id : 0).join(',') + '|' +
    Object.keys(G.staff.pos||{}).sort().map(p => (G.staff.pos[p]?G.staff.pos[p].id:0)).join(',');

function generateWeeklyRecs(){
  if(G.phase !== 'hub' || !G.staff) return;
  const key = G.year+':'+G.week+'|'+staffFingerprint();
  if(G.weeklyRecsKey === key) return;
  G.weeklyRecsKey = key;
  G.weeklyRecs = [];
  const me = meT();
  let rid = 1;
  const opp = userGame ? (() => { const g = userGame(); if(!g) return null; return G.teams[g.a===G.userTeam?g.b:g.a]; })() : null;

  if(G.staff.OC && Math.random() < .7){
    const ufc = userForecast();
    const badWx = !!(ufc && ufc.type !== 'dome' && (ufc.chance >= 50 || ufc.wind >= 15));
    const leanRun = badWx || offRush(me) >= offPass(me);
    G.weeklyRecs.push({ id: rid++, coachRole:'OC', coachPos:null, coachName:G.staff.OC.name, kind:'tendency',
      statKey: leanRun ? 'offRush' : 'offPass',
      label: badWx ? 'Forecast looks ugly ('+(ufc.chance>=50 ? ufc.chance+'% '+ufc.precipType.toLowerCase() : ufc.wind+' mph wind')+'). Lean on the run game and keep throws short.' : leanRun ? 'Lean on the run game this week — it\'s our strength.' : 'Air it out this week — our passing attack gives us the edge.',
      status:'pending' });
  }
  if(G.staff.DC && Math.random() < .7){
    const oppPass = opp ? offPass(opp) : 75;
    const blitzMore = (defPass(me) + 6) < oppPass ? false : true; // blitz unless their pass offense clearly outmatches our coverage
    G.weeklyRecs.push({ id: rid++, coachRole:'DC', coachPos:null, coachName:G.staff.DC.name, kind:'tendency',
      statKey: blitzMore ? 'defPass' : 'defRush',
      label: blitzMore ? 'Turn the pass rush loose this week — get after their quarterback.' : 'Stay disciplined and control the run this week.',
      status:'pending' });
  }
  const posOpps = [];
  Object.keys(G.staff.pos || {}).forEach(pos => {
    const coach = G.staff.pos[pos];
    if(!coach) return;
    const side = ['QB','RB','WR','TE','OL'].includes(pos) ? 'off' : 'def';
    const form = side === 'off' ? offFormOf(me) : defFormOf(me);
    const formKey = side === 'off' ? offFormKeyOf(me) : defFormKeyOf(me);
    const lu = lineupFor(me, form, formKey);
    lu.forEach((slot, i) => {
      if(!slot.p || SPOT_GROUP[slot.spot] !== pos) return;
      const starter = slot.p;
      let bestBench = null, bestEff = -1;
      me.roster.forEach(p => {
        if(p.pos !== pos || p.id === starter.id || p.ir) return;
        if(lu.some(x => x.p && x.p.id === p.id)) return; // already starting elsewhere
        const e = effRating(p, slot.spot, form.scheme);
        if(e > bestEff){ bestEff = e; bestBench = p; }
      });
      if(bestBench && bestEff >= slot.eff - 4){
        posOpps.push({ coach, pos, side, formKey, slotIndex:i, spot:slot.spot, starter, bench:bestBench, margin: bestEff - slot.eff });
      }
    });
  });
  posOpps.sort((a,b) => b.margin - a.margin);
  const seen = new Set();
  posOpps.forEach(o => {
    if(seen.has(o.pos) || G.weeklyRecs.length >= 4) return;
    seen.add(o.pos);
    G.weeklyRecs.push({ id: rid++, coachRole:'POS', coachPos:o.pos, coachName:o.coach.name, kind:'personnel',
      formSide:o.side, formKey:o.formKey, slotIndex:o.slotIndex, benchId:o.bench.id, starterId:o.starter.id, pos:o.pos, spot:o.spot,
      label: 'Start '+esc(o.bench.name)+' over '+esc(o.starter.name)+' at '+o.spot+' this week.',
      status:'pending' });
  });
  G.weeklyRecs = G.weeklyRecs.slice(0,4);
}
function coachForRec(rec){
  if(rec.coachRole === 'POS') return G.staff.pos && G.staff.pos[rec.coachPos];
  return G.staff[rec.coachRole];
}
function resolveRec(id, choice){
  const rec = (G.weeklyRecs||[]).find(r => r.id === id);
  if(!rec || rec.status !== 'pending') return;
  rec.status = choice === 'accept' ? 'accepted' : choice === 'compromise' ? 'compromised' : 'rejected';
  const coach = coachForRec(rec);
  bumpCoachRel(coach, choice==='accept' ? 4 : choice==='compromise' ? 1 : -3);
  if(rec.kind === 'personnel' && choice !== 'reject'){
    const prevOverride = (G.lineupOverride && G.lineupOverride[rec.formKey] && G.lineupOverride[rec.formKey][rec.slotIndex]) || null;
    if(!G.lineupOverride) G.lineupOverride = {};
    if(!G.lineupOverride[rec.formKey]) G.lineupOverride[rec.formKey] = {};
    G.lineupOverride[rec.formKey][rec.slotIndex] = rec.benchId;
    if(choice === 'compromise'){
      if(!G.tempLineupReverts) G.tempLineupReverts = [];
      G.tempLineupReverts.push({ formKey: rec.formKey, slotIndex: rec.slotIndex, prevId: prevOverride });
    }
  }
  save(); render();
}
function revertTempLineups(){
  if(!G.tempLineupReverts || !G.tempLineupReverts.length) return;
  G.tempLineupReverts.forEach(r => {
    if(!G.lineupOverride || !G.lineupOverride[r.formKey]) return;
    if(r.prevId == null) delete G.lineupOverride[r.formKey][r.slotIndex];
    else G.lineupOverride[r.formKey][r.slotIndex] = r.prevId;
  });
  G.tempLineupReverts = [];
}
function recFollowedCount(){
  const list = G.weeklyRecs || [];
  const followed = list.filter(r => r.status==='accepted').length + list.filter(r => r.status==='compromised').length * .5;
  return { followed: Math.round(followed*10)/10, total: list.length };

function computeGameplan(){
  const gp = { offRush:0, offPass:0, defRush:0, defPass:0 };
  (G.weeklyRecs||[]).forEach(r => {
    if(r.status === 'pending') r.status = 'rejected'; // unresolved by kickoff — assume ignored
    if(r.kind !== 'tendency') return;
    if(r.status === 'accepted') gp[r.statKey] += 2.5;

function askOwnerForBudget(){
  if(G.budgetAskYear === G.year){ alert('You already asked the owner this year — try again next season.'); return; }
  G.budgetAskYear = G.year;
  const reserve = 2; // the owner won't let cash reserves drop below this floor
  const available = Math.max(0, (G.cash||0) - reserve);
  if(available < 0.5){
    save(); render();
    return { ok:false, reason:'cash' };
  }
  const chance = clamp(G.confidence/100, .05, .95);
  const roll = Math.random();
  if(roll < chance){
    const desired = 2 + (G.confidence/100)*4;
    const grant = Math.round(Math.min(desired, available) * 10) / 10;
    G.staffCapBonus = (G.staffCapBonus||0) + grant;
    G.cash = Math.round(((G.cash||0) - grant) * 10) / 10;
    save(); render();
    return { ok:true, amount: grant };
  }
  save(); render();
  return { ok:false, reason:'confidence' };
}
function doAskOwner(){
  const result = askOwnerForBudget();
  if(!result) return;
  if(result.ok) alert('The owner comes through — staff budget increased by '+money(result.amount)+', drawn straight from the club\'s cash reserves.');
  else if(result.reason === 'cash') alert('The cupboard is bare — there isn\'t enough cash in the club\'s reserves to fund this right now. Ticket revenue and sponsorships need a season or two to build it back up.');
  else alert('The owner turns you down this time. Confidence in the front office matters — try again next year.');
}

function runPracticeSession(offTier, defTier){
  if(!G.practiceScene || G.practiceScene.phase !== '11v11') return null;
  if(G.practiceScene.teamReps.length >= 8) return null;
  const t = meT();
  const offLu = practiceLineup(t, 'o', offTier).filter(x => x.p);
  const defLu = practiceLineup(t, 'd', defTier).filter(x => x.p);
  if(!offLu.length || !defLu.length) return null;
  const offAvg = offLu.reduce((s,x)=>s+x.eff,0)/offLu.length;
  const defAvg = defLu.reduce((s,x)=>s+x.eff,0)/defLu.length;
  const edge = offAvg - defAvg;
  const offWins = Math.random() < clamp(0.5 + edge/40, 0.15, 0.85);
  const participants = offLu.concat(defLu).map(x => x.p);
  participants.forEach(p => {
    if(prResting(p.id)) return;
    p.fatigue = clamp((p.fatigue||0) + Math.round(RI(8,12)*prCondMult(p)), 0, 100);
    p.form = clamp((p.form==null?100:p.form) + RI(4,8), 0, 100);
  });
  const winningSide = (offWins ? offLu : defLu).map(x => x.p);
  const standout = pickWeighted(winningSide);
  let standoutDev = false;
  if(standout && Math.random() < 0.3){
    const cap = standout.ceiling || 99;
    if(standout.rating < cap){ standout.rating = clamp(standout.rating+1, 50, cap); logEv(standout, 'dev', 'Stood out in practice', 1); standoutDev = true; }
  }
  const result = { type:'11v11', offWins, offTier, defTier, standoutId: standout?standout.id:null, standoutDev, offAvg:Math.round(offAvg), defAvg:Math.round(defAvg), participantIds: participants.map(p=>p.id) };
  G.practiceScene.teamReps.push(result);
  G.lastPracticeResult = result;
  save(); render();
  return result;
}

  if(activeCount(me) >= rosterLimit()) return { kind:'blocked', msg:'Roster is full ('+rosterLimit()+' max right now) — cut someone first.' };
  salary = clamp(Math.round(salary*10)/10, 0.5, 40);
  years = clamp(Math.round(years), 1, 5);
  const needed = neededValueFor(p, me);
  const total = salary * (1 + (years-1) * .05);
  if(total >= needed){
    G.fa.splice(i,1);
    p.salary = salary; p.years = years; p.injWeeks = 0; p.dressed = true; p.contractYear = G.year;
    ensureBio(p);
    logEv(p, 'ct', 'Signed with '+me.city+' — '+money(salary)+'/yr × '+years, 0);
    bumpRel(p, 'coach', 2);
    me.roster.push(p);
    faOpenId = null;
    if(G.phase === 'fa') aiFAWave(RI(2,4));
    save(); render();
    return { kind:'signed', msg:'Signs with '+me.city+' at '+money(salary)+'/yr × '+years+'yr.' };
  }
  if(total >= needed * .85){
    save();
    return { kind:'soft', msg:'He\'ll hear an improved offer — you\'re close, try sweetening the deal.' };
  }
  bumpRel(p, 'coach', -3);
  save();
  return { kind:'hard', msg:'Declined — that\'s too far off, and he won\'t forget the lowball.' };
}

/* ---------- depth chart & unit ratings ---------- */
function poolOf(t){

/* ---------- fit-aware lineups ---------- */
function formMult(p){
  const f = p.form == null ? 100 : p.form;
  return 0.88 + 0.12 * clamp(f,0,100)/100; // fully rusty (0) plays at 88% of true rating, full form (100) plays at 100%
}
function effRating(p, slotSpot, scheme){
  let r = p.rating;
  if(p.spot !== slotSpot){
    const fit = SPOT_FIT[p.spot];
    r -= (fit && fit[slotSpot] != null) ? fit[slotSpot] : 4;
  }
  if(scheme && p.scheme !== 'any' && (p.pos==='DL' || p.pos==='LB') && p.scheme !== scheme)
    r -= SCHEME_PENALTY;
  r += hgtBonus(p) + prFilmBonus(p);
  r *= formMult(p);
  return Math.max(45, r);
}
function offFormKeyOf(t){ return (t.idx === G.userTeam ? G.offForm : t.offForm) || 'single'; }
function defFormKeyOf(t){ return (t.idx === G.userTeam ? G.defForm : t.defForm) || 'f43'; }
function offFormOf(t){ return OFF_FORMS[offFormKeyOf(t)] || OFF_FORMS.single; }
function defFormOf(t){ return DEF_FORMS[defFormKeyOf(t)] || DEF_FORMS.f43; }
function applyChemistry(lineup){
  const starters = lineup.filter(x => x.p && x.p.college);
  starters.forEach(x => {
    const mate = starters.find(y => y.p.id !== x.p.id && y.p.college.name === x.p.college.name);
    if(mate) x.eff = Math.min(99, x.eff + 1);
  });
  return lineup;
}
function lineupFor(t, form, formKey, skipIds){
  const pool = poolOf(t).filter(p => p.pos !== 'K' && !(skipIds && skipIds.has(p.id)));
  const used = new Set();
  const ov = (t.idx === G.userTeam && formKey && G.lineupOverride) ? G.lineupOverride[formKey] : null;
  const lineup = form.slots.map((spot, i) => {
    let chosen = null;
    if(ov && ov[i] != null){
      const cand = pool.find(p => p.id === ov[i] && SPOT_GROUP[spot] === p.pos && !used.has(p.id));
      if(cand) chosen = cand;
    }
    if(!chosen){
      let best = null, br = -1;
      pool.forEach(p => {
        if(used.has(p.id) || SPOT_GROUP[spot] !== p.pos) return;
        const e = effRating(p, spot, form.scheme);
        if(e > br){ br = e; best = p; }
      });
      chosen = best;
    }
    if(chosen) used.add(chosen.id);
    return { spot, p: chosen, eff: chosen ? effRating(chosen, spot, form.scheme) : 46, manual: !!(chosen && ov && ov[i] === chosen.id) };
  });
  return applyChemistry(lineup);
}
function unitFrom(lineup, W, mod){
  let sum = 0, wsum = 0;
  lineup.forEach(sl => { const w = W[sl.spot] || 0; sum += w * sl.eff; wsum += w; });
  return (wsum ? sum / wsum : 50) + mod;
}
function sideLineup(t, side, s){
  const form = side === 'o' ? offFormOf(t) : defFormOf(t);
  const formKey = side === 'o' ? offFormKeyOf(t) : defFormKeyOf(t);
  if(!s) return { form, lu: lineupFor(t, form, formKey) };
  const first = lineupFor(t, form, formKey);
  const skip = new Set(first.filter(x => x.p).map(x => x.p.id));
  return { form, lu: lineupFor(t, form, formKey, skip) };
}
function offPassS(t,s){ const {form,lu} = sideLineup(t,'o',s); return unitFrom(lu, W_OFF_PASS, form.passMod); }
function offRushS(t,s){ const {form,lu} = sideLineup(t,'o',s); return unitFrom(lu, W_OFF_RUSH, form.runMod); }
function defPassS(t,s){ const {form,lu} = sideLineup(t,'d',s); return unitFrom(lu, W_DEF_PASS, form.passMod); }
function defRushS(t,s){ const {form,lu} = sideLineup(t,'d',s); return unitFrom(lu, W_DEF_RUSH, form.runMod); }
function blend(f,t){ return LINEUP==='pre' ? (f(t,0)+f(t,1))/2 : f(t,0); }
function offPass(t){ return blend(offPassS,t) + (t.idx === G.userTeam ? ocBoost() + gameplanBonus('offPass') : 0); }
function offRush(t){ return blend(offRushS,t) + (t.idx === G.userTeam ? ocBoost() + gameplanBonus('offRush') : 0); }
function defPass(t){ return blend(defPassS,t) + (t.idx === G.userTeam ? dcBoost() + gameplanBonus('defPass') : 0); }
function defRush(t){ return blend(defRushS,t) + (t.idx === G.userTeam ? dcBoost() + gameplanBonus('defRush') : 0); }
function kRating(t){ return st(t,'K',0) + (t.idx === G.userTeam ? stcBoost() : 0); }
function ovr(t){ return Math.round((offPass(t)+offRush(t)+defPass(t)+defRush(t))/4); }

/* ---------- gameday actives (46 dress) ---------- */
function autoDress(t, respectScratches){
  const healthy = t.roster.filter(p => p.injWeeks === 0).sort((a,b) => b.rating - a.rating);
  t.roster.forEach(p => { if(p.injWeeks > 0) p.dressed = false; });
  const scratched = respectScratches ? healthy.filter(p => p.dressed === false) : [];
  healthy.forEach(p => p.dressed = false);
  const need = Object.assign({}, MIN53);
  let count = 0;
  const eligible = healthy.filter(p => !scratched.includes(p));
  eligible.forEach(p => { if(need[p.pos] > 0 && count < LIMIT_DRESS){ p.dressed = true; need[p.pos]--; count++; } });
  eligible.forEach(p => { if(!p.dressed && count < LIMIT_DRESS){ p.dressed = true; count++; } });
  // if scratches left us short, pull scratched guys back in
  scratched.forEach(p => { if(count < LIMIT_DRESS - 4){ p.dressed = true; count++; } });
  return count;
}
function dressedCount(t){ return t.roster.filter(p => p.injWeeks===0 && p.dressed !== false).length; }

/* ---------- cutdown to 53 ---------- */
function autoCutList(t){

  const sorted = t.roster.slice().sort((a,b) => b.rating - a.rating);
  const keep = new Set(), need = Object.assign({}, MIN53);
  sorted.forEach(p => { if(need[p.pos] > 0){ keep.add(p.id); need[p.pos]--; } });
  sorted.forEach(p => { if(!keep.has(p.id) && keep.size < LIMIT_REG) keep.add(p.id); });

}

function makePreSchedule(){
  const rounds = [];
  for(let r=0; r<3; r++){
    const oppIdx = G.preOpps[r];
    const games = [Math.random() < .5 ? {a:G.userTeam, b:oppIdx} : {a:oppIdx, b:G.userTeam}];
    const rest = [];
    for(let i=0;i<16;i++) if(i!==G.userTeam && i!==oppIdx) rest.push(i);
    for(let i=rest.length-1;i>0;i--){ const j=RI(0,i); [rest[i],rest[j]]=[rest[j],rest[i]]; }
    for(let i=0;i<rest.length;i+=2) games.push({a:rest[i], b:rest[i+1]});
    rounds.push(games);
  }
  return rounds;
}
function simAIPreseasonRound(round){
  if(!G.preSchedule || !G.preSchedule[round-1]) return;
  G.preSchedule[round-1].forEach(g => {
    if(g.done || g.a === G.userTeam || g.b === G.userTeam) return;
    const r = quickSim(g.a, g.b, g, nthSaturdayOfAugust(G.year, round));
    g.as = r.as; g.bs = r.bs; g.done = true;
    g.report = { a:g.a, b:g.b, as:g.as, bs:g.bs, devs:[], injuries:[], phase:'pre', week:round };
    g.week = round; g.year = G.year; g.phase = 'pre';
  });
}
function makeSchedule(){
  const n = 16, rounds = [];
  const arr = []; for(let i=1;i<n;i++) arr.push(i);
  for(let r=0; r<n-1; r++){
    const games = [];
    const ring = [0].concat(arr);
    for(let i=0; i<n/2; i++){
      const a = ring[i], b = ring[n-1-i];
      games.push(Math.random() < .5 ? {a,b} : {a:b, b:a});
    }
    rounds.push(games);
    arr.unshift(arr.pop());
  }
  for(let i=rounds.length-1; i>0; i--){ const j=RI(0,i); [rounds[i],rounds[j]]=[rounds[j],rounds[i]]; }
  return rounds;
}
function quickSim(ai, bi, g, date){
  const A = G.teams[ai], B = G.teams[bi];
  const wx = g ? finalConditions(g, date || currentDate()) : null;
  const fx = wxFx(wx);
  function drives(off, def, home){
    let pts = 0;
    const passShare = offPass(off) / Math.max(1, offPass(off) + offRush(off));
    const suppress = fx.score * (0.6 + passShare*0.8);   // bad weather hurts pass-first offenses most
    const env = wx ? teamEnvEdge(off.idx, wx) + (home ? .008 : 0) : (home ? .02 : 0);
    for(let d=0; d<11; d++){
      const edge = ( (offPass(off)+offRush(off))/2 - (defPass(def)+defRush(def))/2 )/100 + env;
      const roll = Math.random() + edge*0.9 + suppress;
      if(roll > .74) pts += 7;
      else if(roll > .58) pts += 3;
      else if(roll > .555) pts += 7;
    }
    return pts;
  }
  let as = drives(A,B,true), bs = drives(B,A,false);
  if(as === bs){ if(Math.random()<.5) as += 3; else bs += 3; }
  const out = {a:ai, b:bi, as, bs};
  if(wx) out.wx = wx;
  return out;
}
function applyResult(res){
  const A = G.teams[res.a], B = G.teams[res.b];
  A.pf += res.as; A.pa += res.bs; B.pf += res.bs; B.pa += res.as;
  if(res.as > res.bs){ A.w++; B.l++; } else { B.w++; A.l++; }
}

  const wk = G.schedule && G.schedule[G.week-1];
  if(!wk) return null;
  return wk.find(g => g.a === G.userTeam || g.b === G.userTeam);

/* ---------- player stats, stat-driven development, market value ---------- */
function blankStats(){ return {gp:0,py:0,ptd:0,ry:0,rtd:0,cy:0,ctd:0,tk:0,sk:0,int:0,ff:0,fgm:0}; }
function stOf(p){ if(!p.st) p.st = blankStats(); return p.st; }
function statScore(p){
  const s = p.st; if(!s) return 0;
  return s.py*.025 + s.ptd*4 + s.ry*.09 + s.rtd*5 + s.cy*.09 + s.ctd*5 + s.tk*.45 + s.sk*3.5 + s.int*5 + s.fgm*2;
}
const STAT_BENCH = {QB:115, RB:58, WR:50, TE:36, OL:0, DL:42, LB:52, CB:32, S:36, K:50}; // solid-starter season score
function statMult(p){
  const bench = STAT_BENCH[p.pos];
  if(!bench) return 1;
  const score = (p.lastScore || 0) + statScore(p);
  if(score <= 0) return 1;
  return clamp(.9 + .3 * (score/bench - 1), .85, 1.3);
}
function marketFor(p, ageBump){ return Math.round(salaryFor(p.rating, p.pos, p.age + (ageBump||0)) * statMult(p) * 10) / 10; }
function bumpDev(p, hot){
  if(!hot || Math.random() > .55) return false;

      const coordCoach = groupRole && G.staff[groupRole];
      if(posCoach) coachPointsFor(posCoach, 1);
      if(coordCoach) coachPointsFor(coordCoach, 1);
    }
    return true;
  }
  return false;
}
function shareOut(total, players, jitter){
  // split a total among players weighted by rating, with noise
  if(!players.length) return [];
  const w = players.map(p => Math.pow(p.rating, 2) * R(1-jitter, 1+jitter));
  const sum = w.reduce((a,b)=>a+b,0);
  return w.map(x => total * x / sum);
}
/* ---------- post-game box score report ---------- */
function snapshotStats(teamIdxList){

function lineScore(l){ return (l.py||0)*.025+(l.ptd||0)*4+(l.ry||0)*.09+(l.rtd||0)*5+(l.cy||0)*.09+(l.ctd||0)*5+(l.tk||0)*.45+(l.sk||0)*3.5+(l.int||0)*5+(l.fgm||0)*2; }
function buildGameReport(ga, gb, asScore, bsScore, snap, myRisers, injury){
  const report = { a:ga, b:gb, as:asScore, bs:bsScore, teams:{}, progressions: (myRisers||[]).slice(), injury: injury||null };
  [ga, gb].forEach(ti => {

}
function statPointsForPlayer(pos, gl){

function recordGameStats(ai, bi, as, bs, liveBox){

      if(myGamePlayed){

        G.trainPts = (G.trainPts||0) + gamePts;
        if(gamePts > 0){
          G.confidence = clamp(G.confidence + Math.min(gamePts*2, 16), 0, 100);
          if(myP) logEv(myP, 'dev', 'Earned '+gamePts+' training point'+(gamePts!==1?'s':'')+' from this game', 0);
        } else {

    }

  }
  [[ai,as,bi],[bi,bs,ai]].forEach(([ti,pts,oi]) => {
    const t = G.teams[ti], o = G.teams[oi];
    const olu = lineupFor(t, offFormOf(t), offFormKeyOf(t));
    const dlu = lineupFor(t, defFormOf(t), defFormKeyOf(t));
    const at = spot => olu.filter(x=>x.spot===spot && x.p).map(x=>x.p);
    const datPos = pos => dlu.filter(x=>x.p && x.p.pos===pos).map(x=>x.p);
    const pf = (pts+10)/34;
    const passYd = Math.max(60, Math.round((165 + R(0,110)) * pf * (1 + (offPass(t)-defPass(o))/70)));
    const rushYd = Math.max(30, Math.round((92 + R(0,75)) * pf * (1 + (offRush(t)-defRush(o))/70)));
    let tds = Math.floor(pts/7), fgs = clamp(Math.round((pts - tds*7)/3), 0, 6);
    let ptd = 0, rtd = 0;
    for(let i=0;i<tds;i++){ if(Math.random() < passYd/(passYd+rushYd*1.4)) ptd++; else rtd++; }
    const qb = at('QB')[0], rbs = at('RB'), recvs = at('WR').concat(at('TE'));
    if(qb){ const s=stOf(qb); s.gp++; s.py+=passYd; s.ptd+=ptd; const hot = passYd>=290||ptd>=4; trackMe(qb, {py:passYd, ptd:ptd}); if(bumpDev(qb, hot)) risers.push(qb); }

    if(rushers.length){

        const yd = Math.round(rushYd*cuts[i]); const s=stOf(p); if(p!==qb) s.gp++;
        s.ry+=yd; const myTd = (i===0)? rtd : 0; s.rtd+=myTd;

    }

    recvs.forEach((p,i) => {
      const yd = Math.round(recYds[i]); const s=stOf(p); s.gp++;
      s.cy+=yd; const myTd = (p===tdOwner)? ptd : 0; s.ctd+=myTd;
      const hot = yd>=100||myTd>=2; trackMe(p, {cy:yd, ctd:myTd});

    });
    // defense

    const tackles = RI(34,52);
    [[lbs,.42],[ss,.22],[cbs,.18],[dls,.18]].forEach(([grp,cut]) => {
      shareOut(tackles*cut, grp, .4).forEach((v,i) => {
        const p = grp[i], s = stOf(p); s.gp++;
        const tk = Math.round(v); s.tk += tk;

    let ints = Math.random() < .38 ? RI(1, 2) : 0;
    const balls = cbs.concat(ss);
    while(ints-- > 0 && balls.length){ const p = pick(balls), s = stOf(p); s.int++; const hot = Math.random()<.6; trackMe(p, {int:1}); if(bumpDev(p, hot)) risers.push(p); }

    let ffs = Math.random() < .4 ? 1 : 0;

  });
  if(G.mode === 'player' && G.playerId){
    G.playerGamePlayed = myGamePlayed;
    if(myGamePlayed){
      const myP = mePlayer();
      const gamePts = myP ? statPointsForPlayer(myP.pos, myGameLine) : 0;
      G.trainPts = (G.trainPts||0) + gamePts;
      if(gamePts > 0){
        G.confidence = clamp(G.confidence + Math.min(gamePts*2, 16), 0, 100);
        if(myP) logEv(myP, 'dev', 'Earned '+gamePts+' training point'+(gamePts!==1?'s':'')+' from this game', 0);
      } else {

}

    if(p.ir) return;
    bumpRel(p, 'coach', p.dressed !== false ? .3 : -.3); // usage
    bumpRel(p, 'coach', won ? .2 : -.1); // winning vs losing

        if(myP && (myP.fatigue||0) >= 50){

  checkMidseasonFiring();

}

/* ---------- standings & playoffs ---------- */
function sortStand(list){
  return list.slice().sort((x,y) => (y.w - x.w) || ((y.pf-y.pa)-(x.pf-x.pa)) || (y.pf - x.pf));
}
function seedSort(list){
  return list.slice().sort((x,y) => (y.w - x.w) || (x.pa - y.pa)); // wins desc, then points forced (allowed) asc — fewer points forced by the defense = higher seed
}
function confSeeds(conf){
  const teams = G.teams.filter(t => t.conf === conf);
  const divQualifiers = [0,1].flatMap(d => seedSort(teams.filter(t => t.div === d)).slice(0,2)); // top 2 from each division
  return seedSort(divQualifiers).map(t => t.idx);
}
function buildPlayoffs(){
  G.phase = 'playoffs';
  try { bowlWeek(); } catch(e){ console.error('bowl week', e); }
  const s0 = confSeeds(0), s1 = confSeeds(1);
  const berth = s0.includes(G.userTeam) || s1.includes(G.userTeam);
  if(berth){ G.career.berths++; if(G.mode !== 'player') G.confidence = clamp(G.confidence + 10, 0, 100); bumpFan(4); }
  else{ if(G.mode !== 'player') G.confidence = clamp(G.confidence - 8, 0, 100); bumpFan(-2); }
  G.playoffs = {
    round: 1, userIn: berth,
    r1: [ {a:s0[0], b:s0[3], done:false}, {a:s0[1], b:s0[2], done:false},
          {a:s1[0], b:s1[3], done:false}, {a:s1[1], b:s1[2], done:false} ],
    r2: [], r3: [], champion: null,
    seeds: {0:s0, 1:s1}

  save();
}
function playoffGames(){ return G.playoffs['r'+G.playoffs.round]; }
function playoffUserGame(){
  return playoffGames().find(g => !g.done && (g.a === G.userTeam || g.b === G.userTeam));

function simPlayoffRound(){
  playoffGames().forEach(g => {

function advancePlayoffRound(){
  const P = G.playoffs;

    P.r2 = [ {a:P.r1[0].winner, b:P.r1[1].winner, done:false},

/* =====================================================
   OFFSEASON MACHINE
   offseason summary → (re-sign) → March expiry → FA →
   draft → preseason ×3 → cutdown → new season
   ===================================================== */
function resignPlayer(pid){
  const me = meT();
  const p = me.roster.find(x => x.id === pid);
  if(!p || p.years > 1 || p.resigned) return;
  const newSalary = userPrice(p, 1);
  p.years = RI(2,3);
  p.salary = newSalary;
  p.resigned = true; p.contractYear = G.year;
  p.contract = { base: Array(p.years).fill(newSalary), bonusProration: 0, bonusYearsLeft: 0, totalBonus: 0 };
  logEv(p, 'ct', 'Re-signed with '+me.city+' — '+money(newSalary)+'/yr × '+p.years, 0);
  bumpRel(p, 'coach', 3);
  save(); render();
}
/* extend a contract already in force: negotiate total value (as a % of fair market),
   how much of it is a signing bonus (prorated up to 5 yrs — lowers this year's hit,
   creates dead-cap risk if he leaves early), and whether the base salary is flat
   or escalating (rises each year — the real lever that pushes weight to later years). */
let extendDraft = null;
function extendDraftFor(pid){
  const me = meT();
  const p = me.roster.find(x => x.id === pid);
  if(!p) return null;
  if(!extendDraft || extendDraft.pid !== pid) extendDraft = { pid, addYears: 2, valuePct: 100, bonusPct: 30, escalating: false };
  return extendDraft;
}
function setExtendYears(pid, v){ const d = extendDraftFor(pid); if(d) d.addYears = clamp(parseInt(v)||1, 1, 5); render(); }
function setExtendValue(pid, v){ const d = extendDraftFor(pid); if(d) d.valuePct = clamp(parseInt(v)||100, 75, 130); render(); }
function setExtendBonus(pid, v){ const d = extendDraftFor(pid); if(d) d.bonusPct = clamp(parseInt(v)||0, 0, 60); render(); }
function toggleExtendEscalating(pid){ const d = extendDraftFor(pid); if(d) d.escalating = !d.escalating; render(); }
function applyExtendPreset(pid, preset){
  const d = extendDraftFor(pid); if(!d) return;
  if(preset === 'safe'){ d.bonusPct = 10; d.escalating = false; }
  else if(preset === 'balanced'){ d.bonusPct = 30; d.escalating = false; }
  else if(preset === 'relief'){ d.bonusPct = 55; d.escalating = true; }
  render();
}
function extendBaseline(p){
  const c = contractOf(p);
  let remainingCurrentValue = 0;
  for(let i=0;i<p.years;i++) remainingCurrentValue += scheduleSalary(c, i);
  const marketNow = userPrice(p, 1);
  return { remainingCurrentValue, marketNow, marketTotal: remainingCurrentValue + marketNow*1 };
}
function extendPreviewFor(pid){
  const me = meT();
  const p = me.roster.find(x => x.id === pid);
  const d = extendDraftFor(pid);
  if(!p || !d) return null;
  const c = contractOf(p);
  let remainingCurrentValue = 0;
  for(let i=0;i<p.years;i++) remainingCurrentValue += scheduleSalary(c, i);
  const marketNow = userPrice(p, 1);
  const marketTotal = remainingCurrentValue + marketNow*d.addYears;
  const baseOffered = Math.round(marketTotal * (d.valuePct/100) * 10) / 10;
  const offeredTotal = Math.round(baseOffered * (1 + (d.bonusPct/100) * 0.15) * 10) / 10; // a bigger bonus sweetens the total ask, not just reshuffles it
  const newYears = p.years + d.addYears;
  const sched = buildContractSchedule(offeredTotal, newYears, d.bonusPct/100, d.escalating);
  const verdict = contractVerdict(offeredTotal, marketTotal, d.bonusPct/100, p.rating);

}
function proposeExtension(pid){
  const preview = extendPreviewFor(pid);
  if(!preview) return;
  const { p, sched, offeredTotal, newYears, verdict } = preview;
  const me = meT();
  if(p.contractYear && (G.year - p.contractYear) < 1){
    alert(esc(p.name)+' just signed a deal — his camp wants at least a year before revisiting terms.');
    return;
  }
  const y1 = scheduleSalary(sched, 0);
  const lowersCurrentHit = y1 < p.salary;
  if(!lowersCurrentHit && verdict.tier === 'reject'){
    alert(esc(p.name)+'\'s camp turned this down flat — that\'s well under what they consider fair value. Try raising the total or the guaranteed share.');
    return;
  }
  if(!lowersCurrentHit && verdict.tier === 'counter'){
    alert(esc(p.name)+'\'s camp says they are close but want about '+money(verdict.gap)+' more in total value — bump the value slider or add more guaranteed money and try again.');
    return;
  }
  p.contract = sched;
  p.years = newYears;
  p.salary = scheduleSalary(sched, 0);

function accrueMonthlyFinance(monthLabel){

  const stadiumMult = (STADIUM_TIERS[G.stadiumLevel||0]||STADIUM_TIERS[0]).gateMult * capacityGateMult();

  const staffCost = Math.round((staffPayroll()/4) * 10) / 10;
  const opsCost = Math.round(((market*0.8 + loyaltyCost)/4) * 10) / 10;
  const net = Math.round((revenue - staffCost - opsCost) * 10) / 10;
  if(G.cash == null) G.cash = market * 8;
  G.cash = Math.round((G.cash + net) * 10) / 10;
  if(!G.financeLog) G.financeLog = [];
  G.financeLog.push({ season:G.season, year:G.year, month:monthLabel, revenue, staffCost, opsCost, net, cash:G.cash,
    income: { tickets:q(tickets), parking:q(parking), concessions:q(concessions), suites:q(suites), sponsorship:q(sponsAndDeals), merch:q(merch) },
    expense: { staff:staffCost, ops:Math.round((market*0.8/4)*10)/10, loyalty:q(loyaltyCost) } });
  if(G.financeLog.length > 24) G.financeLog.shift();
}

function computeDraftOrder(){

  const teams = G.teams.slice();
  const hasRecords = teams.every(t => t.lastRecord);
  let ordered;
  if(hasRecords){
    ordered = teams.slice().sort((a,b) => {
      const pctA = a.lastRecord.w / Math.max(1, a.lastRecord.w + a.lastRecord.l);
      const pctB = b.lastRecord.w / Math.max(1, b.lastRecord.w + b.lastRecord.l);
      return (pctA - pctB) || ((a.pf-a.pa) - (b.pf-b.pa)) || (Math.random()-.5);
    });

    ordered = teams.slice().sort((a,b) => a.tier - b.tier || (Math.random()-.5));
  }
