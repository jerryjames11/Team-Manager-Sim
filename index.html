  const spread = Math.max(1, Math.round(baseSpread * scoutingSpreadMult()));
  const mid = clamp(p.rating + RI(-2,2), 50, 99);
  p.proScoutLo = clamp(mid - spread, 50, 99);
  p.proScoutHi = clamp(mid + spread, 50, 99);
  p.proScoutTrue = p.rating;

function ownerHandleTag(){
  const me = meT();
  const pending = pendingUFAs(me);
  const stillPending = [];
  pending.forEach(p => {
    if(p.tagged) return;
    if(p.rating < 60){ stillPending.push(p); return; }
    const cost = userPrice(p, 1);
    if(cost <= capRoom(me) + p.salary){ resignPlayer(p.id); logOwnerMove('Re-signed '+p.name+' — '+money(cost)+'/yr.'); }
    else stillPending.push(p);
  });
  const worthTagging = stillPending.filter(p => (isPremiumFA(p) || interestedTeams(p).length > 0) && !(G.gmRejected||[]).includes('tag:'+p.id)).sort((a,b)=>b.rating-a.rating);
  if(!G.tagUsed && worthTagging.length){
    const target = worthTagging[0];
    const sal = tagSalaryFor(target);
    if(sal <= capRoom(me) + target.salary){
      const interest = interestedTeams(target).length;
      requestApproval({
        type:'tag', playerId: target.id,
        summary: 'Franchise tag '+target.name+' ('+target.pos+', '+target.rating+' OVR) — '+money(sal)+' guaranteed',
        reasoning: 'Couldn\'t get a long-term deal done at a price we could afford. '+(interest ? interest+' other club'+(interest>1?'s are':' is')+' already circling — letting him hit the market risks losing him for nothing.' : 'The tag locks him in for a year at a set price while we sort out a longer deal.')
      });
      adjustGMConfidence(-5);
      logOwnerMove('GM asked to franchise tag '+target.name+' after re-signing talks fell through — the tag should be a last resort, not the first call.');
      return;
    }
  }
  openFreeAgency();
}

    const c2 = G.fa.filter(p => p.pos===n2 && !isPremiumFA(p)).sort((a,b)=>b.rating-a.rating)[0];
    if(!c2) break;
    const cost2 = userPrice(c2, 1);
    if(cost2 > capRoom(me) || cost2 >= G.approvalThreshold) break;
    signFA(c2.id);
    logOwnerMove('Signed '+c2.name+' ('+c2.pos+') — '+money(cost2)+'/yr.');

  advanceToDraft();

function ownerHandleWeek(){

  const offer = offers.find(o => !rejected.includes('trade:'+o.fromTeam));
  if(offer){

    const askP = offer.theirAsk.map(id => { const p = me.roster.find(x=>x.id===id); return p ? p.name+' ('+p.pos+')' : '?'; });
    const giveP = offer.theirGive.map(id => { const p = them.roster.find(x=>x.id===id); return p ? p.name+' ('+p.pos+')' : '?'; });
    const askVal = offer.theirAsk.reduce((s,id)=>{ const p=me.roster.find(x=>x.id===id); return s+(p?tradeValue(p):0); },0);
    if(askVal >= G.approvalThreshold || offer.theirAsk.some(id => { const p = me.roster.find(x=>x.id===id); return p && isPremiumFA(p); })){
      requestApproval({
        type:'trade', teamIdx: offer.fromTeam,
        giveIds: offer.theirAsk, givePickIds: offer.theirAskPicks, getIds: offer.theirGive, getPickIds: offer.theirGivePicks,
        summary: esc(them.city)+' want '+askP.join(', ')+' for '+giveP.join(', '),
        reasoning: 'They came to us. Turning it down costs nothing — but a fair offer for a piece we can replace is real cap room and picks back.'

function teamContribution(p, teamAbbr){
  const seasons = (p.seasonLog||[]).filter(yr => yr.team === teamAbbr);
  const years = seasons.length;
  const games = seasons.reduce((s,yr)=>s+(yr.st.gp||0), 0);
  const totals = blankStats();
  seasons.forEach(yr => Object.keys(yr.st).forEach(k => totals[k] += yr.st[k]));
  return { years, games, totals, pos: seasons.length ? seasons[seasons.length-1].pos : p.pos };
}
function inductRingOfHonor(pid){

  const tc = teamContribution(p, meT().abbr);
  if(!G.franchiseHistory) G.franchiseHistory = { banners:[], ringOfHonor:[], ownershipLog:[] };
  G.franchiseHistory.ringOfHonor.push({ id:p.id, name:p.name, pos:p.pos, tenure: p.joinYear+'–'+p.retiredYear, finalRating:p.rating, inductedYear:G.year, years:tc.years, games:tc.games, stats:tc.totals });
  G.recentRetirees.splice(idx,1);
  save(); render();
}

function ownerAdvance(){

    case 'tag': ownerHandleTag(); break;
    case 'fa': ownerHandleFA(); break;

    case 'preseason': ownerHandlePreseason(); break;
    case 'cutdown': retryCutdown(); break;

    case 'playoffs': ownerHandlePlayoffs(); break;

/* ----- deterministic noise so forecasts don't flicker between renders ----- */
function wxHash(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h>>>0) % 10000) / 10000; }
function wxNoise(key){ return (wxHash(key) - .5) * 2; } // -1..1

function climateIdx(date){ const m = date.getMonth(); return m === 7 ? 0 : m === 8 ? 1 : m === 9 ? 2 : m === 10 ? 3 : m === 11 ? 4 : 5; }

// Roll the real weather for a game at home team ti on a date, in a kickoff slot.
function rollWeather(ti, date, slotKey){
  const s = stadiumOf(ti), c = CLIMATE[s.climate] || CLIMATE.mid, i = climateIdx(date);
  const slot = KICKOFF_SLOTS[slotKey] || KICKOFF_SLOTS.SE;
  let temp = Math.round(c.temp[i] + gauss()*7 - (slot.tod === 'Night' ? 6 : 0) + (slot.tod === 'Early Afternoon' ? 2 : 0));
  const pPrecip = c.rain[i] + c.snow[i];
  let cond = 'Clear';
  const r = Math.random();
  if(r < pPrecip) cond = (temp <= 35 || (c.snow[i] > 0 && Math.random() < c.snow[i]/pPrecip && temp <= 40)) ? 'Snow' : 'Rain';
  else if(r < pPrecip + .25) cond = 'Cloudy';
  if(cond === 'Snow') temp = Math.min(temp, 34);
  const windy = Math.random() < c.wind + (s.windy||0);
  const wind = windy ? RI(15, 28) : RI(2, 11);
  return { temp, cond, wind, pPrecip };
}
// Turn raw weather into what the game is actually played in (domes/roofs shield it).
function playConditions(ti, raw, slotKey){
  const s = stadiumOf(ti);
  const slot = KICKOFF_SLOTS[slotKey] || KICKOFF_SLOTS.SE;
  let roof = null, indoor = false;
  if(s.type === 'dome'){ indoor = true; roof = 'fixed'; }
  else if(s.type === 'retractable'){
    const close = raw.cond === 'Rain' || raw.cond === 'Snow' || raw.temp < 55 || raw.temp > 86 || raw.wind >= 18;
    roof = close ? 'closed' : 'open'; indoor = close;
  }
  return {
    home: ti, stadium: stadiumName(ti), type: s.type, surface: s.surface, cap: s.cap, tier: stadiumTier(ti), alt: s.alt||0, climate: s.climate,
    slot: slotKey, slotLabel: slot.label, time: slot.time, tod: slot.tod,
    roof, indoor,
    temp: indoor ? 72 : raw.temp,
    cond: indoor ? 'Indoors' : raw.cond,
    wind: indoor ? 0 : raw.wind,
    outside: { temp: raw.temp, cond: raw.cond, wind: raw.wind }
  };
}

/* ----- schedule tie-in: slots + hidden true weather assigned once per season ----- */
function gameKey(g, w){ return G.year + ':' + w + ':' + g.a + '-' + g.b; }
function assignScheduleConditions(){
  if(!G.schedule) return;
  const primeCount = {};
  G.schedule.forEach((wk, wi) => {
    const date = weekDate(G.year, wi+1);
    const scored = wk.map(g => ({ g, s: (G.teams[g.a].market||3) + (G.teams[g.b].market||3) + (ovr(G.teams[g.a]) + ovr(G.teams[g.b]))/40 + Math.random()*3 }))
      .sort((x,y) => y.s - x.s);
    const primes = ['SNF','MNF','TNF'];
    scored.forEach(o => {
      const g = o.g;
      let slot = null;
      if(primes.length && (primeCount[g.a]||0) < 4 && (primeCount[g.b]||0) < 4){ slot = primes.shift(); primeCount[g.a] = (primeCount[g.a]||0)+1; primeCount[g.b] = (primeCount[g.b]||0)+1; }
      if(!slot) slot = Math.random() < .55 ? 'SE' : 'SL';
      g.slot = slot;
      g.wxT = rollWeather(g.a, date, slot);
      g.key = gameKey(g, wi+1);
    });
  });
}
function ensureScheduleConditions(){
  if(!G || !G.schedule || !G.schedule.length) return;
  if(G.schedule[0][0] && G.schedule[0][0].slot) return;
  assignScheduleConditions();
}
// Lazily attach conditions to preseason/playoff games, which are built elsewhere.
function ensureGameConditions(g, date, defaultSlot){
  if(!g.slot) g.slot = defaultSlot || (date.getMonth() === 7 ? 'PRE' : (Math.random() < .5 ? 'SL' : 'SNF'));
  if(!g.wxT) g.wxT = rollWeather(g.a, date, g.slot);
  if(!g.key) g.key = G.year + ':x:' + g.a + '-' + g.b + ':' + date.getMonth() + date.getDate();
  return g;
}
// Final, played conditions (small kickoff drift from the forecast truth).
function finalConditions(g, date, defaultSlot){
  ensureGameConditions(g, date, defaultSlot);
  if(!g.wx){
    const raw = { temp: g.wxT.temp + RI(-2,2), cond: g.wxT.cond, wind: Math.max(0, g.wxT.wind + RI(-3,3)) };
    g.wx = playConditions(g.a, raw, g.slot);
  }
  return g.wx;
}
// Forecast as seen daysOut days before kickoff. Converges on the truth as the day nears.
function forecastFor(g, daysOut, date){
  ensureGameConditions(g, date);
  const s = stadiumOf(g.a), slot = KICKOFF_SLOTS[g.slot] || KICKOFF_SLOTS.SE;
  const T = g.wxT, k = clamp(daysOut/7, 0, 1);
  const n1 = wxNoise(g.key+':t:'+daysOut), n2 = wxNoise(g.key+':p:'+daysOut), n3 = wxNoise(g.key+':w:'+daysOut);
  const temp = Math.round(T.temp + n1*9*k);
  const wet = T.cond === 'Rain' || T.cond === 'Snow';
  const base = (T.pPrecip||.2)*100;
  let chance = wet ? base + (1-k)*(88-base) : base*(.35+.65*k);
  chance = Math.round(clamp(chance + n2*14*k, 0, 98));
  const precipType = (T.cond === 'Snow' || (temp <= 34 && !wet)) ? 'Snow' : 'Rain';
  const wind = Math.max(0, Math.round(T.wind + n3*8*k));
  const roofNote = s.type === 'dome' ? 'Dome' : s.type === 'retractable' ? 'Roof TBD' : null;
  return { temp, chance, precipType, wind, tod: slot.tod, slotLabel: slot.label, time: slot.time, type: s.type, roofNote, daysOut };
}

/* ----- gameplay effects (noticeable: ~10-15% swings) ----- */
function wxFx(wx){
  const f = { comp:0, deep:0, int:0, runY:0, fum:1, kickDist:0, kickAcc:0, punt:0, puntVar:0, inj:1, fatigue:0, score:0, notes:[] };
  if(!wx) return f;
  if(wx.surface === 'turf'){ f.runY += .25; f.inj *= 1.12; }
  if(wx.alt >= 4000){ f.kickDist += 5; f.punt += 3; f.notes.push('Thin air: kicks carry +5 yds'); }
  if(wx.indoor){ if(wx.surface === 'turf') f.notes.push('Fast turf: runs +, injuries slightly up'); return f; }
  if(wx.cond === 'Rain'){
    f.comp -= .07; f.deep -= .06; f.int += .004; f.fum *= 1.6; f.kickAcc -= .07; f.punt -= 3; f.score -= .03;
    if(wx.surface === 'grass'){ f.runY -= .5; f.notes.push('Muddy grass: run game slows'); }
    f.notes.push('Rain: passing −7%, fumbles up, kicking −7%');
  }
  if(wx.cond === 'Snow'){
    f.comp -= .09; f.deep -= .08; f.int += .005; f.runY -= .6; f.fum *= 1.5; f.kickDist -= 6; f.kickAcc -= .08; f.punt -= 5; f.score -= .05;
    f.notes.push('Snow: passing −9%, footing −, FG range −6 yds');
  }
  if(wx.wind >= 12){
    const k = (Math.min(wx.wind,30) - 10)/20;
    f.deep -= .10*k; f.comp -= .03*k; f.kickAcc -= .12*k; f.puntVar += 8*k; f.score -= .02*k;
    f.notes.push('Wind '+wx.wind+' mph: deep balls and kicks unreliable');
  }
  if(wx.temp >= 90){ f.inj *= 1.15; f.fatigue += 6; f.notes.push('Heat '+wx.temp+'°: players tire faster'); }
  if(wx.temp <= 32){ f.kickDist -= 4; f.notes.push('Frigid '+wx.temp+'°: ball flies short'); }
  if(wx.surface === 'turf') f.notes.push('Turf: runs +, injuries slightly up');
  return f;
}
// Edge adjustment (in rating/100 units) for a team on offense, from crowd noise and acclimation.
function teamEnvEdge(ti, wx){
  if(!wx) return 0;
  let e = 0;
  if(ti !== wx.home){
    e -= .012 * crowdFactor(wx.home, wx.tod === 'Night');   // road team fights the crowd
    const myClim = stadiumOf(ti).climate, myType = stadiumOf(ti).type;
    const softie = myType === 'dome' || myClim === 'warm' || myClim === 'hot';
    if(!wx.indoor && wx.temp <= 35 && softie) e -= .03;      // warm/dome club in the cold
    if(!wx.indoor && wx.temp >= 88 && (myClim === 'cold' || myClim === 'wet' || myClim === 'alpine')) e -= .015;
    if(wx.alt >= 4000) e -= .012;                             // altitude lungs
  }
  return e;
}
function wxSummaryLines(wx){
  const f = wxFx(wx), out = f.notes.slice();
  const cf = crowdFactor(wx.home, wx.tod === 'Night');
  if(cf >= 1.05) out.push('Loud house ('+wx.cap+'k'+(wx.tod==='Night'?', primetime':'')+'): road offense struggles');
  return out;
}

const RENO_PROJECTS = {

function renoAvailable(key){

function projectedNetThisPeriod(){
  const me = meT();
  const market = me.market || 3;
  const winPct = (me.w + me.l) > 0 ? me.w/(me.w+me.l) : 0.5;
  const pr = G.pricing || {tickets:1,parking:1,concessions:1,merch:1,suites:1,bundles:false};
  const stadiumMult = (STADIUM_TIERS[G.stadiumLevel||0]||STADIUM_TIERS[0]).gateMult * capacityGateMult();
  const bundleBoost = pr.bundles ? 1.08 : 1;
  const tickets = market * (2.2 + (G.fanApproval/100)*2.4 + winPct*1.2) * stadiumMult * pr.tickets * bundleBoost;
  const parking = market * 0.5 * pr.parking * bundleBoost;
  const concessions = market * 0.4 * pr.concessions * bundleBoost;
  const merch = market * 0.3 * (G.fanApproval/100) * pr.merch;
  const suites = market * 0.6 * pr.suites;
  const gate = tickets + parking + concessions + suites;
  const sponsorship = market * (0.6 + (G.fanApproval/100)*0.8) + merch + dealRevenue();
  const loyaltyCost = G.loyaltyProgram ? market*0.3 : 0;
  const revenue = Math.round(((gate + sponsorship)/4) * 10) / 10;
  const staffCost = Math.round((staffPayroll()/4) * 10) / 10;
  const opsCost = Math.round(((market*0.8 + loyaltyCost)/4) * 10) / 10;
  return Math.round((revenue - staffCost - opsCost) * 10) / 10;
}
function periodsRemainingThisSeason(){
  const wk = G.schedule ? Math.min(G.week||1, 16) : 16;

function ensureCoachPoolDepth(){

    // pull the player straight out of their current spot, regardless of where that is,

/* trade block — mark your own players available; AI availability is a light surplus-depth heuristic */
function cycleBlockStatus(pid){
  const p = meT().roster.find(x => x.id === pid);
  if(!p) return;
  if(p.onBlock){ p.onBlock = false; p.protectedAsset = true; }
  else if(p.protectedAsset){ p.protectedAsset = false; }
  else { p.onBlock = true; }
  save(); render();
}
function isProtectedForTeam(p, t){
  if(t.idx === G.userTeam) return !!p.protectedAsset;
  // AI: a genuine star, or their single best player if he's clearly good, is off the table
  const best = t.roster.filter(x=>!x.ir).sort((a,b)=>b.rating-a.rating)[0];
  return p.rating >= 88 || (best && best.id === p.id && p.rating >= 82);
}
function blockStatusHTML(p, t, interactive){
  const prot = isProtectedForTeam(p, t);
  const state = p.onBlock ? 'avail' : (prot ? 'prot' : 'neutral');
  const label = state==='avail' ? '🎯 Available' : state==='prot' ? '🔒 Protected' : 'Tradeable';
  const color = state==='avail' ? 'var(--gold)' : state==='prot' ? 'var(--red)' : 'var(--muted)';
  const bg = state==='avail' ? 'rgba(255,212,71,.12)' : state==='prot' ? 'rgba(226,85,85,.12)' : 'transparent';
  const click = interactive===false ? '' : ' onclick="cycleBlockStatus('+p.id+')"';
  return '<span class="blockstate" style="color:'+color+';background:'+bg+';border:1px solid '+color+(interactive===false?';cursor:default':'')+'"'+click+'>'+label+'</span>';

function isOnBlock(p, t){
  if(t.idx === G.userTeam) return !!p.onBlock;
  const starterCount = MIN53[p.pos] || 1;
  return posCount(t, p.pos) > starterCount && p.rating < 80;
}


/* ---------- bonus-transfer clauses: who eats the unamortized signing bonus ---------- */
const CLAUSE_PTS_PER_M = 0.9; // trade points per $1M of bonus a club agrees to carry
function bonusLeftInfo(p){
  const c = contractOf(p);
  return { amt: tradeDeadCharge(p), per: c.bonusProration||0, yrs: c.bonusYearsLeft||0 };
}
function cartClauses(cart){ if(!cart.xfer) cart.xfer = []; if(!cart.absorb) cart.absorb = []; return cart; }
function toggleXfer(pid){ const c = cartClauses(tradeCart(tradeTeam)); toggleArr(c.xfer, pid); clearTradeCounter(tradeTeam); save(); render(); }
function toggleAbsorb(pid){ const c = cartClauses(tradeCart(tradeTeam)); toggleArr(c.absorb, pid); clearTradeCounter(tradeTeam); save(); render(); }
/* change in what YOUR side is worth to them: sending them bonus money costs value, taking theirs adds value */
function clauseAdj(cart, giveP, getP){
  cartClauses(cart);
  const out = giveP.filter(p => cart.xfer.includes(p.id)).reduce((s,p) => s + tradeDeadCharge(p), 0);
  const inn = getP.filter(p => cart.absorb.includes(p.id)).reduce((s,p) => s + tradeDeadCharge(p), 0);
  return { pts: (inn - out) * CLAUSE_PTS_PER_M, out, inn };
}
/* cap hit each side carries after the deal (current year) */
function tradeCapAfter(me, them, giveP, getP, cart){
  cartClauses(cart);
  const moveHit = (p, keep) => keep ? p.salary : Math.round(((contractOf(p).base[0]) || p.salary)*10)/10;
  const deadIf = (p, keep) => keep ? 0 : tradeDeadCharge(p);
  const mine = payroll(me) - giveP.reduce((s,p)=>s+p.salary,0) + giveP.reduce((s,p)=>s+deadIf(p, cart.xfer.includes(p.id)),0) + getP.reduce((s,p)=>s+moveHit(p, cart.absorb.includes(p.id)),0);
  const theirs = payroll(them) - getP.reduce((s,p)=>s+p.salary,0) + getP.reduce((s,p)=>s+deadIf(p, cart.absorb.includes(p.id)),0) + giveP.reduce((s,p)=>s+moveHit(p, cart.xfer.includes(p.id)),0);
  return { mine, theirs };
}
function clauseRowHTML(p, kind, on){
  const b = bonusLeftInfo(p);
  if(b.amt <= 0) return '';
  const pts = (b.amt*CLAUSE_PTS_PER_M).toFixed(1);
  const label = kind === 'xfer'
    ? 'Send his bonus with him: '+money(b.amt)+' ('+money(b.per)+'/yr × '+b.yrs+'). No dead cap for you · <span style="color:var(--red)">−'+pts+' pts</span>'
    : 'Absorb his bonus: '+money(b.amt)+' ('+money(b.per)+'/yr × '+b.yrs+'). Saves them dead cap · <span style="color:var(--green)">+'+pts+' pts</span>';
  const off = kind === 'xfer'
    ? 'Unchecked: '+money(b.amt)+' accelerates onto your cap as dead money.'
    : 'Unchecked: he arrives on base salary only.';
  return '<label class="clause-row"><input type="checkbox" '+(on?'checked':'')+' onchange="'+(kind==='xfer'?'toggleXfer':'toggleAbsorb')+'('+p.id+')"><span>'+label+'<br><span class="sub">'+(on?'Clause on.':off)+'</span></span></label>';
}
function tradeSideValue(giveP, givePk, getP, getPk){
  const giveVal = giveP.reduce((s,p)=>s+tradeValue(p),0) + givePk.reduce((s,pk)=>s+pickValue(pk),0);
  const getVal = getP.reduce((s,p)=>s+tradeValue(p),0) + getPk.reduce((s,pk)=>s+pickValue(pk),0);
  return {giveVal, getVal};
}
/* shared value read used both for the live bar (as you build) and for real accept/counter/reject resolution */
function tradeVerdict(giveVal, getVal, needBonus){
  if(!giveVal && !getVal) return {tier:'empty', color:'var(--muted)', text:'No offer built yet — add players or picks below.'};
  const needed = Math.max(0, getVal + 1.5 - needBonus);
  const ratio = needed <= 0 ? 999 : giveVal / needed;
  if(ratio >= 1) return {tier:'accept', color:'var(--green)', text: ratio > 1.3 ? 'Very generous — you could probably offer less.' : 'Favorable to you — they may still ask for a bit more.'};
  if(ratio >= 0.85) return {tier:'soft', color:'var(--gold)', text:'Close — they may counter rather than accept outright.'};
  return {tier:'reject', color:'var(--red)', text:'Too light — they\'re unlikely to even counter this.'};
}
function suggestCounterAsset(teamIdx, gapValue){
  const me = meT();
  const cart = tradeCart(teamIdx);
  const availPicks = G.draftPicks.filter(pk => pk.team===me.idx && !cart.givePicks.includes(pk.id)).sort((a,b)=>pickValue(a)-pickValue(b));
  const fitPick = availPicks.find(pk => pickValue(pk) >= gapValue);
  if(fitPick) return {kind:'pick', id:fitPick.id, label: pickLabel(fitPick)};
  const availPlayers = me.roster.filter(p => !p.ir && !cart.give.includes(p.id)).sort((a,b)=>tradeValue(a)-tradeValue(b));
  const fitPlayer = availPlayers.find(p => tradeValue(p) >= gapValue);
  if(fitPlayer) return {kind:'player', id:fitPlayer.id, label: fitPlayer.name+' ('+fitPlayer.spot+')'};
  return null;
}
function executeTrade(me, them, giveP, givePk, getP, getPk, xferIds, absorbIds){
  xferIds = xferIds || []; absorbIds = absorbIds || [];
  me.roster = me.roster.filter(p => !giveP.includes(p));
  them.roster = them.roster.filter(p => !getP.includes(p));
  const keepDeal = (p, newTeam) => { p.dressed = true; p.ir = false; p.onBlock = false; p.protectedAsset = false; logEv(p,'ct','Traded with his bonus intact — '+newTeam.city+' carries the remaining '+money(tradeDeadCharge(p))+' proration',0); logEv(p,'move','Traded to '+newTeam.city,0); newTeam.roster.push(p); };
  giveP.filter(p => xferIds.includes(p.id)).forEach(p => keepDeal(p, them));
  getP.filter(p => absorbIds.includes(p.id)).forEach(p => keepDeal(p, me));
  giveP = giveP.filter(p => !xferIds.includes(p.id));
  getP = getP.filter(p => !absorbIds.includes(p.id));
  giveP.forEach(p => {
    const dead = tradeDeadCharge(p);
    if(dead > 0){ chargeDeadCap(me, dead); logEv(p,'ct','Traded away — '+money(dead)+' in unamortized bonus hits '+me.city+' as dead money',0); }
    const c = contractOf(p);
    p.salary = Math.round((c.base[0]||p.salary) * 10) / 10;
    p.contract = { base: c.base.slice(), bonusProration: 0, bonusYearsLeft: 0, totalBonus: 0 };
    p.dressed = true; p.ir = false; p.onBlock = false; p.protectedAsset = false;
    logEv(p,'move','Traded to '+them.city,0); them.roster.push(p);
  });
  getP.forEach(p => {
    const dead = tradeDeadCharge(p);
    if(dead > 0){ chargeDeadCap(them, dead); logEv(p,'ct','Traded away — '+money(dead)+' in unamortized bonus hits '+them.city+' as dead money',0); }
    const c = contractOf(p);
    p.salary = Math.round((c.base[0]||p.salary) * 10) / 10;
    p.contract = { base: c.base.slice(), bonusProration: 0, bonusYearsLeft: 0, totalBonus: 0 };
    p.dressed = true; p.ir = false; p.onBlock = false; p.protectedAsset = false;
    logEv(p,'move','Traded to '+me.city,0); me.roster.push(p);
  });
  givePk.forEach(pk => { pk.team = them.idx; });
  getPk.forEach(pk => { pk.team = me.idx; });
}
function proposeTrade(){
  if(!tradesOpen()){ alert('The trade window is closed right now.'); return; }
  const me = meT(), them = G.teams[tradeTeam];
  if(!them || them.idx === me.idx) return;
  const cart = tradeCart(tradeTeam);
  const giveP = me.roster.filter(p => cart.give.includes(p.id));
  const getP = them.roster.filter(p => cart.get.includes(p.id));
  const givePk = G.draftPicks.filter(pk => cart.givePicks.includes(pk.id) && pk.team === me.idx);
  const getPk = G.draftPicks.filter(pk => cart.getPicks.includes(pk.id) && pk.team === them.idx);
  if(!giveP.length && !givePk.length){ alert('Add at least one player or pick to send.'); return; }
  if(!getP.length && !getPk.length){ alert('Add at least one player or pick to request.'); return; }
  cartClauses(cart);
  const capAfter = tradeCapAfter(me, them, giveP, getP, cart);
  if(capAfter.mine > capNow()){ alert('That swap puts you over the cap'+(giveP.some(p=>tradeDeadCharge(p)>0 && !cart.xfer.includes(p.id))?' (dead money included). Try sending a bonus with the player.':'.')); return; }
  if(capAfter.theirs > capNow()){ alert(esc(them.city)+' can\'t fit that under their cap'+(cart.xfer.length?'. Try leaving the bonus behind.':'.')); return; }
  const sv = tradeSideValue(giveP, givePk, getP, getPk);
  const giveVal = sv.giveVal + clauseAdj(cart, giveP, getP).pts, getVal = sv.getVal;
  const need = teamNeed(them);
  const needBonus = giveP.filter(p => p.pos === need).length * 3;
  const verdict = tradeVerdict(giveVal, getVal, needBonus);
  if(verdict.tier === 'accept'){
    const tradeDead = giveP.filter(p => !cart.xfer.includes(p.id)).reduce((s,p) => s + tradeDeadCharge(p), 0);
    if(tradeDead > 0 && !confirm('Trading away '+giveP.filter(p => !cart.xfer.includes(p.id)).map(p=>p.name).join(', ')+' will charge '+money(tradeDead)+' to your cap as dead money. Continue?')) return;
    executeTrade(me, them, giveP, givePk, getP, getPk, cart.xfer.slice(), cart.absorb.slice());
    const bestGet = getP.reduce((m,p) => Math.max(m, p.rating), 0);
    const totalAssets = giveP.length + givePk.length + getP.length + getPk.length;
    bumpFan(bestGet >= 85 || totalAssets >= 4 ? 6 : (bestGet >= 75 || totalAssets >= 3 ? 2 : 0));
    const summary = (giveP.length||givePk.length ? (giveP.map(p=>p.name).concat(givePk.map(pickLabel)).join(', ')) : 'nothing') +
      ' for ' + (getP.length||getPk.length ? (getP.map(p=>p.name).concat(getPk.map(pickLabel)).join(', ')) : 'nothing');
    G.tradeCarts[tradeTeam] = {give:[], givePicks:[], get:[], getPicks:[], xfer:[], absorb:[]};
    logOwnerMove('Traded with '+them.city+': '+summary+'.');
    clearTradeCounter(tradeTeam);
    alert('Trade accepted! You send '+esc(summary)+'.');
    save(); render();
    return;
  }
  if(verdict.tier === 'soft'){
    const needed = Math.max(0, getVal + 1.5 - needBonus);
    const gap = needed - giveVal;
    const suggestion = suggestCounterAsset(tradeTeam, gap);
    if(!suggestion){
      alert(esc(them.city)+' declined — they want more value back, and you don\'t have anything small enough left to close the gap.');
      return;
    }
    if(!G.tradeCounters) G.tradeCounters = {};
    G.tradeCounters[tradeTeam] = { who: esc(them.city)+' counters', suggestion, gapValue: gap };
    save(); render();
    return;
  }
  alert(esc(them.city)+' declined — that\'s too far off the value they want back.');
}
function acceptCounter(){
  if(tradeTeam == null) return;
  const counter = tradeCounterFor(tradeTeam);
  if(!counter) return;
  const cart = tradeCart(tradeTeam);
  if(counter.suggestion.kind === 'pick') cart.givePicks.push(counter.suggestion.id);
  else cart.give.push(counter.suggestion.id);
  clearTradeCounter(tradeTeam);
  save();
  proposeTrade();
}
function walkAwayFromCounter(){
  if(tradeTeam == null) return;
  resetTradeCart();
  render();
}

/* ---------- suggest a trade ---------- */
function suggestTrade(){
  if(tradeTeam == null) return;
  const me = meT(), them = G.teams[tradeTeam];
  const myNeed = teamNeed(me), theirNeed = teamNeed(them);
  const cart = tradeCart(tradeTeam);
  cart.give = []; cart.givePicks = []; cart.get = []; cart.getPicks = [];
  let offer = me.roster.filter(p => !p.ir && theirNeed && p.pos===theirNeed).sort((a,b)=>(b.onBlock?1:0)-(a.onBlock?1:0) || b.rating-a.rating)[0];
  if(!offer) offer = me.roster.filter(p => p.onBlock).sort((a,b)=>b.rating-a.rating)[0];
  if(offer) cart.give.push(offer.id);
  let ask = them.roster.filter(p => isOnBlock(p,them) && myNeed && p.pos===myNeed).sort((a,b)=>b.rating-a.rating)[0];
  if(!ask) ask = them.roster.filter(p => isOnBlock(p,them)).sort((a,b)=>b.rating-a.rating)[0];
  if(ask) cart.get.push(ask.id);
  if(offer && ask){
    const {giveVal, getVal} = tradeSideValue([offer],[],[ask],[]);
    const needBonus = offer.pos===theirNeed ? 3 : 0;
    const gap = (getVal + 1.5) - (giveVal + needBonus);
    if(gap > 0.5){
      const myPicks = G.draftPicks.filter(pk=>pk.team===me.idx).sort((a,b)=>pickValue(a)-pickValue(b));
      const fit = myPicks.find(pk=>pickValue(pk) >= gap);
      if(fit) cart.givePicks.push(fit.id);
    } else if(gap < -3){
      const theirPicks = G.draftPicks.filter(pk=>pk.team===them.idx).sort((a,b)=>pickValue(a)-pickValue(b));
      const fit = theirPicks.find(pk=>pickValue(pk) >= -gap);
      if(fit) cart.getPicks.push(fit.id);
    }
  }
  clearTradeCounter(tradeTeam);
  if(!offer && !ask) alert('Couldn\'t find a natural fit this time — try building a package manually.');
  save(); render();
}

/* ---------- incoming (AI-initiated) offers ---------- */
function generateIncomingOffers(){
  if(!tradesOpen()) return;
  const key = G.year+':'+G.week+':'+G.phase;
  if(G.offersGenKey === key) return;
  G.offersGenKey = key;
  if(!G.incomingOffers) G.incomingOffers = [];
  if(G.incomingOffers.length >= 2) return;
  if(Math.random() > 0.35) return;
  const me = meT();
  const aiTeams = G.teams.filter(t => t.idx !== G.userTeam && !G.incomingOffers.some(o=>o.fromTeam===t.idx));
  if(!aiTeams.length) return;
  const aiTeam = pick(aiTeams);
  const need = teamNeed(aiTeam);
  let target = me.roster.filter(p => p.onBlock && !p.ir && (!need || p.pos===need)).sort((a,b)=>b.rating-a.rating)[0];
  if(!target) target = me.roster.filter(p => need && p.pos===need && !p.ir).sort((a,b)=>b.rating-a.rating)[0];
  if(!target) return;
  const targetVal = tradeValue(target);
  const offerBudget = targetVal * R(0.75, 0.95);
  const theirPicks = G.draftPicks.filter(pk => pk.team===aiTeam.idx).sort((a,b)=>pickValue(b)-pickValue(a));
  const theirPlayers = aiTeam.roster.filter(p => isOnBlock(p, aiTeam) && p.id!==target.id).sort((a,b)=>tradeValue(b)-tradeValue(a));
  let offerGive = [], offerGivePicks = [], remaining = offerBudget;
  const fitPlayer = theirPlayers.find(p => tradeValue(p) <= remaining*1.2 && tradeValue(p) >= remaining*0.5);
  if(fitPlayer){ offerGive.push(fitPlayer.id); remaining -= tradeValue(fitPlayer); }
  for(const pk of theirPicks){ if(remaining <= 1) break; offerGivePicks.push(pk.id); remaining -= pickValue(pk); }
  if(!offerGive.length && !offerGivePicks.length) return;
  G.incomingOffers.push({
    id: G.nextId++, fromTeam: aiTeam.idx,
    theirGive: offerGive, theirGivePicks: offerGivePicks,
    theirAsk: [target.id], theirAskPicks: [],
    status: 'pending'
  });
}
function resolveIncomingOffer(offerId, action){
  const off = (G.incomingOffers||[]).find(o => o.id===offerId);
  if(!off) return;
  const me = meT(), them = G.teams[off.fromTeam];
  if(action === 'decline'){
    G.incomingOffers = G.incomingOffers.filter(o => o.id!==offerId);
    save(); render(); return;
  }
  if(action === 'counter'){
    const cart = tradeCart(off.fromTeam);
    cart.get = off.theirGive.slice(); cart.getPicks = off.theirGivePicks.slice();
    cart.give = off.theirAsk.slice(); cart.givePicks = off.theirAskPicks.slice();
    G.incomingOffers = G.incomingOffers.filter(o => o.id!==offerId);
    clearTradeCounter(off.fromTeam);
    tradeTeam = off.fromTeam;
    save(); render(); return;
  }
  if(action === 'accept'){
    const giveP = them.roster.filter(p => off.theirGive.includes(p.id));
    const givePk = G.draftPicks.filter(pk => off.theirGivePicks.includes(pk.id) && pk.team === them.idx);
    const getP = me.roster.filter(p => off.theirAsk.includes(p.id));
    const getPk = G.draftPicks.filter(pk => off.theirAskPicks.includes(pk.id) && pk.team === me.idx);
    if(!giveP.length && !givePk.length){ G.incomingOffers = G.incomingOffers.filter(o=>o.id!==offerId); save(); render(); return; }
    const giveSal = giveP.reduce((s,p)=>s+p.salary,0), getSal = getP.reduce((s,p)=>s+p.salary,0);
    if(payroll(them) - giveSal + getSal > capNow() || payroll(me) - getSal + giveSal > capNow()){
      alert('That trade no longer fits under the cap — declining it for you.');
      G.incomingOffers = G.incomingOffers.filter(o => o.id!==offerId);
      save(); render(); return;
    }
    const tradeDead = getP.reduce((s,p) => s + tradeDeadCharge(p), 0);
    if(tradeDead > 0 && !confirm('Sending out '+getP.map(p=>p.name).join(', ')+' will charge '+money(tradeDead)+' to your cap as dead money. Continue?')) return;
    executeTrade(me, them, getP, getPk, giveP, givePk);
    G.incomingOffers = G.incomingOffers.filter(o => o.id!==offerId);
    logOwnerMove('Accepted trade offer from '+them.city+'.');
    alert('Trade accepted with '+esc(them.city)+'!');
    save(); render();
  }
}

function playerTrainCost(rating){
  if(rating <= 60) return 2;
  if(rating <= 70) return 3;
  if(rating <= 80) return 4;
  if(rating <= 90) return 5;
  return 6; // 91-99
}
function trainPlayer(pid){
  const p = meT().roster.find(x => x.id === pid);
  if(!p || p.trained >= 5 || p.rating >= 99) return;
  let cost, rawGain;
  if(G.mode === 'player'){
    cost = playerTrainCost(p.rating); rawGain = 1;
  } else {
    const coach = posCoachOf(p.pos);
    cost = (coach && coach.rating >= 78) ? 1 : 2;
    rawGain = (coach && coach.rating >= 88) ? 2 : 1;
  }
  if(G.trainPts < cost) return;
  const gain = Math.min(rawGain, 5 - p.trained);
  G.trainPts -= cost;
  p.rating = clamp(p.rating + gain, 50, 99);
  p.trained += gain;
  logEv(p, 'dev', 'Trained in practice', gain);
  save(); render();
}
const RECOVERY_COST = 2, MORALE_COST = 2, MENTOR_COST = 2;

function financeChartSVG(values, color, W, H){
  W = W || 560; H = H || 90;
  if(values.length < 2) return '<p class="sub">Not enough history yet — check back after a few periods.</p>';
  const min = Math.min(...values, 0), max = Math.max(...values, 0);
  const range = (max-min) || 1;
  const pts = values.map((v,i) => [ (i/(values.length-1)*W).toFixed(1), (H-((v-min)/range)*H*0.85 - H*0.05).toFixed(1) ]);
  const line = pts.map(p=>p.join(',')).join(' ');
  const area = '0,'+H+' '+line+' '+W+','+H;
  const zeroY = (H-((0-min)/range)*H*0.85 - H*0.05).toFixed(1);
  return '<svg class="finchart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">' +
    '<polygon points="'+area+'" fill="'+color+'" fill-opacity="0.22"/>' +
    (min<0 && max>0 ? '<line x1="0" y1="'+zeroY+'" x2="'+W+'" y2="'+zeroY+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,3"/>' : '') +
    '<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="2"/></svg>';
}

/* ---------- Player Mode: live on-field mechanics ---------- */
let livePlayState = null;
function playerLiveMechanic(){
  if(G.mode !== 'player' || !G.playerId) return 'auto';
  const myP = mePlayer();
  if(!myP || !userOnO()) return 'auto';
  if(!['QB','RB','WR','TE'].includes(myP.pos)) return 'auto';
  const lu = lineupFor(offT(), offFormOf(offT()), offFormKeyOf(offT()));
  const onField = lu.some(s => s.p && s.p.id === myP.id);
  if(!onField) return 'auto';
  if(myP.pos === 'QB') return 'qb';
  if(myP.pos === 'RB') return 'rb';
  return 'wr'; // WR or TE
}
function playerAutoPlay(){
  if(busy || !GM || GM.over) return;
  busy = true;
  const oc = aiOffCall(), dc = aiDefCall();
  const res = resolvePlay(oc, dc);
  animatePlay(res, () => {
    applyPlay(res); busy = false; checkAITurn(); updateGameUI();
    if(coachSimPausedFor4th || coachSimPausedForPlayer){ coachSimPausedFor4th = false; coachSimPausedForPlayer = false; coachSimStep(); }
  });
}
function playerAutoPunt(){
  if(busy || !GM || GM.over) return;
  doPunt();
}
function playerAutoFG(){
  if(busy || !GM || GM.over) return;

}
function renderPlayerOffenseCallsheet(){
  const grid = document.getElementById('playgrid');
  const title = document.getElementById('cs-title');
  const side = document.getElementById('cs-side');
  const myP = mePlayer();

  if(GM.down === 4){
    const choice = aiFourthDown();
    if(choice === 'punt'){
      title.textContent = 'Coach Calls: Punt';
      side.textContent = 'flip the field';
      grid.innerHTML = '<button class="play st" onclick="playerAutoPunt()">▶ Punt It Away<small>coach\'s call</small></button>';
      return;
    }
    if(choice === 'fg'){
      const dist = (100-GM.spot)+17;
      if(myP && myP.pos === 'K'){
        title.textContent = dist+'-Yard Field Goal Attempt';
        side.textContent = 'your kick';
        livePlayState = buildKickState('fg');
        grid.innerHTML = kickPreSnapHTML();
      } else {
        title.textContent = 'Coach Calls: Field Goal ('+dist+' yds)';
        side.textContent = 'not your moment';
        grid.innerHTML = '<button class="play st" onclick="playerAutoFG()">▶ Attempt the Kick<small>your kicker\'s call</small></button>';
      }
      return;
    }
    // choice === 'go' falls through to the normal mechanic below
  }

  const mech = playerLiveMechanic();
  if(mech === 'auto'){
    title.textContent = 'Your Team Has the Ball';
    side.textContent = 'coach calls it';
    grid.innerHTML = '<button class="play st" onclick="playerAutoPlay()">▶ Run the Play<small>let the coach call it</small></button>';
    return;
  }
  const oc = aiOffCall();
  if(OFF_PLAYS[oc].fam === 'run'){
    if(mech === 'rb'){
      const dc = aiDefCall();
      livePlayState = buildRBPlayState(oc, dc);
      title.textContent = 'Coach Calls: ' + OFF_PLAYS[oc].label;
      side.textContent = 'your read';
      grid.innerHTML = '<div class="qblive"><button class="play st" onclick="takeHandoff()">🏈 Take the Handoff<small>read the hole, then pick a lane</small></button></div>';
      return;
    }
    title.textContent = 'Coach Calls: ' + OFF_PLAYS[oc].label;
    side.textContent = 'handoff';
    grid.innerHTML = '<button class="play st" onclick="playerRunHandoff(\''+oc+'\')">▶ Snap It<small>hand it off</small></button>';
    return;
  }
  const dc = aiDefCall();
  if(mech === 'qb'){
    livePlayState = buildQBPlayState(oc, dc);
    title.textContent = 'Coach Calls: ' + OFF_PLAYS[oc].label;
    side.textContent = 'your read';
    grid.innerHTML = '<div class="qblive"><button class="play st" onclick="snapTheBall()">🏈 Snap the Ball<small>read it, then throw when you like the window</small></button></div>';
    return;
  }
  if(mech === 'wr'){
    livePlayState = buildWRPlayState(oc, dc);
    title.textContent = 'Coach Calls: ' + OFF_PLAYS[oc].label;
    side.textContent = 'get open';
    grid.innerHTML = '<div class="qblive"><button class="play st" onclick="runYourRoute()">🏈 Run Your Route<small>signal when you\'re open</small></button></div>';
    return;
  }
  playerAutoPlay();
}
function playerRunHandoff(oc){
  if(busy || !GM || GM.over) return;

  animatePlay(res, () => {
    applyPlay(res); busy = false; checkAITurn(); updateGameUI();
    if(coachSimPausedFor4th || coachSimPausedForPlayer){ coachSimPausedFor4th = false; coachSimPausedForPlayer = false; coachSimStep(); }
  });
}
function buildQBPlayState(oc, dc){
  const off = offT(), def = defT();
  const lu = lineupFor(off, offFormOf(off), offFormKeyOf(off));
  const defAvg = defPass(def);
  function baseOpen(p, depth){ return clamp(55 + ((p?p.rating:60) - defAvg)*0.55 - depth*8, 8, 90); }
  const rb = lu.find(s => s.spot==='RB' && s.p);
  const wrs = lu.filter(s => (s.spot==='WR'||s.spot==='TE') && s.p);
  const targets = [];
  if(rb) targets.push({ key:'rb', name:rb.p.name, label:rb.spot+' · checkdown', p:rb.p, base:baseOpen(rb.p,0), vol:6 });
  if(wrs[0]) targets.push({ key:'w1', name:wrs[0].p.name, label:wrs[0].spot+' · underneath', p:wrs[0].p, base:baseOpen(wrs[0].p,1), vol:14 });
  if(wrs[1]) targets.push({ key:'w2', name:wrs[1].p.name, label:wrs[1].spot+' · deep', p:wrs[1].p, base:baseOpen(wrs[1].p,2), vol:20 });
  targets.forEach(t => t.openness = t.base);
  const myP = mePlayer();
  return { oc, dc, targets, elapsed:0, totalWindow:4.0, evadeUsed:false, evadeShown:false,
    evadeWindowStart:3.0, evadeWindowEnd:4.0, snapped:false, tickHandle:null,
    eliteQB: !!(myP && myP.rating >= 88), qbRating: myP ? myP.rating : 70 };
}

function qbTick(){
  const st = livePlayState;
  if(!st) return;
  st.elapsed += 0.1;

  const clockEl = document.getElementById('qbclock');

  const fillEl = document.getElementById('qbclockfill');
  if(fillEl) fillEl.style.width = (remaining/(st.evadeUsed?7:4)*100)+'%';
  st.targets.forEach((t,i) => {
    t.openness = clamp(t.openness + (Math.random()-0.5)*t.vol, 4, 96);

    const pctEl = document.getElementById('qbopenpct'+i);
    if(openEl){ openEl.style.width = t.openness+'%'; openEl.style.background = t.openness>=65?'var(--green)':t.openness>=35?'var(--gold)':'var(--red)'; }
    if(pctEl) pctEl.textContent = Math.round(t.openness)+'%';
  });
  if(!st.evadeUsed && st.elapsed >= st.evadeWindowStart && st.elapsed < st.evadeWindowEnd && !st.evadeShown){
    const chance = st.eliteQB ? 1.0 : 0.35;
    if(Math.random() < chance*0.3){
      st.evadeShown = true;
      const ev = document.getElementById('qbevade');
      if(ev) ev.innerHTML = '<button class="play st" onclick="qbEvade()">⚡ Step Up in the Pocket!</button>';
    }
  }
  if(st.evadeShown && st.elapsed >= st.evadeWindowEnd){
    const ev = document.getElementById('qbevade');
    if(ev) ev.innerHTML = '';
  }
  if(st.elapsed >= st.totalWindow){

    qbSacked();
  }

function qbThrow(idx){
  const st = livePlayState;
  if(!st || !st.snapped) return;
  clearInterval(st.tickHandle);
  const t = st.targets[idx];
  if(!t) return;
  const captured = t.openness;
  const compProb = clamp(captured + (st.qbRating-70)*0.25, 4, 96);
  const roll = Math.random()*100;
  const oc = t.key==='rb' ? 'sc' : (t.key==='w1' ? 'sp' : 'dp');
  let res;
  if(roll < compProb){
    const yac = Math.round(3 + captured/10 + Math.random()*8 + (t.key==='w2'?10:0));
    res = { oc, dc: st.dc, type:'pass', yards: yac, oob: Math.random()<.15, target: t.p };
  } else if(captured < 35 && roll < compProb + (100-compProb)*0.3){
    res = { oc, dc: st.dc, type:'int', yards: Math.round(R(2,14)) };
  } else {
    res = { oc, dc: st.dc, type:'inc', yards: 0 };
  }
  finishPlayerPlay(res);
}

function rbPickLane(idx){

  finishPlayerPlay({ oc: st.oc, dc: st.dc, type:'run', yards: Math.round(yards), carrier: mePlayer() });

function buildKickState(kind){
  const dist = kind==='fg' ? (100-GM.spot)+17 : 18;
  const myP = mePlayer();
  const kRate = myP ? myP.rating : 70;
  const zoneWidth = clamp(22 - (dist-30)*0.18 + (kRate-70)*0.25, 6, 30);
  return { kind:'kick', ftype:kind, dist, kRate, pos:0, dir:1, speed: 4.2, zoneWidth, tickHandle:null, kicked:false };
}
function kickPreSnapHTML(){
  return '<div class="qblive"><button class="play st" onclick="startKickMeter()">🏈 Approach the Ball<small>stop the meter dead center</small></button></div>';
}
function startKickMeter(){
  const st = livePlayState;
  if(!st || st.kind!=='kick' || st.kicked) return;
  const grid = document.getElementById('playgrid');
  const half = st.zoneWidth/2;
  grid.innerHTML = '<div class="qblive"><div class="kickbar" id="kickbar">' +
    '<div class="kickzone" style="left:'+(50-half)+'%;width:'+st.zoneWidth+'%"></div>' +
    '<div class="kickmarker" id="kickmarker" style="left:50%"></div></div>' +
    '<button class="play st" onclick="lockKick()">⚡ Kick It!</button></div>';
  st.tickHandle = setInterval(kickTick, 30);
}
function kickTick(){
  const st = livePlayState;
  if(!st || st.kind!=='kick') return;
  st.pos += st.dir * st.speed;
  if(st.pos >= 100){ st.pos = 100; st.dir = -1; }
  if(st.pos <= 0){ st.pos = 0; st.dir = 1; }
  const el = document.getElementById('kickmarker');
  if(el) el.style.left = st.pos+'%';
}
function lockKick(){
  const st = livePlayState;
  if(!st || st.kind!=='kick' || st.kicked) return;
  st.kicked = true;
  clearInterval(st.tickHandle);
  const distFromCenter = Math.abs(st.pos - 50);
  const half = st.zoneWidth/2;
  livePlayState = null;
  let made;
  if(distFromCenter <= half) made = Math.random() < clamp(.97 - Math.max(0,st.dist-45)*.006, .55, .99);
  else made = Math.random() < clamp(.45 - (distFromCenter-half)*.03 - Math.max(0,st.dist-35)*.008, .02, .5);
  GM.clock -= 6;
  busy = true;
  const kicker = mePlayer();
  if(made){
    addPts(GM.poss, st.ftype==='fg' ? 3 : 1);
    if(kicker && st.ftype==='fg') creditLive(GM.poss, kicker, { fgm: 1 });
    logMsg((st.ftype==='fg' ? st.dist+'-yd field goal' : 'Extra point') + ' is GOOD. ' + G.teams[GM.poss].abbr + ' +' + (st.ftype==='fg'?3:1) + '.', 'big');
    fieldFlash('Kick is Good','fd');
    startPossession(GM.poss===GM.home?GM.away:GM.home, 25);
  } else {
    logMsg((st.ftype==='fg' ? st.dist+'-yd field goal' : 'Extra point') + ' is NO GOOD.', 'bad');
    fieldFlash('No Good','opp');
    if(st.ftype==='fg') startPossession(defIdx(), clamp(100-GM.spot+7, 20, 80));
    else startPossession(GM.poss===GM.home?GM.away:GM.home, 25);
  }
  if(GM.clock<=0) endQuarter();
  busy = false;
  checkAITurn(); updateGameUI();
  if(coachSimPausedFor4th || coachSimPausedForPlayer){ coachSimPausedFor4th = false; coachSimPausedForPlayer = false; coachSimStep(); }
}

    capBarHTML(me);
  if(expiring.length){
    s += '<table class="tbl" style="margin-top:10px"><tr><th>Player</th><th>Pos</th><th>Age</th><th>OVR</th><th>New Deal</th><th></th></tr>';
    expiring.forEach(p => {
      const sal = marketFor(p, 1);
      s += '<tr><td>'+pn(p)+'</td><td><b>'+p.spot+'</b></td><td>'+p.age+'</td><td style="color:var(--gold);font-weight:700">'+p.rating+'</td><td>'+money(sal)+' · 2-3yr</td>' +
        '<td><button class="btn tiny primary" onclick="resignPlayer('+p.id+')">Re-sign</button></td></tr>';
    });
    s += '</table>';
  } else s += '<p class="sub" style="margin-top:8px">All your key contracts are locked up — nobody left to re-sign.</p>';
  s += '</div>';
  s += posNeedsHTML(me);
  s += '<div style="text-align:center"><button class="btn primary" onclick="advanceToTag()">Advance to Franchise Tag Window — '+fmtDate(tagStart(G.year+1))+' →</button></div>';
  return s;
}
function firedHTML(){
  const c = G.career;
  return '<div class="title-hero"><h1 class="disp" style="color:var(--red)">You\'re <span style="color:var(--red)">Fired</span></h1>' +
    '<p>The owner lost patience. Final line: '+c.w+'–'+c.l+' over '+(c.seasons)+' season'+(c.seasons===1?'':'s')+', '+c.berths+' playoff berth'+(c.berths===1?'':'s')+', '+c.titles+' title'+(c.titles===1?'':'s')+'.</p>' +
    '<div style="margin-top:18px"><button class="btn primary" onclick="store.clear();G=null;render()">Start a New Career</button></div></div>';
}

/* ---------- boot ---------- */
render();
</script>
</body>
</html>
